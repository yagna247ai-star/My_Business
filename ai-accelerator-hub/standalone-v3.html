      <div class="callout info" style="margin-top:18px">${ic('lock')}<div><b>More is on its way</b>Items unlock as you finish activities. Level 2 materials appear once it's published.</div></div>`;
    }
  };
  A.accToggle = el => { const id = el.dataset.id, open = el.getAttribute('aria-expanded') !== 'true'; el.setAttribute('aria-expanded', String(open)); $('#ap-' + id).hidden = !open; E.commit(s => { s.resOpen = open ? [...new Set([...s.resOpen, id])] : s.resOpen.filter(x => x !== id); }, { silent: true }); };
  A.copyPrompt = async el => { const g = P.libraryGroups().find(x => x.id === el.dataset.g); const ok = await U.copy(g.items[+el.dataset.i].title); C.toast(ok ? 'Prompt copied.' : 'Copy failed — select the text manually.'); };
  A.viewCode = () => C.dialog({ title: 'cookie.py', wide: true, cancel: 'Close', body: `<div class="code"><pre>${(AH.S.progress.code || '').split('\n').map(l => `<span class="ln">${U.highlightPy(l) || ' '}</span>`).join('')}</pre></div>` });

  /* ======================= LAUNCH WALL ======================= */
  P.wallFilter = P.wallFilter || 'all';
  R.launch = {
    roles: ALL, icon: 'trophy', keywords: 'showcase projects capstone',
    render() {
      const tracks = [...new Set(D.PROJECTS.map(p => p.track))];
      const list = D.PROJECTS.filter(p => P.wallFilter === 'all' || p.track === P.wallFilter).sort((a, b) => b.at - a.at);
      const covers = ['linear-gradient(135deg,#1A9A75,#0F6B52)', 'linear-gradient(135deg,#1A2466,#0D1440)', 'linear-gradient(135deg,#5B3FD1,#2B1B7A)', 'linear-gradient(135deg,#B78B3F,#7A5A1E)'];
      return `${C.header({ variant: 'navy', eyebrow: 'Launch wall', title: `<span class="hl">${D.PROJECTS.length}</span> reviewed capstones, built for real briefs`, desc: 'Every project here passed a human review. Newest first.' })}
      ${AH.S.role === 'learner' ? `<a class="cta-green" href="#/journey">${ic('rocket', 'ic-lg')}<span style="flex:1;min-width:0"><span class="big" style="display:block">Your Capstone I lands here at Level 10.</span><span class="sub" style="display:block">You're on Level 1 — every level you ship is a step towards it.</span></span>${ic('arrowRight')}</a>` : ''}
      <div class="row gap-12" style="margin-bottom:16px"><span class="section-label" id="wLbl" style="flex-shrink:0">Track</span><div class="chips" role="radiogroup" aria-labelledby="wLbl" style="flex:1;min-width:0">${[['all', 'All tracks'], ...tracks.map(c => [c, D.TRACKS.find(x => x.code === c).name])].map(([v, l]) => `<button class="chip" type="button" role="radio" aria-checked="${P.wallFilter === v}" data-action="wallFilter" data-f="${v}">${esc(l)}</button>`).join('')}</div></div>
      <div class="grid2">${list.map((p, i) => { const tk = D.TRACKS.find(x => x.code === p.track); return `<article class="card proj lift" aria-labelledby="pa-${p.id}">
        <div class="proj-cover" style="background:${covers[(p.id.charCodeAt(5) || i) % covers.length]};color:#fff;position:relative;overflow:hidden" aria-hidden="true">${C.stars(18, i + 3, 0.6)}<span class="proj-ring" style="position:relative">${U.initials(p.name)}</span></div>
        <div class="proj-body"><div class="row gap-8 wrap"><span class="badge badge-gold">${esc(p.cat)}</span><span class="badge badge-neutral">${esc(tk.name)}</span><span class="badge badge-success">${ic('check', 'ic-sm')}Reviewed ${p.score.toFixed(1)}</span></div>
          <div class="proj-title" style="font-size:18px" id="pa-${p.id}">${esc(p.title)}</div>
          <div class="proj-meta"><span>${ic('user', 'ic-sm')}${esc(p.name)}</span><span>${ic('pin', 'ic-sm')}${esc(p.city)}</span><span>${U.timeTag(p.at)}</span></div>
          <p class="proj-desc"><b>Brief:</b> ${esc(p.brief)}. ${esc(p.desc)}</p>
          <div class="proj-actions"><a class="btn btn-gold" href="#" data-action="demoOnly" data-msg="Demo data: this project has no live link." aria-label="Open ${esc(p.title)} by ${esc(p.name)} (opens in a new tab)">Open project ${ic('external', 'ic-sm')}</a>${p.video ? `<button class="btn btn-cream" type="button" data-action="demoOnly" data-msg="Demo videos aren't bundled with this page.">${ic('play', 'ic-sm')}Demo</button>` : ''}</div></div></article>`; }).join('')}</div>`;

  A.wallFilter = el => { P.wallFilter = el.dataset.f; SH.render(); const b = $(`[data-action="wallFilter"][data-f="${P.wallFilter}"]`); if (b) b.focus(); };

  P.chatHTML = compact => {

        : `<div class="sugg" role="group" aria-label="Suggested questions">${m.sugg.map(s => `<button type="button" data-action="chatSugg" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}</div>
      ${CH.ctx ? `<div class="ctx">${ic('pin', 'ic-sm')}<span>About: ${esc(CH.ctx)}</span><button type="button" data-action="ctxClear" aria-label="Remove context">${ic('x', 'ic-sm')}</button></div>` : ''}
      ${CH.img ? `<div class="att"><img src="${CH.img}" alt="Screenshot preview"><button class="btn btn-text" type="button" data-action="imgClear" aria-label="Remove screenshot">${ic('x', 'ic-sm')}</button></div>` : ''}
      <form class="chat-comp" data-form="chat">

        ${streaming ? `<button class="sq send" type="button" data-action="chatStop" aria-label="Stop answer">${ic('stop')}</button>` : `<button class="sq send" type="submit" aria-label="Send" ${CH.draft.trim() || CH.img ? '' : 'disabled'}>${ic('send')}</button>`}
      </form>
      <p class="demo-note">Never paste passwords or API keys — messages are scanned and secrets are removed. Demo replies are scripted. Enter sends · Shift+Enter for a new line.</p>
    </div>`;
  };
  P.renderChats = () => $$('[data-chat-root]').forEach(root => {
    const focused = root.contains(document.activeElement) && document.activeElement.matches('[data-chatta]');
    root.innerHTML = P.chatHTML(root.dataset.chatRoot === 'drawer'); bindChat(root);
    if (focused) { const ta = $('[data-chatta]', root); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    const ms = $('[data-msgs]', root); ms.scrollTop = ms.scrollHeight;
  });
  function bindChat(root) {
    const ta = $('[data-chatta]', root), grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 156) + 'px'; };
    grow();
    ta.addEventListener('input', () => { CH.draft = ta.value; grow(); const s = $('button[type="submit"]', root); if (s) s.disabled = !(ta.value.trim() || CH.img); });
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
    const file = $('[data-file]', root);

      const f = file.files[0]; if (!f) return;

  }
  function reply(coach, q) { for (const [re, ans] of D.REPLIES[coach]) if (re.test(q)) return ans; return D.REPLY_DEFAULT[coach]; }
  function send(text) {
    if (CH.timer) return;
    let q = (text != null ? text : CH.draft).trim(); if (!q && !CH.img) return;
    const c = AH.S.chat, coach = c.coach, th = c.threads[coach];
    let redacted = false;
    if (new RegExp(SECRET.source).test(q)) { q = q.replace(SECRET, '[secret removed]'); redacted = true; } // fresh regex: no shared lastIndex
    th.push({ id: U.uid('m'), role: 'me', text: q || '(screenshot)', img: CH.img });
    CH.draft = ''; CH.img = null;
    let full;
    if (AH.S.prefs.aiOutage) full = null;
    else if (!E.aiUse()) full = `You've used today's ${D.AI_DAILY_QUOTA} coach messages. The allowance resets at midnight IST. Meanwhile, the Cohort Feed and Wednesday office hours are great places to ask.`;
    else full = (redacted ? 'I removed something that looked like an API key from your message — keys should only live in your environment variables.\n\n' : '') + (CH.ctx ? `About ${CH.ctx}:\n\n` : '') + (q ? reply(coach, q + ' ' + CH.ctx) : 'Thanks for the screenshot. What did you expect to see, and which activity are you on?');
    E.track('coach.message', { coach, outage: AH.S.prefs.aiOutage });
    if (full == null) { th.push({ id: U.uid('m'), role: 'ai', err: true, text: 'I couldn\'t reach the AI service just now. Nothing was lost — try again in a minute, or ask your cohort in the feed.' }); E.commit(); P.renderChats(); return; }
    const msg = { id: U.uid('m'), role: 'ai', text: '', streaming: true }; th.push(msg);
    E.commit(null, { silent: true }); P.renderChats();
    const words = full.split(/(\s+)/); let i = 0;
    CH.timer = setInterval(() => {
      i += 2; msg.text = words.slice(0, i).join('');
      $$(`[data-msg="${msg.id}"] [data-txt]`).forEach(el => { el.textContent = msg.text; const ms = el.closest('[data-msgs]'); ms.scrollTop = ms.scrollHeight; });
      if (i >= words.length) finish(msg);
    }, 40);
  }
  function finish(msg) { clearInterval(CH.timer); CH.timer = null; msg.streaming = false; E.commit(null, { silent: true }); C.blip(520); P.renderChats(); }
  A.chatStop = () => { const th = AH.S.chat.threads[AH.S.chat.coach], m = th[th.length - 1]; if (m && m.streaming) { m.text += m.text ? ' …' : '(stopped)'; finish(m); } };
  A.coachPick = el => { AH.S.chat.coach = el.dataset.coach; E.commit(null, { silent: true }); P.renderChats(); const r = $(`[data-chat-root] [data-coach="${el.dataset.coach}"]`); if (r) r.focus(); };
  A.chatSugg = el => { if (!$('[data-chat-root]')) P.openCoach(''); send(el.dataset.q); };
  A.ctxClear = () => { CH.ctx = ''; P.renderChats(); };
  A.imgPick = el => $('[data-file]', el.closest('[data-chat]')).click();
  A.imgClear = () => { CH.img = null; P.renderChats(); };
  P.forms.chat = () => send();

  R.coaches = {
    roles: ['learner', 'reviewer'], icon: 'lifebuoy', keywords: 'ai help unstuck chat mentor',
    render() {
      return `${C.header({ title: AH.t('coaches'), desc: 'Three specialists, one rule: they guide, you build. Reviews are always decided by people.' })}
      <section class="card card-pad" aria-label="Coach conversation" data-chat-root="page"></section>
      <div class="grid2" style="margin-top:22px">
        <div class="card help-card lift"><div class="top"><span class="tile" aria-hidden="true">${ic('bulb')}</span><div><h2 class="h3">Ask from the exact step</h2><p class="text-2 small" style="margin-top:4px">Every activity has an "Ask about this step" button. The coach then knows the level and activity you're on.</p></div></div><a class="link" href="#/journey/1">Open Level 1 ${ic('arrowRight', 'ic-sm')}</a></div>
        <div class="card help-card lift"><div class="top"><span class="tile gold" aria-hidden="true">${ic('users')}</span><div><h2 class="h3">Prefer a human?</h2><p class="text-2 small" style="margin-top:4px">Mentor office hours run every Wednesday at 7 pm IST, and your cohort answers fast in the feed.</p></div></div><a class="link" href="#/feed">Ask the cohort ${ic('arrowRight', 'ic-sm')}</a></div>
      </div>`;
    },
    after() { P.renderChats(); }
  };

  /* Drawer (opened from the floating button or any "Ask" button) */
  let drawerReturn = null;
  P.openCoach = (ctx, coach) => {
    if (coach) AH.S.chat.coach = coach;
    if (ctx != null) CH.ctx = ctx;
    if (SH.current.key === 'coaches') { P.renderChats(); const ta = $('[data-chatta]'); if (ta) ta.focus(); return; }
    drawerReturn = document.activeElement;
    $('#drawerRoot').innerHTML = `<div class="drawer-back" data-action="drawerClose"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drT">
      <div class="drawer-head">${ic('lifebuoy')}<h2 class="h3" id="drT" style="flex:1">${esc(AH.t('coaches'))}</h2><a class="btn btn-text" href="#/coaches">Full page</a><button class="icon-btn" type="button" data-action="drawerClose" aria-label="Close">${ic('x', 'ic-sm')}</button></div>
      <div class="drawer-body" data-chat-root="drawer" style="display:flex;flex-direction:column"></div></aside>`;
    document.body.style.overflow = 'hidden'; P.renderChats();
    const ta = $('#drawerRoot [data-chatta]'); if (ta) ta.focus();
  };
  P.closeCoach = () => { if (!$('#drawerRoot').innerHTML) return; $('#drawerRoot').innerHTML = ''; document.body.style.overflow = ''; if (drawerReturn && document.contains(drawerReturn)) drawerReturn.focus(); };
  A.openCoach = el => P.openCoach(el.dataset.ctx || '', el.dataset.coach);
  A.drawerClose = (el, e) => { if (el.tagName !== 'A') e.preventDefault(); P.closeCoach(); };
})(window.AH = window.AH || {});

<script>/* js/pages/staff.js */
/* AI Accelerator Hub v3 — reviewer & program-manager workspaces */
(function (AH) {
  'use strict';
  const { U, D, E, C, SH } = AH; const { esc, ic, $, $$ } = U;
  const P = (AH.P = AH.P || {}); const R = AH.ROUTES, A = AH.A;
  P.rev = P.rev || {};
  const H = 3600000, SLA = D.WORKSPACE.reviewSlaHours;
  const sla = at => { const h = (Date.now() - at) / H; return h > SLA ? { cls: 'warn', t: 'Breached' } : h > SLA * 0.66 ? { cls: 'warn', t: 'At risk' } : { cls: 'ok', t: 'On track' }; };
  const levelName = i => `L${i} · ${D.LEVELS[i - 1].title}`;

  /* ======================= REVIEW QUEUE ======================= */
  P.revTab = P.revTab || 'pending';
  R.review = {
    roles: ['reviewer', 'pm'], icon: 'inbox', keywords: 'submissions proof rubric grade',
    count: () => E.allPending().length,
    crumb: ps => ps[0] ? `Review · ${E.findSub(ps[0]) ? E.whoName(E.findSub(ps[0]).who) : ''}` : AH.t('review'),
    render(ps) { return ps[0] ? reviewDetail(ps[0]) : queue(); },
    after(ps) { if (ps[0]) bindReview(ps[0]); }
  };
  function queue() {
    const pend = E.allPending(), dec = AH.S.decided, ro = AH.S.role === 'pm';
    const breached = pend.filter(s => sla(s.at).t !== 'On track').length;
    return `${C.header({ title: AH.t('review'), desc: `Oldest first. Target: every proof decided within ${SLA} hours. AI pre-reviews are suggestions — the decision is yours.` })}
    <div class="kpis" style="margin-bottom:20px">
      <div class="card kpi"><div class="k">Waiting</div><div class="v">${pend.length}</div><div class="d">${pend.length ? `oldest ${U.duration(Date.now() - pend[0].at)}` : 'queue clear'}</div></div>
      <div class="card kpi"><div class="k">SLA risk</div><div class="v">${breached}</div><div class="d ${breached ? 'down' : 'up'}">${breached ? 'needs attention' : 'all on track'}</div></div>
      <div class="card kpi"><div class="k">Median time to decide</div><div class="v">${D.ANALYTICS.medianApproveHours} h</div><div class="d up">within ${SLA} h target</div></div>
      <div class="card kpi"><div class="k">AI–human agreement</div><div class="v">${Math.round(D.ANALYTICS.aiPreReviewAgreement * 100)}%</div><div class="d">last 30 decisions, ±0.5</div></div>
    </div>
    ${ro ? `<div class="callout info" style="margin-bottom:14px">${ic('eye')}<div><b>Read-only for Program Managers</b>You can see the queue and assign reviewers. Scoring is limited to the Reviewer role.</div></div>` : ''}
    <div class="tabs-line" role="tablist" aria-label="Queue">${[['pending', 'Waiting', pend.length], ['decided', 'Decided', dec.length]].map(([k, l, n]) => `<button role="tab" type="button" aria-selected="${P.revTab === k}" data-action="revTab" data-tab="${k}">${l}<span class="cnt">${n}</span></button>`).join('')}</div>
    ${P.revTab === 'pending' ? (pend.length ? `<div class="card table-wrap"><table class="tbl"><caption class="sr-only">Submissions waiting for review, oldest first</caption>
      <thead><tr><th>Learner</th><th>Level</th><th>Attempt</th><th>Waiting</th><th>SLA</th><th>AI suggests</th><th>Boss</th><th></th></tr></thead>
      <tbody>${pend.map(s => { const sl = sla(s.at), ai = D.weighted(s.ai || {}); return `<tr><td><div class="row gap-12"><span class="avatar avatar-sm ${s.who === 'u-me' ? 'me' : ''}" aria-hidden="true">${U.initials(E.whoName(s.who))}</span><b>${esc(E.whoName(s.who))}</b></div></td>
        <td>${esc(levelName(s.levelIdx))}</td><td class="num">${s.attempt}${s.attempt > 1 ? ' <span class="badge badge-info">resubmission</span>' : ''}</td><td class="num">${U.duration(Date.now() - s.at)}</td><td><span class="status ${sl.cls}">${sl.t}</span></td>
        <td class="num">${ai.toFixed(2)} ${D.passes(s.ai || {}) ? '<span class="status ok">pass</span>' : '<span class="status warn">below</span>'}</td><td class="num">${s.boss ? `${s.boss.passed}/3` : '—'}</td>
        <td><a class="btn btn-ink btn-sm" href="#/review/${s.id}">${ro ? 'View' : 'Review'}</a></td></tr>`; }).join('')}</tbody></table></div>`
      : C.empty('checkCircle', 'Queue clear', 'Every submission has been decided. New ones appear here instantly.'))
    : `<div class="card table-wrap"><table class="tbl"><caption class="sr-only">Decided reviews</caption><thead><tr><th>Learner</th><th>Level</th><th>Decision</th><th>Score</th><th>Reviewer</th><th>Decided</th><th>Turnaround</th></tr></thead>
      <tbody>${dec.map(d => `<tr><td><b>${esc(E.whoName(d.who))}</b></td><td>${esc(levelName(d.levelIdx))}</td><td>${C.statusTag(d.verdict)}</td><td class="num bold">${d.avg.toFixed(2)}</td><td>${esc(d.by)}</td><td class="small">${U.timeTag(d.decidedAt)}</td><td class="num">${U.duration(d.decidedAt - d.at)}</td></tr>`).join('')}</tbody></table></div>`}`;
  }
  A.revTab = el => { P.revTab = el.dataset.tab; SH.render(); };

  function reviewDetail(id) {
    const s = E.findSub(id);
    if (!s) return C.empty('inbox', 'Submission not found', 'It may have been decided already.', `<a class="btn btn-gold btn-sm" style="margin-top:14px" href="#/review">Back to queue</a>`);
    const ro = AH.S.role === 'pm' || s.state !== 'pending';
    const st = P.rev[id] || (P.rev[id] = { scores: {}, feedback: '' });
    const scores = s.review ? s.review.scores : st.scores;
    const complete = D.RUBRIC.dims.every(d => scores[d.key]);
    const avg = complete ? D.weighted(scores) : null, pass = complete && D.passes(scores);
    const wc = U.wordCount(s.reflection), sl = sla(s.at);
    return `<div class="row gap-8" style="margin-bottom:12px"><a class="btn btn-text" href="#/review">${ic('chevLeft', 'ic-sm')}Queue</a></div>
    ${C.header({ title: `${esc(E.whoName(s.who))} · ${esc(levelName(s.levelIdx))}`, desc: `Attempt ${s.attempt} · submitted ${U.fullDate(s.at)} IST · waiting ${U.duration(Date.now() - s.at)}`, actions: `<span class="status ${sl.cls}">${sl.t}</span>${s.state !== 'pending' ? C.statusTag(s.state) : ''}` })}
    <div class="panel-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <section class="stack gap-16" aria-label="Proof">
        <div class="card card-pad stack gap-12"><h2 class="h3">Proof</h2>
          <div class="kv"><span>Repository</span><span><a class="link" href="${esc(s.repo)}" target="_blank" rel="noopener noreferrer">${esc(s.repo.replace('https://', ''))} ${ic('external', 'ic-sm')}</a></span></div>
          <div class="kv"><span>Demo</span><span>${s.deploy ? `<a class="link" href="${esc(s.deploy)}" target="_blank" rel="noopener noreferrer">${esc(s.deploy.replace('https://', ''))}</a>` : '—'}</span></div>
          <div class="kv"><span>Boss · Mould Trial</span><span>${s.boss ? `${s.boss.passed} of 3 tests` : 'Not attempted yet'}</span></div>
          <div class="kv"><span>Checklist</span><span>${s.checklist ? `${s.checklist.filter(Boolean).length} of 3 confirmed` : 'Confirmed'}</span></div>
        </div>
        <div class="card card-pad"><div class="row between"><h2 class="h3">Reflection</h2><span class="muted small">${wc} words</span></div><p style="margin-top:10px;white-space:pre-wrap">${esc(s.reflection)}</p></div>
        ${s.who === 'u-me' && AH.S.progress.code ? `<div class="card card-pad"><h2 class="h3" style="margin-bottom:10px">cookie.py ${AH.S.progress.commit ? `<span class="badge badge-neutral mono">@${esc(AH.S.progress.commit.sha)}</span>` : ''}</h2><div class="code"><pre>${(AH.S.progress.boss.code || AH.S.progress.code).split('\n').map(l => `<span class="ln">${U.highlightPy(l) || ' '}</span>`).join('')}</pre></div></div>` : ''}
        ${(s.history || []).length ? `<div class="card card-pad"><h2 class="h3">Previous attempts</h2>${s.history.map(h => `<div class="callout warn small" style="margin-top:10px">${ic('refresh', 'ic-sm')}<div><b>${C.statusTag(h.verdict)} · ${h.avg.toFixed(2)} by ${esc(h.by)} · ${U.ago(h.at)}</b>“${esc(h.feedback)}”</div></div>`).join('')}</div>` : ''}
      </section>
      <section class="card card-pad stack gap-16" aria-labelledby="rbT" style="position:sticky;top:84px">
        <div class="row between wrap gap-8"><h2 class="h3" id="rbT">Score · ${D.RUBRIC.code}</h2>${!ro ? `<button class="btn btn-soft btn-sm" type="button" data-action="useAi" data-id="${id}">${ic('sparkle', 'ic-sm')}Start from AI suggestion</button>` : ''}</div>
        <div class="rubric">${D.RUBRIC.dims.map(d => `<div class="rdim"><div class="rdim-head"><b>${esc(d.name)} <span class="muted small">· ${Math.round(d.weight * 100)}%</span></b>${s.ai ? `<span class="ai-sugg" title="AI pre-review suggestion">${ic('sparkle', 'ic-sm')}AI ${s.ai[d.key]}</span>` : ''}</div>
          <div class="rdim-levels"><span>1 · ${esc(d.l1)}</span><span>3 · ${esc(d.l3)}</span><span>5 · ${esc(d.l5)}</span></div>
          <div class="score-row" role="radiogroup" aria-label="${esc(d.name)} score">${[1, 2, 3, 4, 5].map(v => `<button type="button" role="radio" aria-checked="${scores[d.key] === v}" tabindex="${(scores[d.key] || 3) === v ? 0 : -1}" ${ro ? 'disabled' : ''} data-action="score" data-id="${id}" data-k="${d.key}" data-v="${v}" aria-label="${v}">${v}</button>`).join('')}</div></div>`).join('')}</div>
        <div class="verdict ${complete ? (pass ? 'pass' : 'fail') : ''}" aria-live="polite"><span class="big">${avg != null ? avg.toFixed(2) : '—'}</span><div><b>${!complete ? 'Score all five areas' : pass ? 'Meets the bar' : 'Below the bar'}</b><p class="small text-2">Pass rule: weighted average ≥ ${D.RUBRIC.threshold.toFixed(1)} and Boss ≥ ${D.RUBRIC.bossMin}.${complete && !pass && (scores.boss || 0) < 2 ? ' Boss score is below 2.' : ''}</p></div></div>
        ${s.review ? `<div class="callout ${s.state === 'approved' ? 'ok' : 'warn'}">${ic(s.state === 'approved' ? 'checkCircle' : 'refresh')}<div><b>${C.statusTag(s.state)} by ${esc(s.review.by)}</b>${s.review.feedback ? '“' + esc(s.review.feedback) + '”' : ''}</div></div>` : ro ? '' : `
        <div><label class="field-label" for="fbIn">Feedback to the learner</label><textarea class="textarea" id="fbIn" rows="4" placeholder="What's strong, and the one thing that would raise the score." aria-describedby="fbH">${esc(st.feedback)}</textarea><div class="field-hint" id="fbH">Required when requesting changes (20+ characters). Shown to the learner word for word.</div></div>
        <div class="row gap-12 wrap"><button class="btn btn-gold" type="button" data-action="decide" data-id="${id}" data-v="approved" ${pass ? '' : 'disabled'}>${ic('checkCircle', 'ic-sm')}Approve</button><button class="btn btn-outline" type="button" data-action="decide" data-id="${id}" data-v="needs_changes" ${complete ? '' : 'disabled'}>${ic('refresh', 'ic-sm')}Request changes</button></div>
        <p class="muted xs">Decisions are final, written to the audit log, and the learner is notified immediately. Approving awards XP through the ledger.</p>`}
      </section>
    </div>`;
  }
  function bindReview(id) { const fb = $('#fbIn'); if (fb) fb.addEventListener('input', () => { P.rev[id].feedback = fb.value; }); }
  A.score = el => { const st = P.rev[el.dataset.id]; st.scores[el.dataset.k] = +el.dataset.v; SH.render(); const b = $(`[data-action="score"][data-k="${el.dataset.k}"][data-v="${el.dataset.v}"]`); if (b) b.focus(); };
  A.useAi = el => { const s = E.findSub(el.dataset.id); P.rev[el.dataset.id].scores = { ...s.ai }; SH.render(); C.toast('AI suggestions loaded. Adjust anything you disagree with — you make the call.'); };
  A.decide = el => {
    const id = el.dataset.id, st = P.rev[id], v = el.dataset.v, s = E.findSub(id);
    if (v === 'needs_changes' && st.feedback.trim().length < 20) { const fb = $('#fbIn'); fb.setAttribute('aria-invalid', 'true'); fb.focus(); return C.toast('Write at least 20 characters of feedback so the learner knows what to change.', { tone: 'error' }); }
    C.dialog({ title: v === 'approved' ? 'Approve this proof?' : 'Request changes?', body: `${esc(E.whoName(s.who))} · ${esc(levelName(s.levelIdx))} · score <b>${D.weighted(st.scores).toFixed(2)}</b>. ${v === 'approved' ? 'This completes the level and awards XP.' : 'The learner keeps their XP and can resubmit.'}`, confirm: v === 'approved' ? 'Approve' : 'Send feedback',
      onConfirm: () => {
        let r; E.commit(() => { r = E.decide(id, st.scores, v, st.feedback.trim()); });
        if (!r.ok) return C.toast('Score is below the pass rule — approval blocked.', { tone: 'error' });
        delete P.rev[id]; C.toast(v === 'approved' ? 'Approved. The learner has been notified.' : 'Feedback sent.');
        const next = E.allPending()[0]; SH.go(next ? `#/review/${next.id}` : '#/review');
      } });
  };

  /* ======================= COHORT ANALYTICS ======================= */
  /* Recommended intervention per funnel transition (index = step that lost learners) */
  const FUNNEL_ADVICE = {
    1: 'Learners open the briefing but don\'t start the lesson. Shorten the briefing and end it with a clear "start Learn" call to action.',
    2: 'The quiz may be the blocker. Check which question fails most and add a worked example before it.',
    3: 'Learners stall before their first push. Run a 30-minute "first commit" clinic in Saturday\'s workshop.',
    4: 'Code is built but not submitted. Share two anonymised example reflections and the rubric before Friday\'s proof window.',
    5: 'Proofs are waiting on review or came back with changes. Check reviewer SLA and whether feedback names one concrete fix.'
  };
  const allLearners = () => [...D.PEERS.map(p => ({ ...p })), { id: 'u-me', name: E.me().name, city: E.me().city, xp: E.xp(), lvl: 1, act: AH.S.progress.lastAct, streak: AH.S.streak.current, status: AH.S.streak.status, last: U.dayDiff(AH.S.streak.lastDay, U.istDay()), prev: AH.S.streak.prev }];
  R.analytics = {
    roles: ['pm'], icon: 'chart', keywords: 'metrics kpi dashboard funnel retention',
    render() {
      const f = D.ANALYTICS.funnelL1.slice(); const labels = D.ACTIVITY_TYPES.map(a => a.n === 6 ? 'Approved' : a.name);
      let worst = 1; for (let i = 1; i < f.length; i++) if (1 - f[i] / f[i - 1] > 1 - f[worst] / f[worst - 1]) worst = i;
      const wa = D.ANALYTICS.weeklyActive, last = wa[wa.length - 1], prev = wa[wa.length - 2];
      const people = allLearners(), byStatus = s => people.filter(p => p.status === s).length;
      const pend = E.allPending();
      return `${C.header({ title: AH.t('analytics'), desc: `${esc(D.WORKSPACE.cohort)} · ${esc(D.WORKSPACE.tenant)} · ${D.WORKSPACE.size} enrolled. Aggregates refresh every 15 minutes.`, actions: `<button class="btn btn-outline btn-sm" type="button" data-action="funnelCsv">${ic('download', 'ic-sm')}Export CSV</button>` })}
      <div class="kpis" style="margin-bottom:20px">
        <div class="card kpi"><div class="k">Active this week</div><div class="v">${last}<span class="muted" style="font-size:18px"> / ${D.WORKSPACE.size}</span></div><div class="d ${last >= prev ? 'up' : 'down'}">${last >= prev ? '▲' : '▼'} ${Math.abs(last - prev)} vs last week</div></div>
        <div class="card kpi"><div class="k">Level 1 approved</div><div class="v">${f[5]}</div><div class="d">${Math.round((f[5] / D.WORKSPACE.size) * 100)}% of cohort</div></div>
        <div class="card kpi"><div class="k">Median review time</div><div class="v">${D.ANALYTICS.medianApproveHours} h</div><div class="d up">target ${SLA} h · ${pend.length} waiting</div></div>
        <div class="card kpi"><div class="k">Need attention</div><div class="v">${byStatus('grace') + byStatus('recovery')}</div><div class="d"><a class="link" href="#/learners">See who ${ic('arrowRight', 'ic-sm')}</a></div></div>
      </div>
      <div class="grid-12">
        <section class="card card-pad span-8" aria-labelledby="fnT"><div class="row between wrap gap-8"><h2 class="h3" id="fnT">Level 1 activity funnel</h2><div class="legend"><span><i style="background:#3D5AFE"></i>Completed</span><span><i style="background:#C99B4C"></i>Drop ≥ 25%</span></div></div>
          <div style="margin-top:14px">${C.funnel(f, labels)}</div>
          <div class="callout warn" style="margin-top:14px">${ic('bulb')}<div><b>Biggest drop: ${labels[worst - 1]} → ${labels[worst]} (−${Math.round((1 - f[worst] / f[worst - 1]) * 100)}%)</b>${esc(FUNNEL_ADVICE[worst])}</div></div></section>
        <section class="card card-pad span-4 stack gap-16" aria-labelledby="shT"><h2 class="h3" id="shT">Streak health</h2>
          ${C.bars([{ label: 'Active', value: byStatus('active'), max: people.length, blue: true }, { label: 'Frozen (protected)', value: byStatus('frozen'), max: people.length }, { label: 'Grace — at risk', value: byStatus('grace'), max: people.length }, { label: 'Recovery — paused', value: byStatus('recovery'), max: people.length }])}
          <p class="muted small">Non-punitive by design: streaks pause and recover; they never silently reset.</p></section>
        <section class="card card-pad span-8" aria-labelledby="waT"><h2 class="h3" id="waT">Weekly active learners</h2><div style="margin-top:10px">${C.lineChart(wa, wa.map((_, i) => `W${i + 1}`))}</div></section>
        <section class="card card-pad span-4 stack gap-12" aria-labelledby="rqT"><h2 class="h3" id="rqT">Review queue</h2>
          ${C.bars([{ label: 'On track', value: pend.filter(s => sla(s.at).t === 'On track').length, max: Math.max(1, pend.length), blue: true }, { label: 'At risk', value: pend.filter(s => sla(s.at).t === 'At risk').length, max: Math.max(1, pend.length) }, { label: 'Breached', value: pend.filter(s => sla(s.at).t === 'Breached').length, max: Math.max(1, pend.length) }])}
          <p class="muted small">AI–human score agreement: ${Math.round(D.ANALYTICS.aiPreReviewAgreement * 100)}%. AI never decides alone.</p><a class="link small" href="#/review">Open queue ${ic('arrowRight', 'ic-sm')}</a></section>
      </div>`;
    }
  };
  A.funnelCsv = () => { const f = D.ANALYTICS.funnelL1; U.download('level1-funnel.csv', ['activity,completed', ...D.ACTIVITY_TYPES.map((a, i) => `${a.name},${f[i]}`)].join('\n'), 'text/csv'); E.track('analytics.exported'); };

  /* ======================= LEARNERS ======================= */
  P.lrnFilter = P.lrnFilter || 'attention';
  R.learners = {
    roles: ['pm'], icon: 'users', keywords: 'students at risk nudge mentor',
    render() {
      const people = allLearners().sort((a, b) => (['recovery', 'grace', 'frozen', 'active'].indexOf(a.status) - ['recovery', 'grace', 'frozen', 'active'].indexOf(b.status)) || b.last - a.last);
      const att = p => p.status === 'grace' || p.status === 'recovery' || p.last >= 3;
      const list = P.lrnFilter === 'attention' ? people.filter(att) : people;
      const label = { active: ['ok', 'Active'], frozen: ['info', 'Protected by freeze'], grace: ['warn', 'Grace — at risk'], recovery: ['warn', 'Paused — can recover'] };
      return `${C.header({ title: AH.t('learners'), desc: 'Who might need a nudge this week. Nudges are friendly reminders, sent as a notification and recorded in the audit log.' })}
      <div class="tabs-line" role="tablist" aria-label="Filter learners">${[['attention', 'Needs attention', people.filter(att).length], ['all', 'Everyone', people.length]].map(([k, l, n]) => `<button role="tab" type="button" aria-selected="${P.lrnFilter === k}" data-action="lrnFilter" data-f="${k}">${l}<span class="cnt">${n}</span></button>`).join('')}</div>
      ${list.length ? `<div class="card table-wrap"><table class="tbl"><caption class="sr-only">Learners</caption><thead><tr><th>Learner</th><th>Where they are</th><th>XP</th><th>Streak</th><th>Last active</th><th></th></tr></thead>
      <tbody>${list.map(p => { const n = AH.S.nudged[p.id]; const [cls, txt] = label[p.status]; return `<tr><td><div class="row gap-12"><span class="avatar avatar-sm ${p.id === 'u-me' ? 'me' : ''}" aria-hidden="true">${U.initials(p.name)}</span><div><b>${esc(p.name)}</b><div class="muted xs">${esc(p.city)}</div></div></div></td>
        <td>Level ${p.lvl} · ${esc(D.ACTIVITY_TYPES[(p.act || 1) - 1].name)}</td><td class="num">${U.fmt(p.xp)}</td><td><span class="status ${cls}">${txt}</span> <span class="muted small">${p.status === 'recovery' ? `(${p.prev || p.streak} d)` : `${p.streak} d`}</span></td>
        <td class="small">${p.last === 0 ? 'Today' : `${U.plural(p.last, 'day')} ago`}</td>
        <td>${p.id === 'u-me' ? '' : n && Date.now() - n < 86400000 ? `<span class="muted small">Nudged ${U.ago(n)}</span>` : `<button class="btn btn-outline btn-sm" type="button" data-action="nudge" data-id="${p.id}">${ic('send', 'ic-sm')}Nudge</button>`}</td></tr>`; }).join('')}</tbody></table></div>`
      : C.empty('checkCircle', 'Nobody needs a nudge right now', 'Everyone is active or protected by a freeze token.')}`;
    }
  };
  A.lrnFilter = el => { P.lrnFilter = el.dataset.f; SH.render(); };
  A.nudge = el => {
    const p = D.PEERS.find(x => x.id === el.dataset.id);
    C.dialog({ title: `Nudge ${esc(p.name)}?`, body: `<label class="field-label" for="nudgeMsg">Message</label><textarea class="textarea" id="nudgeMsg" rows="3">Hi ${esc(p.name.split(' ')[0])}, we miss you in ${esc(D.WORKSPACE.cohort)}! Even 15 minutes on your next activity keeps your momentum. Need help? Reply here or join Wednesday office hours.</textarea><p class="muted xs" style="margin-top:8px">Respects the learner's quiet hours. Recorded in the audit log.</p>`, confirm: 'Send nudge',
      onConfirm: () => { E.commit(() => E.nudge(p.id)); C.toast(`Nudge sent to ${p.name}.`); } });
  };

  /* ======================= AUDIT & INTEGRITY ======================= */
  P.audTab = P.audTab || 'audit'; P.audQ = P.audQ || '';
  R.audit = {
    roles: ['pm'], icon: 'shield', keywords: 'logs ledger integrity security compliance',
    render() {
      const q = P.audQ.toLowerCase(), rows = AH.S.audit.filter(a => !q || (a.actor + a.action + a.target + a.role).toLowerCase().includes(q));
      const chain = P.chain;
      return `${C.header({ title: AH.t('audit'), desc: 'Append-only records of who did what, when — plus a cryptographic check that no XP was edited after the fact.', actions: `<button class="btn btn-outline btn-sm" type="button" data-action="auditCsv">${ic('download', 'ic-sm')}Export CSV</button>` })}
      <div class="tabs-line" role="tablist" aria-label="Audit views">${[['audit', 'Audit log', AH.S.audit.length], ['ledger', 'XP ledger integrity', AH.S.ledger.length], ['events', 'Product events', AH.S.events.length]].map(([k, l, n]) => `<button role="tab" type="button" aria-selected="${P.audTab === k}" data-action="audTab" data-tab="${k}">${l}<span class="cnt">${n}</span></button>`).join('')}</div>
      ${P.audTab === 'audit' ? `<div class="row gap-12" style="margin-bottom:12px"><label class="sr-only" for="audQ">Filter audit log</label><input class="input" id="audQ" style="max-width:360px" type="search" placeholder="Filter by person, action or target" value="${esc(P.audQ)}"></div>
        <div class="card table-wrap"><table class="tbl"><caption class="sr-only">Audit log</caption><thead><tr><th>When (IST)</th><th>Actor</th><th>Role</th><th>Action</th><th>Target</th></tr></thead>
        <tbody>${rows.slice(0, 100).map(a => `<tr><td class="small">${esc(U.fullDate(a.at))}</td><td class="bold">${esc(a.actor)}</td><td class="small text-2">${esc(a.role)}</td><td><span class="badge badge-neutral mono">${esc(a.action)}</span></td><td class="small">${esc(a.target)}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">No matching entries.</td></tr>`}</tbody></table></div>`
      : P.audTab === 'ledger' ? `<div class="card card-pad row between wrap gap-16" style="margin-bottom:14px"><div><b>Hash-chain verification</b><p class="muted small">Each entry stores the hash of the one before it. Editing any past entry breaks every hash after it.</p></div><button class="btn btn-ink" type="button" data-action="verifyChain">${ic('shield', 'ic-sm')}Verify now</button></div>
        ${chain ? `<div class="callout ${chain.ok ? 'ok' : 'warn'}" style="margin-bottom:14px" role="status">${ic(chain.ok ? 'checkCircle' : 'alert')}<div><b>${chain.ok ? `Intact — ${chain.total} entries verified` : `Broken at entry ${chain.id}`}</b>${chain.ok ? `Head hash <span class="mono">${esc(chain.head)}</span> · checked ${U.ago(chain.at)}` : 'Investigate immediately; ledger writes are frozen.'}</div></div>` : ''}
        <div class="card table-wrap"><table class="tbl"><caption class="sr-only">XP ledger for ${esc(E.me().name)}</caption><thead><tr><th>Entry</th><th>When</th><th>Source</th><th>XP</th><th>Idempotency key</th><th>Hash</th></tr></thead>
        <tbody>${AH.S.ledger.slice().reverse().map(e => `<tr><td class="mono">${esc(e.id)}</td><td class="small">${U.timeTag(e.at)}</td><td>${esc(e.source)}</td><td class="num bold">+${e.amount}</td><td class="mono">${esc(e.idem)}</td><td class="mono" title="prev ${esc(e.prev)}">${esc(e.hash.slice(0, 12))}…</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card table-wrap"><table class="tbl"><caption class="sr-only">Product events</caption><thead><tr><th>When</th><th>Event</th><th>Role</th><th>Properties</th></tr></thead>
        <tbody>${AH.S.events.slice(0, 50).map(ev => `<tr><td class="small">${U.timeTag(ev.at)}</td><td class="mono">${esc(ev.name)}</td><td class="small">${esc(ev.role)}</td><td class="mono small">${esc(JSON.stringify(ev.props))}</td></tr>`).join('') || `<tr><td colspan="4" class="muted">No events yet — use the app as a learner and come back.</td></tr>`}</tbody></table></div>`}`;
    },
    after() { const i = $('#audQ'); if (i) i.addEventListener('input', U.debounce(() => { P.audQ = i.value; SH.render(); const n = $('#audQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 200)); }
  };
  A.audTab = el => { P.audTab = el.dataset.tab; SH.render(); };
  A.verifyChain = () => { P.chain = { ...E.verifyChain(), at: Date.now() }; E.commit(() => E.audit('ledger.verified', P.chain.ok ? `intact (${P.chain.total})` : `broken at ${P.chain.id}`)); };
  A.auditCsv = () => { U.download('audit-log.csv', [['timestamp', 'actor', 'role', 'action', 'target'], ...AH.S.audit.map(a => [new Date(a.at).toISOString(), a.actor, a.role, a.action, a.target])].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv'); };
})(window.AH = window.AH || {});
</script>
<script>/* js/pages/settings.js */
/* AI Accelerator Hub v3 — settings: appearance, language, notifications, privacy (DPDP), demo controls */
(function (AH) {
  'use strict';
  const { U, D, E, C, SH } = AH; const { esc, ic } = U;
  const R = AH.ROUTES, A = AH.A;
  const sw = (key, on, label) => `<button class="switch" type="button" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-action="pref" data-key="${key}"></button>`;
  const seg = (key, cur, opts, label) => `<div class="seg-sm" role="radiogroup" aria-label="${esc(label)}">${opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${cur === v}" tabindex="${cur === v ? 0 : -1}" data-action="prefSet" data-key="${key}" data-v="${v}">${esc(l)}</button>`).join('')}</div>`;

  R.settings = {
    roles: ['learner', 'reviewer', 'pm'], icon: 'settings', keywords: 'preferences privacy language theme notifications',
    render() {
      const p = AH.S.prefs, learner = AH.S.role === 'learner', theme = U.store.get('ah3_theme', 'system');
      return `${C.header({ title: AH.t('settings'), desc: `Signed in as ${esc(E.persona().name)} · ${esc(E.persona().title)} at ${esc(D.WORKSPACE.tenant)}` })}
      <div class="settings">
        <nav class="set-nav" aria-label="Settings sections"><a href="#set-appearance">Appearance</a><a href="#set-notif">Notifications</a>${learner ? '<a href="#set-privacy">Privacy & data</a>' : ''}<a href="#set-demo">Demo controls</a></nav>
        <div class="stack gap-20">
          <section class="card card-pad" id="set-appearance" aria-labelledby="sa"><h2 class="h3" id="sa">Appearance</h2>
            <div class="set-row"><div><b>Theme</b><p>System follows your device setting.</p></div>${seg('theme', theme, [['light', 'Light'], ['dark', 'Dark'], ['system', 'System']], 'Theme')}</div>
            <div class="set-row"><div><b>Motion</b><p>Reduced turns off floating cards, confetti and orbit animation.</p></div>${seg('motion', p.motion, [['system', 'System'], ['reduced', 'Reduced'], ['full', 'Full']], 'Motion')}</div>
            <div class="set-row"><div><b>Language</b><p>Navigation and key actions switch instantly. Your progress is never affected.</p></div><label class="sr-only" for="setLang">Language</label><select class="select" id="setLang" style="width:auto" data-change="langSet">${AH.LANGS.map(l => `<option value="${l.code}" ${p.lang === l.code ? 'selected' : ''}>${esc(l.label)}</option>`).join('')}</select></div>
            <div class="set-row"><div><b>Sound effects</b><p>Short chimes for XP, likes and level-ups.</p></div>${sw('sound', p.sound, 'Sound effects')}</div>
          </section>
          <section class="card card-pad" id="set-notif" aria-labelledby="sn"><h2 class="h3" id="sn">Notifications</h2>
            <div class="set-row"><div><b>Streak reminders</b><p>Freeze used, streak at risk, recovery available. Never more than one a day.</p></div>${sw('notif.streak', p.notif.streak, 'Streak reminders')}</div>
            <div class="set-row"><div><b>Review updates</b><p>When your proof is received, approved or needs changes.</p></div>${sw('notif.reviews', p.notif.reviews, 'Review updates')}</div>
            <div class="set-row"><div><b>Community replies</b><p>Replies and reactions on your posts.</p></div>${sw('notif.community', p.notif.community, 'Community replies')}</div>
            <div class="set-row"><div><b>Quiet hours</b><p>No push or email between 10 pm and 8 am IST.</p></div>${sw('notif.quiet', p.notif.quiet, 'Quiet hours')}</div>
          </section>
          ${learner ? `<section class="card card-pad" id="set-privacy" aria-labelledby="sp"><h2 class="h3" id="sp">Privacy & data</h2>
            <div class="set-row"><div><b>Show my name in cohort standings</b><p>Off shows you as "Anonymous learner". Your XP still counts for cohort analytics.</p></div>${sw('lbVisible', p.lbVisibility !== 'private', 'Show my name in standings')}</div>
            <div class="set-row"><div><b>Global standings</b><p>Share your name, city and XP with learners in other institutions. Withdraw any time.</p></div>${sw('globalOptIn', p.globalOptIn, 'Global standings consent')}</div>
            <div class="set-row"><div><b>Download my data</b><p>Everything we hold about you — progress, XP ledger, submissions, posts — as JSON.</p></div><button class="btn btn-outline btn-sm" type="button" data-action="exportData">${ic('download', 'ic-sm')}Download</button></div>
            <div class="set-row"><div><b>Delete my account</b><p>Starts a 30-day deletion request. Your institution is told; certificates already issued stay valid.</p></div><button class="btn btn-outline btn-sm" type="button" data-action="deleteAccount" style="color:var(--danger)">Request deletion</button></div>
          </section>` : ''}
          <section class="card card-pad" id="set-demo" aria-labelledby="sd"><h2 class="h3" id="sd">Demo controls</h2><p class="muted small" style="margin-top:2px">This workspace runs on local demo data so every flow can be tried end to end.</p>
            <div class="set-row"><div><b>Simulate a missed day</b><p>See the non-punitive streak: freeze → grace → recovery. Current: ${esc(AH.S.streak.status)}, ${AH.S.streak.current} days, ${U.plural(AH.S.streak.freezes, 'freeze')}.</p></div><button class="btn btn-outline btn-sm" type="button" data-action="missDay">Miss a day</button></div>
            <div class="set-row"><div><b>Simulate AI provider outage</b><p>Coaches fail gracefully and point to human help.</p></div>${sw('aiOutage', p.aiOutage, 'Simulate AI outage')}</div>
            <div class="set-row"><div><b>Reset all demo data</b><p>Restores the starting state for every role.</p></div><button class="btn btn-outline btn-sm" type="button" data-action="resetDemo">${ic('refresh', 'ic-sm')}Reset</button></div>
          </section>
        </div>
      </div>`;
    }
  };

  A.pref = el => {
    const k = el.dataset.key;
    E.commit(s => {
      const p = s.prefs;
      if (k.startsWith('notif.')) p.notif[k.slice(6)] = !p.notif[k.slice(6)];
      else if (k === 'lbVisible') { p.lbVisibility = p.lbVisibility === 'private' ? 'cohort' : 'private'; E.audit('privacy.leaderboard_visibility', p.lbVisibility); }
      else if (k === 'globalOptIn') { p.globalOptIn = !p.globalOptIn; E.audit('consent.global_leaderboard', p.globalOptIn ? 'granted' : 'withdrawn'); }
      else p[k] = !p[k];
      E.track('settings.changed', { key: k });
    });
    AH.applyMotion();
    const again = U.$(`[data-action="pref"][data-key="${k}"]`); if (again) again.focus();
  };
  A.prefSet = el => {
    const k = el.dataset.key, v = el.dataset.v;
    if (k === 'theme') { U.store.set('ah3_theme', v); AH.applyTheme(); SH.render(); }
    else { E.commit(s => { s.prefs[k] = v; }); AH.applyMotion(); }
    const again = U.$(`[data-action="prefSet"][data-key="${k}"][data-v="${v}"]`); if (again) again.focus();
  };
  A.langSet = el => { E.commit(s => { s.prefs.lang = el.value; }); document.documentElement.lang = el.value; };
  A.exportData = () => { U.download(`ai-accelerator-hub-my-data-${U.istDay()}.json`, E.exportMyData()); E.commit(() => E.audit('privacy.data_exported', E.me().name)); C.toast('Your data export has downloaded.'); };
  A.deleteAccount = () => C.dialog({ title: 'Request account deletion?', body: 'We will delete your personal data within 30 days and confirm by email. In this demo, nothing is deleted.', confirm: 'Request deletion', danger: true, onConfirm: () => { E.commit(() => E.audit('privacy.deletion_requested', E.me().name)); C.toast('Deletion request recorded. You can cancel it within 7 days.'); } });
  A.missDay = () => { E.commit(() => E.simulateMissedDay()); C.toast(`Streak is now: ${AH.S.streak.status}.`); };
})(window.AH = window.AH || {});
</script>
<script>/* js/main.js */
/* AI Accelerator Hub v3 — composition root: theme, delegation, shortcuts, boot */
(function (AH) {
  'use strict';
  const { U, D, E, C, SH, P } = AH; const { $, esc, ic } = U; const A = AH.A;

  /* ---------- Theme & motion ---------- */
  AH.applyTheme = () => {
    const pref = U.store.get('ah3_theme', 'system');
    const dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  };
  AH.applyMotion = () => document.documentElement.classList.toggle('reduce-motion', C.reducedMotion());
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { AH.applyTheme(); SH.renderTopbar(); });

  /* ---------- Global actions ---------- */
  A.toggleTheme = () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark'; U.store.set('ah3_theme', dark ? 'light' : 'dark'); AH.applyTheme(); SH.renderTopbar(); };
  A.switchRole = el => {
    const role = el.dataset.role; if (role === AH.S.role) return closeMenus();
    E.commit(s => { s.role = role; E.audit('session.role_switched', `→ ${D.PERSONAS[role].title}`); }, { silent: true });
    closeMenus(); P.closeCoach && P.closeCoach();
    C.toast(`Now viewing as ${D.PERSONAS[role].name} · ${D.PERSONAS[role].title}`);
    SH.go('#/' + SH.home());
  };
  A.resetDemo = () => { closeMenus(); C.dialog({ title: 'Reset all demo data?', body: 'Progress, reviews, posts, notifications and the audit log return to their starting state for every role.', confirm: 'Reset', danger: true, onConfirm: () => { E.reset(); P.draft = { quiz: {}, a3: {}, a1: null, proof: null }; SH.go('#/' + SH.home()); C.toast('Demo data reset.'); } }); };
  A.signOut = () => { closeMenus(); C.dialog({ title: 'Sign out', body: 'In this demo there is no real session, so signing out simply returns you to Mission Control as the learner.', confirm: 'OK', cancel: null, onConfirm: () => A.switchRole({ dataset: { role: 'learner' } }) }); };
  A.demoOnly = (el, e) => { if (e) e.preventDefault(); C.toast(el.dataset.msg); };
  A.notifReadAll = () => { E.commit(() => E.myNotifications().forEach(n => { n.read = true; }), { silent: true }); SH.renderTopbar(); SH.renderNotifications(); };
  A.notifOpen = el => { const n = AH.S.notifications.find(x => x.id === el.dataset.id); if (!n) return; E.commit(() => { n.read = true; }, { silent: true }); closeMenus(); if (n.href) SH.go(n.href); else { SH.renderTopbar(); SH.renderNotifications(); } };
  A.streakInfo = () => {
    const st = AH.S.streak, sv = SH.streakView();
    C.dialog({ title: `${sv.text}-day streak`, cancel: 'Close', confirm: st.status === 'recovery' ? 'Recover now' : null, onConfirm: () => A.quickWin(),
      body: `<p>${esc(sv.title)}.</p><div class="kv" style="margin-top:10px"><span>Longest streak</span><span>${st.longest} days</span></div><div class="kv"><span>Freeze tokens</span><span>${st.freezes} of 7</span></div><div class="kv"><span>Last counted day</span><span>${esc(st.lastDay)}</span></div>
        <p class="muted small" style="margin-top:12px">A day counts when you finish a real activity (logins don't). Miss a day: a freeze covers it. No freeze: 48 h grace. After that, your streak pauses for 7 days and a quick win restores it in full.</p>` });
  };
  A.shortcuts = () => { closeMenus(); C.dialog({ title: 'Keyboard shortcuts', cancel: 'Close', body: `<div class="stack gap-8">${[['⌘/Ctrl K', 'Command palette'], ['/', 'Command palette'], ['g then m', 'Mission Control'], ['g then j', 'Journey'], ['g then r', 'Review queue'], ['g then a', 'Analytics'], ['g then c', 'AI coaches'], ['?', 'This help'], ['Esc', 'Close any panel']].map(([k, d]) => `<div class="kv"><span><span class="kbd" style="margin:0">${esc(k)}</span></span><span>${esc(d)}</span></div>`).join('')}</div>` }); };

  /* ---------- Menus & popovers ---------- */
  function closeMenus() {
    $('#userMenu').hidden = true; $('#userBtn').setAttribute('aria-expanded', 'false');
    $('#notifPop').hidden = true; $('#bellBtn').setAttribute('aria-expanded', 'false');
  }
  $('#userBtn').addEventListener('click', e => { e.stopPropagation(); const m = $('#userMenu'), open = m.hidden; closeMenus(); m.hidden = !open; $('#userBtn').setAttribute('aria-expanded', String(open)); if (open) { const f = m.querySelector('[role^="menuitem"]'); if (f) f.focus(); } });
  $('#bellBtn').addEventListener('click', e => { e.stopPropagation(); const m = $('#notifPop'), open = m.hidden; closeMenus(); SH.renderNotifications(); m.hidden = !open; $('#bellBtn').setAttribute('aria-expanded', String(open)); });
  $('#themeBtn').addEventListener('click', A.toggleTheme);
  $('#soundBtn').addEventListener('click', () => { E.commit(s => { s.prefs.sound = !s.prefs.sound; }, { silent: true }); SH.renderTopbar(); C.blip(660); });
  $('#langSel').addEventListener('change', e => { E.commit(s => { s.prefs.lang = e.target.value; }); document.documentElement.lang = e.target.value; });
  $('#searchBtn').addEventListener('click', () => C.palette(SH.commands()));
  $('#streakPill').addEventListener('click', A.streakInfo);
  $('#railBtn').addEventListener('click', () => E.commit(s => { s.prefs.rail = !s.prefs.rail; }));
  const openSide = () => { $('#sidebar').classList.add('is-open'); $('#overlay').hidden = false; $('#menuBtn').setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; const f = $('#sidebar a'); if (f) f.focus(); };
  const closeSide = (restore = true) => { if (!$('#sidebar').classList.contains('is-open')) return; $('#sidebar').classList.remove('is-open'); $('#overlay').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; if (restore) $('#menuBtn').focus(); };
  $('#menuBtn').addEventListener('click', openSide);
  $('#sideClose').innerHTML = ic('x', 'ic-sm');
  $('#sideClose').addEventListener('click', () => closeSide());
  $('#overlay').addEventListener('click', () => closeSide());
  $('#fab').innerHTML = `${ic('lifebuoy')}Ask a coach`;
  $('#fab').addEventListener('click', () => P.openCoach(`${AH.t(SH.current.key)} page`));
  window.addEventListener('resize', () => { if (window.innerWidth >= 1024) closeSide(false); });

  /* ---------- Event delegation ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (el && A[el.dataset.action] && !el.disabled) A[el.dataset.action](el, e);
    if (!e.target.closest('.user-wrap') && !e.target.closest('.bell-wrap')) closeMenus();
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && A[el.dataset.change]) A[el.dataset.change](el, e); });
  document.addEventListener('submit', e => {
    const f = e.target, k = f.dataset.form; if (!k) return; e.preventDefault();
    const h = P.forms && P.forms[k]; if (h) Promise.resolve(h(f)).catch(err => { console.error(err); C.toast('Something went wrong. Please try again.', { tone: 'error' }); });
  });

  /* ---------- Keyboard ---------- */
  let gPending = 0;
  const typing = el => el && (el.matches('input,textarea,select,[contenteditable="true"]'));
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return C.palette(SH.commands()); }
    if (e.key === 'Escape') {
      if ($('#modalRoot').innerHTML || $('#paletteRoot').innerHTML) return;
      if ($('#drawerRoot').innerHTML) return P.closeCoach();
      if (!$('#userMenu').hidden || !$('#notifPop').hidden) { closeMenus(); return; }
      return closeSide();
    }
    if (!typing(e.target) && !e.metaKey && !e.ctrlKey && !e.altKey) {
      if (e.key === '/') { e.preventDefault(); return C.palette(SH.commands()); }
      if (e.key === '?') { e.preventDefault(); return A.shortcuts(); }
      if (e.key === 'g') { gPending = Date.now(); return; }
      if (gPending && Date.now() - gPending < 1200) {
        gPending = 0; const map = { m: 'mission', j: 'journey', r: 'review', a: 'analytics', c: 'coaches', s: 'settings', f: 'feed' };
        if (map[e.key] && AH.ROUTES[map[e.key]].roles.includes(AH.S.role)) { e.preventDefault(); SH.go('#/' + map[e.key]); }
        return;
      }
    }
    // Roving focus for tabs & radio groups
    const group = e.target.closest('[role="tablist"],[role="radiogroup"]');
    if (group && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) {
      const items = U.$$('[role="tab"],[role="radio"]', group).filter(x => !x.disabled); const i = items.indexOf(e.target); if (i < 0) return;
      e.preventDefault();
      const n = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (i + (['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : -1) + items.length) % items.length;
      items[n].focus(); items[n].click();
    }
    // Menus: arrow navigation
    const menu = e.target.closest('[role="menu"]');
    if (menu && ['ArrowDown', 'ArrowUp'].includes(e.key)) {
      e.preventDefault(); const items = U.$$('[role^="menuitem"]', menu), i = items.indexOf(document.activeElement);
      items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
    }
  });

  /* ---------- Boot ---------- */
  window.addEventListener('hashchange', () => { P.closeCoach && P.closeCoach(); closeMenus(); closeSide(false); SH.render(); window.scrollTo(0, 0); $('#main').focus({ preventScroll: true }); });
  E.subscribe(() => SH.render());
  window.addEventListener('error', ev => { console.error('[AH]', ev.message); });
  AH.applyTheme(); AH.applyMotion();
  document.documentElement.lang = AH.S.prefs.lang;
  $('#sidebar').insertAdjacentHTML('afterbegin', C.stars(42, 3, 0.45));
  if (!location.hash) history.replaceState(null, '', '#/' + SH.home());
  SH.render();
})(window.AH = window.AH || {});
</script>
