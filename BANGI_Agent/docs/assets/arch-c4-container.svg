<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
<title id="t">Bangi v0.4 — C4 Container Diagram</title>
<desc id="d">Container view showing PWA, FastAPI, Hermes-RealEstate, Hermes-Agent, storage and external APIs.</desc>
<style>
  .bg{fill:#070A12}
  .card{fill:#0F172A;stroke:rgba(255,255,255,0.09)}
  .gold{fill:#C9A86A}.muted{fill:rgba(248,250,252,0.58)}.white{fill:#F8FAFC}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
  .pill{fill:rgba(201,168,106,0.13);stroke:rgba(201,168,106,0.26)}.emerald{fill:rgba(16,185,129,0.13);stroke:rgba(16,185,129,0.26)}
  .arrow{stroke:rgba(201,168,106,0.85);stroke-width:1.4;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C9A86A"/></marker></defs>
<rect class="bg" width="1100" height="560" rx="24"/>
<text x="28" y="32" class="sans" font-size="11" letter-spacing="0.14em" font-weight="800" fill="#C9A86A">C4 — CONTAINER  •  BANGI v0.4  •  HERMES-POWERED</text>

<!-- Top row: clients -->
<g transform="translate(28,48)">
  <rect width="320" height="84" rx="16" class="card"/>
  <text x="14" y="22" class="sans" font-size="10" letter-spacing="0.11em" font-weight="800" fill="#C9A86A">CLIENTS — &lt;40KB</text>
