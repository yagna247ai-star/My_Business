[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fakeredis>=2.37.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.9.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
