<script>/* js/ui/components.js */
/* AI Accelerator Hub v3 — shared UI components */
(function (AH) {
  'use strict';
  const { U } = AH; const { esc, ic } = U;
  const C = (AH.C = {});

  C.reducedMotion = () => AH.S.prefs.motion === 'reduced' || (AH.S.prefs.motion === 'system' && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- Toast (with optional action) ---------- */
  C.toast = (msg, opts = {}) => {
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', opts.tone === 'error' ? 'alert' : 'status');
    t.innerHTML = `<span>${esc(msg)}</span>${opts.action ? ` <button type="button" class="btn btn-sm btn-soft" style="margin-left:10px;height:28px">${esc(opts.action.label)}</button>` : ''}`;
    if (opts.action) t.querySelector('button').onclick = () => { opts.action.run(); t.remove(); };
    U.$('#toasts').appendChild(t);
    setTimeout(() => t.remove(), opts.ms || 3600);
  };

  /* ---------- Sound (off by default) ---------- */
  let actx = null;
  C.blip = (freq = 660, dur = 0.18) => {
    if (!AH.S.prefs.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  };
  C.chime = () => { C.blip(660); setTimeout(() => C.blip(880), 120); setTimeout(() => C.blip(1175, 0.3), 240); };

  /* ---------- Dialog (focus-trapped, Esc, restores focus) ---------- */
  C.dialog = ({ title, body, confirm, danger, cancel = 'Cancel', onConfirm, wide }) => {
    const ret = document.activeElement, root = U.$('#modalRoot');
    root.innerHTML = `<div class="backdrop" data-back><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT" ${wide ? 'style="width:min(100%,640px)"' : ''}>
      <h2 id="dlgT">${title}</h2><div style="margin-top:10px" class="text-2">${body}</div>
      <div class="actions">${cancel ? `<button class="btn btn-outline btn-sm" type="button" data-cancel>${esc(cancel)}</button>` : ''}${confirm ? `<button class="btn ${danger ? 'btn-danger' : 'btn-ink'} btn-sm" type="button" data-ok>${esc(confirm)}</button>` : ''}</div></div></div>`;
    const dlg = U.$('.dialog', root);
    const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey, true); if (ret && document.contains(ret)) ret.focus(); };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
      if (e.key === 'Tab') {
        const f = U.$$('button,select,textarea,input,a[href]', dlg).filter(x => !x.disabled); if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    const c = U.$('[data-cancel]', root); if (c) c.onclick = close;
    U.$('[data-back]', root).onclick = e => { if (e.target.hasAttribute('data-back')) close(); };
    const ok = U.$('[data-ok]', root); if (ok) ok.onclick = () => { if (onConfirm && onConfirm(dlg) === false) return; close(); };
    (U.$('input,select,textarea', dlg) || ok || c).focus();
    return { close, el: dlg };
  };

  /* ---------- Page header ---------- */
  C.stars = (n, seed = 1, maxO = 0.8) => {
    let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    let out = '';
    for (let i = 0; i < n; i++) {
      const size = rnd() < 0.15 ? 2.5 : rnd() < 0.5 ? 1.5 : 1, o = (0.2 + rnd() * (maxO - 0.2)).toFixed(2);
      out += `<span class="star${rnd() < 0.45 ? ' tw' : ''}" style="left:${(rnd() * 100).toFixed(2)}%;top:${(rnd() * 100).toFixed(2)}%;width:${size}px;height:${size}px;--o:${o};--d:${(3 + rnd() * 4).toFixed(1)}s;--dl:${(rnd() * 3).toFixed(1)}s"></span>`;
    }
    return `<div class="stars" aria-hidden="true">${out}</div>`;
  };
  const DECO = `<svg class="deco" viewBox="0 0 420 200" preserveAspectRatio="xMaxYMin slice" aria-hidden="true" fill="none">${Array.from({ length: 9 }, (_, i) => `<path d="M60 ${40 + i * 9} C 160 ${-10 + i * 9}, 260 ${110 + i * 9}, 440 ${20 + i * 9}" stroke="#D4AC5E" stroke-opacity="${0.12 + i * 0.03}" stroke-width="1"/>`).join('')}${Array.from({ length: 24 }, (_, i) => `<circle cx="${300 + (i % 8) * 12}" cy="${140 + Math.floor(i / 8) * 12}" r="1.6" fill="#B78B3F" fill-opacity=".35"/>`).join('')}</svg>`;
  C.header = ({ variant = 'plain', eyebrow = '', title, desc = '', actions = '', note = '' }) => `
    <section class="ph ph-${variant}" aria-labelledby="pageTitle">
      ${variant === 'cream' ? DECO : ''}${variant === 'navy' ? C.stars(60, 5, 0.85) : ''}
      <div style="position:relative" class="row between wrap gap-16">
        <div style="min-width:0;flex:1">
          ${eyebrow ? `<span class="eyebrow">${eyebrow}</span>` : ''}
          <h1 id="pageTitle">${title}</h1>
          ${desc ? `<p class="desc">${desc}</p>` : ''}
          ${note}
        </div>
        ${actions ? `<div class="row gap-8 wrap">${actions}</div>` : ''}
      </div>
    </section>
    ${AH.S.prefs.lang !== 'en' ? `<p class="callout info small" style="margin:-8px 0 18px">${ic('globe', 'ic-sm')}<span>${esc(AH.t('untranslated'))}</span></p>` : ''}`;

  C.empty = (icon, title, body = '', extra = '') => `<div class="card empty"><div class="ic-wrap">${ic(icon, 'ic-lg')}</div><h2 class="h3">${title}</h2>${body ? `<p class="text-2" style="margin-top:6px;max-width:52ch;margin-left:auto;margin-right:auto">${body}</p>` : ''}${extra}</div>`;
  C.statusTag = s => ({
    pending: '<span class="status info">In review</span>', approved: '<span class="status ok">Approved</span>',
    needs_changes: '<span class="status warn">Changes requested</span>'
  }[s] || `<span class="status mute">${esc(s)}</span>`);

  /* ---------- Charts (inline SVG, single hue, direct labels) ---------- */
  C.funnel = (values, labels) => {
    const max = Math.max(...values), w = 640, rowH = 38, h = values.length * rowH + 8, lx = 150, bw = w - lx - 70;
    return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Activity funnel: ${labels.map((l, i) => `${l} ${values[i]}`).join(', ')}">
      ${values.map((v, i) => {
        const y = i * rowH + 4, bwid = Math.max(4, (v / max) * bw), drop = i ? Math.round((1 - v / values[i - 1]) * 100) : 0;
        return `<text x="0" y="${y + 21}" class="lbl-strong">${esc(labels[i])}</text>
          <rect class="bar ${drop >= 25 ? 'alt' : ''}" x="${lx}" y="${y + 6}" width="${bwid}" height="22" rx="6"/>
          <text x="${lx + bwid + 8}" y="${y + 22}">${v}${i ? ` · −${drop}%` : ''}</text>`;
      }).join('')}</svg></div>`;
  };
  C.lineChart = (values, labels) => {
    const w = 640, h = 200, pad = 28, max = Math.max(...values) * 1.15, step = (w - pad * 2) / (values.length - 1);
    const pts = values.map((v, i) => [pad + i * step, h - pad - (v / max) * (h - pad * 2)]);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Weekly active learners: ${values.join(', ')}">
      <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D5AFE" stop-opacity=".22"/><stop offset="1" stop-color="#3D5AFE" stop-opacity="0"/></linearGradient></defs>
      ${[0.25, 0.5, 0.75, 1].map(f => `<line class="grid" x1="${pad}" x2="${w - pad}" y1="${h - pad - f * (h - pad * 2)}" y2="${h - pad - f * (h - pad * 2)}"/>`).join('')}
      <path class="area" d="${d} L${pts[pts.length - 1][0]},${h - pad} L${pad},${h - pad} Z"/>
      <path class="line" d="${d}"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3}" fill="#3D5AFE"/>`).join('')}
      <text x="${pts[pts.length - 1][0] - 4}" y="${pts[pts.length - 1][1] - 12}" text-anchor="end" class="lbl-strong">${values[values.length - 1]}</text>
      ${labels.map((l, i) => `<text x="${pad + i * step}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`).join('')}
    </svg></div>`;
  };
  C.bars = (items) => { // [{label, value, max}]
    return `<div class="stack gap-12">${items.map(it => `<div><div class="row between small"><span class="bold">${esc(it.label)}</span><span class="muted num">${esc(it.text || it.value)}</span></div>
      <div class="bar ${it.blue ? 'blue' : ''}" style="margin-top:6px" role="progressbar" aria-label="${esc(it.label)}" aria-valuemin="0" aria-valuemax="${it.max}" aria-valuenow="${it.value}"><i style="width:${Math.max(2, (it.value / it.max) * 100)}%"></i></div></div>`).join('')}</div>`;
  };

  /* ---------- Celebration (level-up / badge) ---------- */
  C.confetti = () => {
    if (C.reducedMotion()) return;
    const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
    const colors = ['#E8B94F', '#3878F6', '#8658E8', '#5EE0B5', '#FF8A80', '#FFFFFF'];
    for (let i = 0; i < 90; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + 'vw'; p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px'); p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      p.style.setProperty('--t', (2.2 + Math.random() * 1.8) + 's'); p.style.setProperty('--dl', (Math.random() * 0.6) + 's');
      box.appendChild(p);
    }
    document.body.appendChild(box); setTimeout(() => box.remove(), 5000);
  };
  C.celebrate = c => {
    const badges = (c.badges || []).map(code => AH.D.BADGES.find(b => b.code === code)).filter(Boolean);
    C.confetti(); C.chime();
    C.dialog({
      title: esc(c.title),
      body: `<div style="text-align:center"><div class="burst" aria-hidden="true">🏆</div><p>${esc(c.body)}</p>
        ${badges.length ? `<div class="row gap-8 wrap" style="justify-content:center;margin-top:14px">${badges.map(b => `<span class="badge badge-gold">${b.icon} ${esc(b.name)} · +${b.xp} XP</span>`).join('')}</div>` : ''}</div>`,
      confirm: 'See my journey', cancel: 'Close', onConfirm: () => { location.hash = '#/journey'; }
    });
  };

  /* ---------- Command palette (⌘K / Ctrl+K) ---------- */
  C.palette = commands => {
    const ret = document.activeElement; const root = U.$('#paletteRoot');
    let q = '', sel = 0, list = commands;
    const filter = () => { const s = q.trim().toLowerCase(); list = s ? commands.filter(c => (c.label + ' ' + (c.keywords || '') + ' ' + c.group).toLowerCase().includes(s)) : commands; sel = 0; };
    const draw = () => {
      const groups = [...new Set(list.map(c => c.group))];
      U.$('.palette-list', root).innerHTML = list.length ? groups.map(g => `<div class="palette-group" role="presentation">${esc(g)}</div>${list.map((c, i) => c.group !== g ? '' : `<button class="palette-item" role="option" id="pi-${i}" aria-selected="${i === sel}" data-i="${i}" type="button">${ic(c.icon || 'arrowRight')}<span>${esc(c.label)}</span>${c.hint ? `<span class="hint">${esc(c.hint)}</span>` : ''}</button>`).join('')}`).join('')
        : `<p class="muted small" style="padding:18px">No matches for “${esc(q)}”.</p>`;
      U.$('input', root).setAttribute('aria-activedescendant', list.length ? `pi-${sel}` : '');
      const s = U.$(`#pi-${sel}`, root); if (s) s.scrollIntoView({ block: 'nearest' });
    };
    const close = () => { root.innerHTML = ''; if (ret && document.contains(ret)) ret.focus(); };
    const run = i => { const c = list[i]; if (!c) return; close(); c.run(); };
    root.innerHTML = `<div class="palette-back" data-pback><div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-input">${ic('search')}<input type="text" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" placeholder="Type a command or page…" autocomplete="off" spellcheck="false"><span class="kbd">Esc</span></div>
      <div class="palette-list" id="palList" role="listbox"></div>
      <div class="palette-foot"><span>↑↓ to move</span><span>↵ to run</span><span>Esc to close</span></div></div></div>`;
    const input = U.$('input', root);
    input.addEventListener('input', () => { q = input.value; filter(); draw(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(list.length - 1, sel + 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
      else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); }
    });
    root.onclick = e => {
      const b = e.target.closest('[data-i]'); if (b) run(+b.dataset.i);
      else if (e.target.hasAttribute('data-pback')) close();
    };
    draw(); input.focus();
  };
})(window.AH = window.AH || {});
</script>
<script>/* js/ui/shell.js */
/* AI Accelerator Hub v3 — application shell: nav (per role), top bar,
   notifications, role switching, router with RBAC guard, shortcuts. */
(function (AH) {
  'use strict';
  const { U, D, E, C, t } = AH; const { esc, ic, $, $$ } = U;
  const SH = (AH.SH = {});
  AH.ROUTES = {};   // filled by page modules: { key, label, roles, icon, render(params), after?(params) }
  AH.A = {};        // action handlers: data-action="name"

  const HOME = { learner: 'mission', reviewer: 'review', pm: 'analytics' };
  const NAV = {
    learner: [
      ['g_learn', ['mission', 'journey', 'tracks', 'achievements']],
      ['g_community', ['standings', 'feed', 'launch', 'library']],
      ['g_support', ['coaches', 'settings']]
    ],
    reviewer: [
      ['g_review', ['review']],
      ['g_community', ['feed', 'launch']],
      ['g_support', ['coaches', 'settings']]
    ],
    pm: [
      ['g_program', ['analytics', 'learners', 'review', 'audit']],
      ['g_community', ['standings', 'feed', 'launch']],
      ['g_account', ['settings']]
    ]
  };
  SH.home = () => HOME[AH.S.role];

  /* ---------- Route parsing ---------- */
  SH.parse = () => {
    const h = location.hash || '';
    const parts = h.replace(/^#\/?/, '').split('/').filter(Boolean);
    return { key: parts[0] || SH.home(), params: parts.slice(1) };
  };
  SH.go = path => { if (location.hash === path) SH.render(); else location.hash = path; };

  /* ---------- Sidebar ---------- */
  function navItem(key) {
    const r = AH.ROUTES[key]; if (!r) return '';
    const active = SH.current && SH.current.key === key;
    const count = r.count ? r.count() : 0;
    return `<a href="#/${key}" class="nav-item top ${active ? 'active' : ''}" ${active ? 'aria-current="page"' : ''} title="${esc(t(key))}">${ic(r.icon)}<span class="lbl">${esc(t(key))}</span>${count ? `<span class="badge-count" aria-label="${count} pending">${count}</span>` : ''}</a>`;
  }
  SH.renderSidebar = () => {
    const role = AH.S.role;
    $('#sideNav').innerHTML = NAV[role].map(([g, keys]) => `<div class="side-group-label">${esc(t(g))}</div>${keys.map(navItem).join('')}`).join('');
    let foot = '';
    if (role === 'learner') {
      const xp = E.xp(), tier = E.tier(), next = E.nextTier();
      const pct = next ? Math.round(((xp - tier.min) / (next.min - tier.min)) * 100) : 100;
      foot = `<b>${ic('medal', 'ic-sm')} ${tier.name} tier · ${U.fmt(xp)} XP</b>${next ? `${U.fmt(next.min - xp)} XP to ${next.name}` : 'Top tier reached'}
        <div class="bar" role="progressbar" aria-label="Progress to next tier" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${Math.max(pct, 2)}%"></i></div>`;
    } else if (role === 'reviewer') {
      const pend = E.allPending(); const oldest = pend[0];
      foot = `<b>${ic('inbox', 'ic-sm')} ${U.plural(pend.length, 'proof')} waiting</b>${oldest ? `Oldest: ${U.duration(Date.now() - oldest.at)} · SLA ${D.WORKSPACE.reviewSlaHours} h` : 'Queue is clear'}`;
    } else {
      foot = `<b>${ic('shield', 'ic-sm')} ${esc(D.WORKSPACE.tenant)}</b>${esc(D.WORKSPACE.cohort)} · ${D.WORKSPACE.size} learners`;
    }
    $('#sideFoot').innerHTML = foot;
    const rb = $('#railBtn'); const rail = AH.S.prefs.rail;
    rb.innerHTML = ic(rail ? 'panelOpen' : 'panelClose', 'ic-sm');
    rb.setAttribute('aria-label', rail ? 'Expand sidebar' : 'Collapse sidebar'); rb.title = rb.getAttribute('aria-label');
    rb.setAttribute('aria-expanded', String(!rail));
    $('#app').classList.toggle('is-rail', rail);
  };

  /* ---------- Top bar ---------- */
  SH.streakView = () => {
    const st = AH.S.streak;
    return {
      active: { cls: '', icon: 'flame', text: `${st.current}`, word: ' days', title: `Streak: ${U.plural(st.current, 'day')} · ${U.plural(st.freezes, 'freeze')} saved` },
      frozen: { cls: 'frozen', icon: 'snow', text: `${st.current}`, word: ' · frozen', title: `Streak frozen at ${st.current} — a freeze token covered a missed day` },
      grace: { cls: 'grace', icon: 'clock', text: `${st.current}`, word: ' · at risk', title: 'Finish any activity by tomorrow midnight (IST) to keep your streak' },
      recovery: { cls: 'recovery', icon: 'pause', text: `${st.current}`, word: ' · paused', title: `Paused at ${st.current}. Recover it with a 2-minute quick win.` }
    }[st.status];
  };
  SH.renderTopbar = () => {
    const role = AH.S.role, p = E.persona(), r = AH.ROUTES[SH.current.key];
    $('#crumbPre').textContent = t('here');
    $('#crumbCur').textContent = r ? (r.crumb ? r.crumb(SH.current.params) : t(SH.current.key)) : '';
    $('#searchBtn').innerHTML = `${ic('search', 'ic-sm')}<span class="lbl">${esc(t('search'))}</span><span class="kbd">${/Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl'} K</span>`;
    const learner = role === 'learner';
    $('#streakPill').hidden = !learner; $('#rankPill').hidden = !learner;
    if (learner) {
      const sv = SH.streakView();
      $('#streakPill').className = `pill pill-streak ${sv.cls}`;
      $('#streakPill').innerHTML = `${ic(sv.icon, 'ic-sm')}<span><b>${sv.text}</b><span class="days-word">${sv.word}</span></span>`;
      $('#streakPill').title = sv.title; $('#streakPill').setAttribute('aria-label', sv.title);
      const rank = E.rank(), nr = D.next(D.RANKS, E.xp());
      $('#rankPill').textContent = rank.name.toUpperCase();
      $('#rankPill').title = `Rank ${rank.name}${nr ? ` · ${nr.min - E.xp()} XP to ${nr.name}` : ''}`;
    }
    $('#langSel').innerHTML = AH.LANGS.map(l => `<option value="${l.code}" ${AH.S.prefs.lang === l.code ? 'selected' : ''}>${esc(l.label)}</option>`).join('');
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('#themeBtn').innerHTML = ic(dark ? 'moon' : 'sun');
    $('#themeBtn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme'); $('#themeBtn').title = $('#themeBtn').getAttribute('aria-label');
    $('#soundBtn').innerHTML = ic(AH.S.prefs.sound ? 'volume' : 'volumeX');
    $('#soundBtn').setAttribute('aria-pressed', String(AH.S.prefs.sound)); $('#soundBtn').title = AH.S.prefs.sound ? 'Sound effects on' : 'Sound effects off';
    const unread = E.myNotifications().filter(n => !n.read).length;
    $('#bellBtn').innerHTML = `${ic('bell')}${unread ? `<span class="count">${unread > 9 ? '9+' : unread}</span>` : ''}`;
    $('#bellBtn').setAttribute('aria-label', `${t('notifications')}${unread ? `, ${unread} unread` : ''}`);
    $('#userBtn').innerHTML = `<span class="avatar avatar-sm me" aria-hidden="true">${U.initials(p.name)}</span><span class="uname">${esc(p.name)}</span><span class="role-chip ${role}">${esc(p.title)}</span>`;
    $('#userBtn').setAttribute('aria-label', `Account menu, ${p.name}, ${p.title}`);
    $('#menuBtn').innerHTML = ic('menu');
    $('#crumbChev').innerHTML = ic('chevRight', 'ic-sm');
    $('#fab').hidden = !(role !== 'pm' && !['coaches', 'review'].includes(SH.current.key));
  };

  SH.renderUserMenu = () => {
    $('#userMenu').innerHTML = `<div class="menu-label">${esc(t('switchRole'))}</div>
      ${['learner', 'reviewer', 'pm'].map(r => `<button type="button" role="menuitemradio" aria-checked="${AH.S.role === r}" data-action="switchRole" data-role="${r}">${ic(r === 'learner' ? 'user' : r === 'reviewer' ? 'inbox' : 'chart', 'ic-sm')}<span>${esc(D.PERSONAS[r].title)} <span class="muted xs">· ${esc(D.PERSONAS[r].name)}</span></span>${ic('check', 'ic-sm tick')}</button>`).join('')}
      <hr><a role="menuitem" href="#/settings">${ic('settings', 'ic-sm')}${esc(t('settings'))}</a>
      <button role="menuitem" type="button" data-action="toggleTheme">${ic('moon', 'ic-sm')}Switch theme</button>
      <button role="menuitem" type="button" data-action="shortcuts">${ic('keyboard', 'ic-sm')}Keyboard shortcuts</button>
      <button role="menuitem" type="button" data-action="resetDemo">${ic('refresh', 'ic-sm')}${esc(t('resetDemo'))}</button>
      <hr><button role="menuitem" type="button" data-action="signOut">${ic('logout', 'ic-sm')}${esc(t('signOut'))}</button>`;
  };

  SH.renderNotifications = () => {
    const list = E.myNotifications();
    $('#notifPop').innerHTML = `<div class="pop-head"><b>${esc(t('notifications'))}</b><button class="btn btn-text btn-sm" type="button" data-action="notifReadAll">${esc(t('markAll'))}</button></div>
      ${list.length ? list.slice(0, 30).map(n => `<button class="notif ${n.read ? '' : 'unread'}" type="button" data-action="notifOpen" data-id="${n.id}">
        <span class="ni ${n.tone || ''}" aria-hidden="true">${ic(n.icon || 'bell', 'ic-sm')}</span>
        <span style="flex:1;min-width:0"><b>${esc(n.title)}</b>${n.body ? `<p>${esc(n.body)}</p>` : ''}${U.timeTag(n.at)}</span>
        ${n.read ? '' : '<span class="unread-dot" aria-label="Unread"></span>'}</button>`).join('') : `<p class="muted small" style="padding:20px">You're all caught up.</p>`}`;
  };

  /* ---------- Render ---------- */
  SH.render = () => {
    SH.current = SH.parse();
    let route = AH.ROUTES[SH.current.key];
    if (!route) { SH.current = { key: SH.home(), params: [] }; route = AH.ROUTES[SH.current.key]; history.replaceState(null, '', '#/' + SH.current.key); }
    const allowed = route.roles.includes(AH.S.role);
    SH.renderSidebar(); SH.renderTopbar(); SH.renderUserMenu(); SH.renderNotifications();
    document.title = `${route.crumb ? route.crumb(SH.current.params) : t(SH.current.key)} · AI Accelerator Hub`;
    const main = $('#main');
    if (!allowed) {
      const allowedRoles = route.roles.map(r => D.PERSONAS[r].title).join(' or ');
      main.innerHTML = `<div class="forbidden card card-pad"><div class="empty"><div class="ic-wrap">${ic('lock', 'ic-lg')}</div>
        <h1 class="h2">You don't have access to ${esc(t(SH.current.key))}</h1>
        <p class="text-2" style="margin-top:8px">This area is for ${esc(allowedRoles)}. Access is enforced by role, and this attempt was recorded in the audit log.</p>
        <div class="row gap-8" style="justify-content:center;margin-top:18px"><a class="btn btn-gold btn-sm" href="#/${SH.home()}">Go to my home</a>
        <button class="btn btn-outline btn-sm" type="button" data-action="switchRole" data-role="${route.roles[0]}">Switch to ${esc(D.PERSONAS[route.roles[0]].title)}</button></div></div></div>`;
      if (SH._lastDenied !== location.hash) { SH._lastDenied = location.hash; E.audit('access.denied', `${t(SH.current.key)} (${AH.S.role})`); E.commit(null, { silent: true }); }
      return;
    }
    main.innerHTML = route.render(SH.current.params);
    if (route.after) route.after(SH.current.params);
    // Pending celebrations play once the learner is looking
    if (AH.S.role === 'learner' && AH.S.celebrations.length && !$('#modalRoot').innerHTML) {
      const c = AH.S.celebrations.shift(); E.commit(null, { silent: true }); setTimeout(() => C.celebrate(c), 250);
    }
  };

  /* ---------- Commands for the palette ---------- */
  SH.commands = () => {
    const role = AH.S.role, cmds = [];
    NAV[role].forEach(([g, keys]) => keys.forEach(k => { const r = AH.ROUTES[k]; if (r) cmds.push({ group: 'Go to', label: t(k), icon: r.icon, run: () => SH.go('#/' + k), keywords: r.keywords || '' }); }));
    if (role === 'learner') {
      cmds.push({ group: 'Actions', label: 'Continue my next activity', icon: 'arrowRight', hint: 'Level 1', run: () => SH.go(`#/journey/1/${AH.S.progress.lastAct}`) });
      cmds.push({ group: 'Actions', label: 'Ask the Code Mentor', icon: 'code', run: () => AH.P.openCoach('', 'code-mentor') });
      cmds.push({ group: 'Actions', label: 'Export my data (JSON)', icon: 'download', run: () => AH.A.exportData() });
    }
    if (role === 'reviewer' || role === 'pm') E.allPending().forEach(s => cmds.push({ group: 'Review', label: `Review ${E.whoName(s.who)} · L${s.levelIdx}`, icon: 'inbox', hint: U.ago(s.at), run: () => SH.go('#/review/' + s.id) }));
    if (role === 'pm') cmds.push({ group: 'Actions', label: 'Verify XP ledger integrity', icon: 'shield', run: () => SH.go('#/audit') });
    ['learner', 'reviewer', 'pm'].filter(r => r !== role).forEach(r => cmds.push({ group: 'Workspace', label: `Switch role to ${D.PERSONAS[r].title}`, icon: 'users', run: () => AH.A.switchRole({ dataset: { role: r } }) }));
    cmds.push({ group: 'Preferences', label: 'Toggle light / dark theme', icon: 'moon', run: () => AH.A.toggleTheme() });
    AH.LANGS.forEach(l => cmds.push({ group: 'Preferences', label: `Language: ${l.label}`, icon: 'globe', run: () => { E.commit(s => { s.prefs.lang = l.code; }); } }));
    cmds.push({ group: 'Help', label: 'Keyboard shortcuts', icon: 'keyboard', hint: '?', run: () => AH.A.shortcuts() });
    return cmds;
  };
})(window.AH = window.AH || {});

<script>/* js/pages/learner.js */
/* AI Accelerator Hub v3 — learner experience */
(function (AH) {
  'use strict';
  const { U, D, E, C, SH, t } = AH; const { esc, ic, $, $$ } = U;
  const P = (AH.P = AH.P || {});
  const R = AH.ROUTES, A = AH.A;
  const L = ['learner'];
  P.draft = P.draft || { quiz: {}, a3: {}, a1: null, proof: null };

  /* ======================= MISSION CONTROL ======================= */
  function greeting() {
    const h = new Date(Date.now() + 5.5 * 3600000).getUTCHours();

  }
  P.nextBestAction = () => {
    const p = AH.S.progress, a = p.acts;
    if (AH.S.streak.status === 'recovery') return { icon: 'pause', title: `Recover your ${AH.S.streak.prev}-day streak`, body: 'One 2-minute quick win brings it back. No penalty, no reset.', cta: 'Start quick win', action: 'quickWin' };
    if (p.levels[1] === 'approved') return { icon: 'compass', title: 'Level 1 is done — explore where it leads', body: 'Level 2 opens as soon as your program team publishes it. Meanwhile, shortlist the career tracks that excite you.', cta: 'Explore tracks', href: '#/tracks' };
    if (a[6] === 'needs_changes') return { icon: 'refresh', title: 'Your reviewer asked for changes', body: 'Read the feedback, improve your proof and resubmit. You keep every XP you earned.', cta: 'Open feedback', href: '#/journey/1/5' };
    if (a[6] === 'in_review' && p.boss.best < 3) return { icon: 'trophy', title: 'While your proof is reviewed, beat the Mould Trial', body: `Boss challenge: ${p.boss.attempts}/${D.L1.acts[6].attempts} attempts used. A 3/3 pass adds +${D.L1.acts[6].bossXp} XP on approval.`, cta: 'Take on the Boss', href: '#/journey/1/6' };
    if (a[6] === 'in_review') return { icon: 'clock', title: 'Your proof is with a reviewer', body: `Target turnaround: under ${D.WORKSPACE.reviewSlaHours} hours. You will get a notification the moment it's decided.`, cta: 'View status', href: '#/journey/1/6' };
    const n = [1, 2, 3, 4, 5].find(k => a[k] === 'available') || 1;
    const at = D.ACTIVITY_TYPES[n - 1], act = D.L1.acts[n];
    return { icon: at.icon, title: `${at.name}: ${act.title}`, body: `Level 1 · activity ${n} of 6 · +${act.xp} XP`, cta: t('continue'), href: `#/journey/1/${n}` };
  };
  function agSpace() {
    const xp = E.xp(), lv = D.LEVELS[0], me = E.myPos(), st = AH.S.streak, sv = SH.streakView();
    const levelXp = AH.S.ledger.filter(e => /L01|L1/.test(e.idem + e.ref) && e.source !== 'badge_bonus').reduce((s, e) => s + e.amount, 0);
    const dots = D.LEVELS.map((l, i) => `<i class="${l.idx === 1 ? 'cur' : ''}" style="transform:rotate(${(i / 15) * 360}deg) translateY(-150px)"></i>`).join('');
    return `<div class="ag-space">
      ${C.stars(54, 11)}
      <div class="ag-glow" aria-hidden="true"></div><div class="ag-ring r1" aria-hidden="true"></div><div class="ag-ring r2" aria-hidden="true"></div>
      <div class="ag-orbit" aria-hidden="true">${dots}</div>
      <div class="ag-planet-wrap" aria-hidden="true"><div class="ag-planet"><div><div class="k">${AH.S.progress.levels[1] === 'approved' ? 'COMPLETE' : 'CURRENT'}</div><div class="lv">L01</div><div class="nm">AWAKENING</div><div class="xp">${Math.min(levelXp, lv.xp)} / ${lv.xp} XP</div></div></div></div>
      <div class="ag-card ag-c1"><div class="k">XP balance</div><div class="v">${U.fmt(xp)}<small>XP</small></div>
        <div class="mbar"><i style="width:${Math.max(3, Math.min(100, (levelXp / lv.xp) * 100))}%"></i></div><div class="s">${E.tier().name} tier · ledger verified</div></div>
      <div class="ag-card ag-c2"><div class="k">Streak</div><div class="v"><span class="flame">${ic(sv.icon, 'ic-sm')}</span>${st.current}<small>days</small></div>
        <div class="s">${st.status === 'active' ? `Longest ${st.longest} · ${U.plural(st.freezes, 'freeze')}` : esc(sv.word.replace(' · ', ''))}</div></div>
      <div class="ag-card ag-c3"><div class="k">Cohort standing</div><div class="v">#${me.pos}<small>of ${me.total}</small></div>
        <div class="mbar blue"><i style="width:${Math.max(3, ((me.total - me.pos + 1) / me.total) * 100)}%"></i></div><a href="#/standings">View standings ${ic('arrowRight', 'ic-sm')}</a></div>
      <span class="ag-meta" aria-hidden="true">${esc(D.WORKSPACE.cohort)}</span>
    </div>`;
  }
  function weekStrip() {
    const today = new Date(Date.now() + 5.5 * 3600000); const dow = (today.getUTCDay() + 6) % 7; // Mon=0
    const st = AH.S.streak; const lastDiff = U.dayDiff(st.lastDay, U.istDay());
    return `<div class="week" role="list">${D.WEEK.map((w, i) => {
      const date = new Date(today.getTime() + (i - dow) * U.DAY);
      const back = dow - i; // days ago
      const counted = st.status !== 'recovery' && back >= lastDiff && back < lastDiff + st.current;
      return `<div class="day ${i === dow ? 'today' : ''} ${w.event ? 'event' : ''} ${counted ? 'done-day' : ''}" role="listitem" aria-label="${w.d} ${date.getUTCDate()}: ${esc(w.e)}${counted ? ', streak day' : ''}${i === dow ? ', today' : ''}">
        <span class="dn">${w.d}${i === dow ? ' · today' : ''}</span><span class="dd">${date.getUTCDate()}</span><span class="de">${esc(w.e)}</span></div>`;
    }).join('')}</div>`;
  }
  function journeyRail() {
    const lv = AH.S.progress.levels;
    return `<div class="rail-scroll" tabindex="0" aria-label="15-level journey, scroll sideways"><ol class="jrail" style="list-style:none;margin:0">${D.LEVELS.map(l => {
      const s = lv[l.idx], cls = s === 'approved' ? 'done' : (s === 'in_progress' || s === 'available') ? 'current' : '';
      const inner = s === 'approved' ? ic('check', 'ic-sm') : cls ? String(l.idx).padStart(2, '0') : ic('lock', 'ic-sm');
      return `<li class="jnode ${cls}"><a href="#/journey/${l.idx}" class="jdot" aria-label="Level ${l.idx} ${esc(l.title)}, ${s.replace('_', ' ')}">${inner}</a><span class="jl">${esc(l.short)}</span><span class="jx">${l.xp} XP</span></li>`;
    }).join('')}</ol></div>`;
  }
  R.mission = {
    roles: L, icon: 'rocket', keywords: 'home dashboard',
    render() {
      const nba = P.nextBestAction(), st = AH.S.streak, sv = SH.streakView(), p = AH.S.progress;
      const done = Object.values(p.acts).filter(s => s === 'completed').length;
      const nextBadge = D.BADGES.find(b => !AH.S.badges[b.code]);
      const pulse = AH.S.posts.filter(x => x.status === 'live').slice(0, 2);
      return `
      ${C.header({ title: `${greeting()}, ${esc(E.me().first)}`, desc: `${esc(D.WORKSPACE.cohort)} · ${esc(D.WORKSPACE.tenant)} · Stage 1 of 5: Ignition` })}
      <div class="grid-12">
        <section class="card ag-hero span-12" aria-labelledby="nbaT">
          <div class="ag-left">
            <div class="section-label">Next best action</div>
            <div class="nba"><span class="ic-tile" aria-hidden="true">${ic(nba.icon)}</span><div style="min-width:0"><h2 class="h2" id="nbaT">${esc(nba.title)}</h2><p class="text-2 small" style="margin-top:4px">${esc(nba.body)}</p></div></div>
            <div class="row gap-12 wrap">
              ${nba.action ? `<button class="btn btn-gold" type="button" data-action="${nba.action}">${esc(nba.cta)} ${ic('arrowRight', 'ic-sm')}</button>` : `<a class="btn btn-gold" href="${nba.href}">${esc(nba.cta)} ${ic('arrowRight', 'ic-sm')}</a>`}
              <button class="btn btn-outline" type="button" data-action="openCoach" data-coach="concept-explainer">${ic('lifebuoy', 'ic-sm')}${esc(t('askCoach'))}</button>
            </div>
            <div style="margin-top:auto;padding-top:18px;border-top:1px solid var(--border)">
              ${C.bars([{ label: 'Level 1 activities', value: done, max: 6, text: `${done} of 6` }, { label: 'Journey', value: E.approvedLevels().length, max: 15, text: `${E.approvedLevels().length} of 15 levels approved`, blue: true }])}
            </div>
          </div>
          ${agSpace()}
        </section>

        <section class="card card-pad span-12" aria-labelledby="weekT">
          <div class="row between wrap gap-8" style="margin-bottom:14px"><h2 class="h3" id="weekT">This week</h2><span class="muted small">Mon–Fri prep · Saturday workshop · Sunday 4-hour build sprint</span></div>
          ${weekStrip()}
        </section>

        <section class="card card-pad span-4 stack gap-12 lift" aria-labelledby="stT">
          <h2 class="section-label" id="stT">Streak</h2>
          <div class="row gap-12"><span class="pill pill-streak ${sv.cls}" style="height:40px">${ic(sv.icon, 'ic-sm')}<b>${st.current}</b></span><div><b>${{ active: 'On a roll', frozen: 'Protected by a freeze', grace: 'At risk — 48 h grace', recovery: 'Paused, not lost' }[st.status]}</b><p class="muted small">Longest ${st.longest} · ${U.plural(st.freezes, 'freeze token')}</p></div></div>
          <p class="text-2 small">${{ active: 'A day counts when you finish a real activity. Every 7 days earns a freeze token.', frozen: 'You missed a day, so a freeze token kept your streak safe.', grace: 'Finish any activity by tomorrow midnight (IST) to keep it going.', recovery: `Recover all ${st.prev} days with a 2-minute quick win, any time in the next 7 days.` }[st.status]}</p>
          ${st.status === 'recovery' ? `<button class="btn btn-gold btn-sm" type="button" data-action="quickWin">Start quick win</button>` : ''}
        </section>
        <section class="card card-pad span-4 stack gap-12 lift" aria-labelledby="bdT">
          <h2 class="section-label" id="bdT">Next badge</h2>
          ${nextBadge ? `<div class="row gap-12"><span class="avatar" style="font-size:22px" aria-hidden="true">${nextBadge.icon}</span><div><b>${esc(nextBadge.name)}</b><p class="muted small">${esc(nextBadge.desc)} · +${nextBadge.xp} XP</p></div></div>` : '<p>Every badge earned. Legendary.</p>'}
          <a class="link small" href="#/achievements">All achievements ${ic('arrowRight', 'ic-sm')}</a>
        </section>
        <section class="card card-pad span-4 stack gap-12 lift" aria-labelledby="pT">
          <h2 class="section-label" id="pT">Cohort pulse</h2>
          ${pulse.map(x => `<div class="row gap-12" style="align-items:flex-start"><span class="avatar avatar-xs" aria-hidden="true">${U.initials(E.whoName(x.who))}</span><p class="small"><b>${esc(E.whoName(x.who))}</b> <span class="text-2">${esc(x.text.slice(0, 80))}${x.text.length > 80 ? '…' : ''}</span></p></div>`).join('')}
          <a class="link small" href="#/feed">Open feed ${ic('arrowRight', 'ic-sm')}</a>
        </section>

        <section class="card card-pad span-12" aria-labelledby="jrT">
          <div class="row between wrap gap-8"><h2 class="h3" id="jrT">Your 15-level journey</h2><a class="link small" href="#/journey">Open journey ${ic('arrowRight', 'ic-sm')}</a></div>
          ${journeyRail()}
          <div class="stages">${D.STAGES.map(s => `<span class="badge badge-neutral">${s.name} · ${s.from}–${s.to}</span>`).join('')}</div>
        </section>
      </div>`;
    }
  };
  A.quickWin = () => {
    C.dialog({
      title: 'Quick win: one question',
      body: `<fieldset class="q" style="border:0"><legend>Which line creates an object from the class <code>Cookie</code>?</legend>
        ${['class Cookie:', 'star = Cookie("star")', 'oven_temp = 180'].map((o, i) => `<label class="opt"><input type="radio" name="qw" value="${i}">${esc(o)}</label>`).join('')}</fieldset><p class="field-err" id="qwErr" hidden>Not quite — that line ${'defines'} something. Try again.</p>`,
      confirm: 'Check', onConfirm: dlg => {
        const v = (U.$('input[name="qw"]:checked', dlg) || {}).value;
        if (v !== '1') { U.$('#qwErr', dlg).hidden = false; return false; }
        E.commit(() => E.recoverStreak()); C.chime(); C.toast('Streak recovered. Welcome back!');
      }
    });
  };

  /* ======================= JOURNEY ======================= */
  const levelStatus = idx => AH.S.progress.levels[idx];
  R.journey = {
    roles: L, icon: 'map', keywords: 'levels stages activities',
    crumb: ps => ps[0] ? `Level ${ps[0]}${ps[1] ? ` · ${D.ACTIVITY_TYPES[+ps[1] - 1] ? D.ACTIVITY_TYPES[+ps[1] - 1].name : ''}` : ''}` : t('journey'),
    render(ps) { return ps[0] ? P.levelView(+ps[0], +ps[1] || 0) : journeyOverview(); },
    after(ps) { if (ps[0]) P.levelAfter(+ps[0], +ps[1] || 0); }
  };
  function journeyOverview() {
    const lv = AH.S.progress.levels, cur = D.stageOf(1);
    return `
    ${C.header({ variant: 'cream', eyebrow: 'Your journey', title: 'Five stages. Fifteen levels. One portfolio.', desc: 'Levels unlock on proof, never on time spent. Every level ends with something you built, scored by a human reviewer on a published rubric.' })}
    <section aria-labelledby="stgT" style="margin-bottom:26px">
      <h2 class="h3" id="stgT" style="margin-bottom:12px">Stages and their exit gates</h2>
      <div class="stage-strip">${D.STAGES.map(s => `<div class="stage ${s === cur ? 'current' : ''}"><div class="section-label">Levels ${s.from}–${s.to} · ${esc(s.metaphor)}</div><div class="sname" style="margin-top:4px">${esc(s.name)}</div><p class="gate-t">${ic('target', 'ic-sm')} ${esc(s.gate)}</p></div>`).join('')}</div>

      <div class="lv-grid">${D.LEVELS.map(l => {
        const s = lv[l.idx];
        const st = { approved: `${ic('checkCircle', 'ic-sm')}Approved`, in_progress: `${ic('clock', 'ic-sm')}In progress · ${Object.values(AH.S.progress.acts).filter(x => x === 'completed').length}/6`, available: `${ic('unlock', 'ic-sm')}Unlocked`, locked: `${ic('lock', 'ic-sm')}${l.idx === 1 ? '' : `After Level ${l.idx - 1} is approved`}` }[s];
        const inner = `<span class="code">L${String(l.idx).padStart(2, '0')} · ${l.xp} XP · ${esc(l.effort)}</span><span class="nm">${esc(l.title)}</span><span class="muted xs">${esc(l.sub)}${l.idx === 11 ? ' · choose your track' : ''}</span><span class="st">${st}</span>`;
        return s === 'locked'
          ? `<div class="lv-tile locked" aria-label="Level ${l.idx}, ${esc(l.title)}, locked until Level ${l.idx - 1} is approved">${inner}</div>`
          : `<a class="lv-tile ${s === 'approved' ? '' : 'current'} lift" href="#/journey/${l.idx}" aria-label="Level ${l.idx}, ${esc(l.title)}, ${s.replace('_', ' ')}">${inner}</a>`;
      }).join('')}</div>
    </section>`;
  }

  /* ---------- Level view ---------- */
  P.levelView = (idx, n) => {
    const l = D.LEVELS[idx - 1]; if (!l) return C.empty('map', 'Level not found');

    if (s === 'locked') return C.empty('lock', `Level ${idx} is locked`, `It unlocks when Level ${idx - 1} is approved by a reviewer. Time spent never unlocks a level — proof does.`, `<a class="btn btn-gold btn-sm" style="margin-top:16px" href="#/journey">Back to journey</a>`);
    if (idx !== 1) return C.header({ eyebrow: `Level ${idx} · ${D.stageOf(idx).name}`, title: `${esc(l.title)}: ${esc(l.sub)}`, desc: esc(l.capability) }) +

    return `
    <section class="card card-pad" aria-labelledby="pageTitle">
      <div class="lv-head">
        <div class="ring" style="--p:${Math.round((done / 6) * 100)}" role="img" aria-label="${done} of 6 activities complete"><span>${done}/6<small>DONE</small></span></div>

        <div class="row gap-8 wrap lv-head-meta"><span class="badge badge-gold">${lvlXp} / ${l.xp} XP</span><span class="badge badge-neutral">${esc(l.effort)}</span><button class="btn btn-outline btn-sm" type="button" data-action="showRubric">${ic('target', 'ic-sm')}Rubric</button></div>
      </div>
      <ol class="stepper" aria-label="Level 1 activities">${D.ACTIVITY_TYPES.map(at => {
        const st = acts[at.n];
        return `<li class="step ${st}" ${at.n === cur ? 'aria-current="step"' : ''}><button type="button" data-action="gotoStep" data-n="${at.n}" ${st === 'locked' ? 'disabled' : ''} aria-label="Activity ${at.n}: ${at.name}, ${label[st]}">
          <span class="sn"><i>${st === 'completed' ? '✓' : at.n}</i>${label[st]}</span><span class="st">${at.name}</span></button></li>`;
      }).join('')}</ol>
      <div class="panel-grid">
        <div id="actPanel">${P.actPanel(cur)}</div>
        <aside class="card aside-card" aria-label="Level facts">
          <h2 class="section-label" style="margin-bottom:6px">Level facts</h2>
          <div class="kv"><span>XP in this level</span><span>${lvlXp} of ${l.xp}</span></div>
          <div class="kv"><span>Proof attempts</span><span>${AH.S.submissions.length}</span></div>
          <div class="kv"><span>Boss attempts</span><span>${p.boss.attempts} of ${D.L1.acts[6].attempts}</span></div>
          <div class="kv"><span>Pass rule</span><span>Avg ≥ 3.0 and Boss ≥ 2</span></div>
          <div class="kv"><span>Review target</span><span>&lt; ${D.WORKSPACE.reviewSlaHours} h</span></div>
          <button class="btn btn-soft btn-sm btn-block" style="margin-top:14px" type="button" data-action="openCoach" data-coach="${cur >= 4 ? 'code-mentor' : 'concept-explainer'}" data-ctx="Level 1 · ${esc(D.ACTIVITY_TYPES[cur - 1].name)}">${ic('lifebuoy', 'ic-sm')}Ask about this step</button>
        </aside>
      </div>
    </section>`;
  };
  A.gotoStep = el => SH.go(`#/journey/1/${el.dataset.n}`);
  A.showRubric = () => C.dialog({
    title: 'How Level 1 is scored', wide: true, cancel: 'Close',
    body: `<p class="small">Rubric ${D.RUBRIC.code}. A human reviewer scores 1–5 per area. You pass with a weighted average of <b>3.0</b> or more <b>and</b> at least <b>2</b> on the Boss challenge.</p>
      <div class="table-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Area</th><th>Weight</th><th>3 — Meets</th><th>5 — Exceeds</th></tr></thead><tbody>
      ${D.RUBRIC.dims.map(d => `<tr><td class="bold">${esc(d.name)}</td><td class="num">${Math.round(d.weight * 100)}%</td><td class="small">${esc(d.l3)}</td><td class="small">${esc(d.l5)}</td></tr>`).join('')}</tbody></table></div>`
  });

  /* ---------- Activity panels ---------- */
  const actHead = (n, extra = '') => { const at = D.ACTIVITY_TYPES[n - 1], a = D.L1.acts[n]; return `<div class="row between wrap gap-8" style="margin-bottom:14px"><div><div class="section-label">Activity ${n} · ${esc(at.verb)}</div><h2 class="h2">${esc(at.name)}: ${esc(a.title)}</h2></div><div class="row gap-8">${extra}<span class="badge badge-gold">+${a.xp} XP</span></div></div>`; };
  const doneNote = (n, text) => AH.S.progress.acts[n] === 'completed' ? `<div class="callout ok" style="margin-top:16px">${ic('checkCircle')}<div><b>Completed</b>${text}</div></div>` : '';
  P.actPanel = n => {
    const st = AH.S.progress.acts[n];
    if (st === 'locked') return C.empty('lock', 'Finish the previous activity first', 'Forward progress is gated. You can always revisit earlier activities.');

  };
  function a1() {
    const a = D.L1.acts[1], sel = P.draft.a1 != null ? P.draft.a1 : (AH.S.progress.acts[1] === 'completed' ? AH.S.progress.a1 : null);
    return `${actHead(1)}
      <p style="font-size:16px">${esc(a.story)}</p>
      <h3 class="h3" style="margin:18px 0 8px">You'll succeed when you can…</h3>
      <ul class="checklist">${a.criteria.map(c => `<li>${ic('target', 'ic-sm')}<span>${esc(c)}</span></li>`).join('')}</ul>
      <div class="q" style="margin-top:18px"><fieldset><legend>${esc(a.check.q)}</legend>
        ${a.check.options.map((o, i) => `<label class="opt ${sel != null && i === sel ? (i === a.check.answer ? 'correct' : 'wrong') : ''}"><input type="radio" name="a1" value="${i}" ${sel === i ? 'checked' : ''} data-change="a1Pick">${esc(o)}</label>`).join('')}
      </fieldset>${sel != null ? `<p class="q-feedback ${sel === a.check.answer ? 'ok' : 'no'}">${sel === a.check.answer ? 'Exactly. ' : 'Close — here\'s the idea: '}${esc(a.check.why)}</p>` : ''}</div>
      <div class="row gap-12 wrap" style="margin-top:16px">${AH.S.progress.acts[1] === 'completed' ? `<a class="btn btn-gold" href="#/journey/1/2">Next: Learn ${ic('arrowRight', 'ic-sm')}</a>` : `<button class="btn btn-gold" type="button" data-action="a1Done" ${sel == null ? 'disabled' : ''}>Mark briefing complete</button>`}</div>
      ${doneNote(1, 'You know the mission. The mould awaits.')}`;
  }
  A.a1Pick = el => { P.draft.a1 = +el.value; SH.render(); const r = $('input[name="a1"]:checked'); if (r) r.focus(); };
  A.a1Done = () => { E.commit(s => { s.progress.a1 = P.draft.a1; const r = E.completeActivity(1); if (r.entry) C.toast(`+${r.entry.amount} XP — Mission Briefing complete`); }); SH.go('#/journey/1/2'); };

  function a2() {

  function editor(id, code, label) {

  }
  function a4() {
    const a = D.L1.acts[4], p = AH.S.progress, done = p.acts[4] === 'completed';

      <div class="card card-pad" style="margin-top:16px;${allPass ? '' : 'opacity:.6'}" aria-disabled="${!allPass}">

          <label class="sr-only" for="repoIn">Repository URL</label>
          <input class="input" id="repoIn" style="flex:1;min-width:220px" type="url" placeholder="https://github.com/your-name/cookie-factory" value="${esc(p.repo)}" ${allPass && !done ? '' : 'disabled'}>

        </form>
        ${p.commit ? `<p class="callout ok small" style="margin-top:12px">${ic('github', 'ic-sm')}<span>Commit <b class="mono">${esc(p.commit.sha)}</b> detected on ${esc(p.commit.repo)} · tests 4/4</span></p>` : ''}
      </div>
      ${done ? `<div class="row" style="margin-top:16px"><a class="btn btn-gold" href="#/journey/1/5">Next: Submit proof ${ic('arrowRight', 'ic-sm')}</a></div>` : ''}`;

  A.runBuild = () => {
    const code = $('#buildEd').value;
    E.commit(s => { s.progress.code = code; s.progress.tests = E.runTests(code, E.BUILD_TESTS); });

  };
  A.resetBuild = () => C.dialog({ title: 'Reset to the starter file?', body: 'Your current code in this editor will be replaced.', confirm: 'Reset', danger: true, onConfirm: () => E.commit(s => { s.progress.code = E.STARTER; s.progress.tests = null; }) });

  function a5() {
    const a = D.L1.acts[5], p = AH.S.progress, last = AH.S.submissions[0];

    const fb = last && last.state === 'needs_changes' ? `<div class="callout warn" style="margin-bottom:16px">${ic('refresh')}<div><b>Changes requested by ${esc(last.review.by)} · ${last.review.avg.toFixed(2)} / 5</b><span>“${esc(last.review.feedback)}”</span></div></div>` : '';
    const inReview = p.acts[6] === 'in_review' || p.acts[6] === 'completed';
    if (inReview && last) return `${actHead(5)}<div class="callout ok">${ic('checkCircle')}<div><b>Proof submitted ${U.timeTag(last.at)} · attempt ${last.attempt}</b><span>${esc(last.repo)}</span></div></div><div class="row" style="margin-top:16px"><a class="btn btn-gold" href="#/journey/1/6">See review status ${ic('arrowRight', 'ic-sm')}</a></div>`;
    return `${actHead(5)}${fb}
      <form class="stack gap-16" data-form="proof" novalidate>
        <div><label class="field-label" for="pfRepo">Repository link <span class="muted">(required)</span></label><input class="input" id="pfRepo" data-proof="repo" type="url" value="${esc(d.repo)}" placeholder="https://github.com/your-name/cookie-factory" aria-describedby="pfRepoH"><div class="field-hint" id="pfRepoH">Public repo with your cookie.py and a README.</div></div>
        <div><label class="field-label" for="pfDeploy">Demo link <span class="muted">(optional)</span></label><input class="input" id="pfDeploy" data-proof="deploy" type="url" value="${esc(d.deploy)}" placeholder="Loom video, Replit, or deployed URL"></div>
        <div><label class="field-label" for="pfRefl">Reflection <span class="muted">(at least ${a.minWords} words)</span></label><textarea class="textarea" id="pfRefl" data-proof="reflection" rows="6" aria-describedby="pfReflH" placeholder="What confused you about classes vs objects, and how did you fix it? How does this connect to building agents?">${esc(d.reflection)}</textarea>
          <div class="field-hint" id="pfReflH"><span class="wc ${wc >= a.minWords ? 'ok' : ''}" data-wc>${wc} / ${a.minWords} words</span> · Reviewers reward one honest struggle and its fix.</div></div>
        <fieldset style="border:0;padding:0;margin:0"><legend class="field-label">Before you submit</legend><ul class="checklist">${a.checklist.map((c, i) => `<li><label><input type="checkbox" data-proofcheck="${i}" ${d.checks[i] ? 'checked' : ''}><span>${esc(c)}</span></label></li>`).join('')}</ul></fieldset>
        <div class="row gap-12 wrap"><button class="btn btn-gold" type="submit">${ic('upload', 'ic-sm')}Submit for review</button><span class="muted small">+${a.xp} XP on submit · a human reviewer decides</span></div>

  function a6() {
    const p = AH.S.progress, sub = AH.S.submissions[0], a = D.L1.acts[6], b = p.boss;

        <div class="table-wrap"><table class="tbl"><thead><tr><th>Area</th><th>Weight</th><th style="text-align:right">Score</th></tr></thead><tbody>${D.RUBRIC.dims.map(d => `<tr><td>${esc(d.name)}</td><td class="num">${Math.round(d.weight * 100)}%</td><td class="num bold" style="text-align:right">${sub.review.scores[d.key]}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <div class="grid2" style="gap:18px;margin-top:${approved ? 18 : 0}px">
        <section class="card card-pad" aria-labelledby="revT"><h3 class="h3" id="revT" style="margin-bottom:10px">Review status</h3>
          <ol class="vtl">${steps.map(s => `<li class="${s.k}"><span class="dot">${s.k === 'done' ? ic('check', 'ic-sm') : s.k === 'now' ? ic('clock', 'ic-sm') : s.k === 'warn' ? ic('refresh', 'ic-sm') : ''}</span><div><b>${s.t}</b><p class="muted small">${s.d}</p></div></li>`).join('')}</ol>
          ${sub && sub.state === 'needs_changes' ? `<a class="btn btn-gold btn-sm" style="margin-top:10px" href="#/journey/1/5">Improve and resubmit</a>` : ''}
          ${!sub ? '<p class="muted small">Submit your proof in activity 5 first.</p>' : ''}
        </section>
        <section class="card card-pad" aria-labelledby="bossT"><h3 class="h3" id="bossT">Boss: ${esc(a.title)}</h3>
          <p class="text-2 small" style="margin-top:4px">${esc(a.boss)}</p>
          <div class="row gap-8 wrap" style="margin-top:10px"><span class="badge badge-neutral">${b.attempts} of ${a.attempts} attempts</span><span class="badge ${b.best === 3 ? 'badge-success' : 'badge-neutral'}">Best ${b.best}/3</span><span class="badge badge-gold">+${a.bossXp} XP bonus</span></div>
        </section>
      </div>
      ${sub && !approved ? `<div style="margin-top:18px">${editor('bossEd', b.code || p.code || E.STARTER, 'cookie.py — Boss edition')}</div>
        <div class="row gap-12 wrap" style="margin:12px 0"><button class="btn btn-ink" type="button" data-action="runBoss" ${b.attempts >= a.attempts ? 'disabled' : ''}>${ic('play', 'ic-sm')}Run the Mould Trial</button><span class="muted xs">${b.attempts >= a.attempts ? 'No attempts left — your best result goes to the reviewer.' : `${a.attempts - b.attempts} attempts left. Your best result is shared with your reviewer.`}</span></div>
        ${termOut(bossRes ? E.runTests(b.code, E.BOSS_TESTS) : null, 'pytest tests/test_boss.py')}` : ''}`;
  }
  A.runBoss = () => {
    const code = $('#bossEd').value; let r;
    E.commit(s => { r = E.runBoss(code); const sub = s.submissions[0]; if (sub && sub.state === 'pending') { sub.boss = { passed: s.progress.boss.best, total: 3 }; sub.ai = E.aiPreReview(sub); } });

  };

  P.levelAfter = () => {

        if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const s = ed.selectionStart; ed.value = ed.value.slice(0, s) + '    ' + ed.value.slice(ed.selectionEnd); ed.selectionStart = ed.selectionEnd = s + 4; }
        if (e.key === 'Escape') ed.blur(); // keyboard users can always leave the editor
      });
      const save = U.debounce(() => E.commit(s => { if (ed.id === 'bossEd') s.progress.boss.code = ed.value; else s.progress.code = ed.value; }, { silent: true }), 400);
      ed.addEventListener('input', save);
    }
    U.$$('[data-proof]').forEach(inp => inp.addEventListener('input', () => {

    }));

  };

  /* Form submissions inside the level view */
  P.forms = {

      P.draft.graded = true;
      if (score >= D.L1.acts[2].passPct) {
        E.commit(s => { s.progress.quiz = { ...P.draft.quiz }; s.progress.quizScore = score; const r = E.completeActivity(2, `L1·A2 Learn (quiz ${score}%)`); if (r.entry) C.toast(`+${r.entry.amount} XP — quiz passed with ${score}%`); else C.toast(`Retake score: ${score}%. XP was already awarded.`); });
        P.draft.result = `${score}% — passed.`; P.draft.graded = false; P.draft.quiz = {}; P.draft.retake = false; SH.render();
      } else { P.draft.result = `${score}% — you need ${D.L1.acts[2].passPct}%. Review the highlighted answers and try again.`; SH.render(); }

    a3() {

      else { P.draft.a3msg = 'Not yet — check the highlighted lines in the code.'; SH.render(); }

            <button class="btn btn-sm ${on ? 'btn-gold' : 'btn-outline'}" type="button" aria-pressed="${on}" data-action="shortlist" data-code="${tk.code}">${on ? ic('check', 'ic-sm') + 'Shortlisted' : 'Shortlist'}</button></div>

  A.shortlist = el => E.commit(s => { const c = el.dataset.code, i = s.shortlist.indexOf(c); if (i >= 0) s.shortlist.splice(i, 1); else s.shortlist.push(c); E.track('track.shortlist', { code: c }); });

  /* ======================= ACHIEVEMENTS ======================= */

    roles: L, icon: 'award', keywords: 'badges xp ledger history',
    render() {
      const xp = E.xp(), tier = E.tier(), next = E.nextTier(), chain = E.verifyChain();

      <div class="kpis" style="margin-bottom:22px">
        <div class="card kpi"><div class="k">Total XP</div><div class="v">${U.fmt(xp)}</div><div class="d">${tier.name} tier${next ? ` · ${U.fmt(next.min - xp)} to ${next.name}` : ''}</div></div>

        <div class="card kpi"><div class="k">Longest streak</div><div class="v">${AH.S.streak.longest}</div><div class="d">${U.plural(AH.S.streak.freezes, 'freeze token')} saved</div></div>
        <div class="card kpi"><div class="k">Ledger</div><div class="v" style="font-size:22px">${chain.ok ? `${ic('shield')} Verified` : 'Check failed'}</div><div class="d">${U.plural(chain.total, 'entry', 'entries')}, hash-chained</div></div>
      </div>
      <section aria-labelledby="bgT"><h2 class="h3" id="bgT" style="margin-bottom:12px">Badges</h2>
        <div class="badge-grid">${D.BADGES.map(b => { const at = AH.S.badges[b.code]; return `<div class="bdg ${b.tier} ${at ? 'earned' : 'locked'}" aria-label="${esc(b.name)}, ${b.tier}, ${at ? 'earned' : 'locked'}">
          <span class="medal" aria-hidden="true">${b.icon}${at ? '' : `<span class="lk">${ic('lock', 'ic-sm')}</span>`}</span><span class="tier">${b.tier}</span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small><small class="bold">${at ? `Earned ${U.ago(at)}` : `+${b.xp} XP`}</small></div>`; }).join('')}</div>
      </section>
      <section class="card" style="margin-top:24px" aria-labelledby="lgT">
        <div class="row between wrap gap-8" style="padding:18px 20px 0"><h2 class="h3" id="lgT">XP history</h2><button class="btn btn-outline btn-sm" type="button" data-action="ledgerCsv">${ic('download', 'ic-sm')}Download CSV</button></div>
        <div class="table-wrap" style="margin-top:12px"><table class="tbl"><caption class="sr-only">XP ledger, newest first</caption>
          <thead><tr><th>When</th><th>What</th><th>Source</th><th style="text-align:right">XP</th></tr></thead>
          <tbody>${AH.S.ledger.slice().reverse().map(e => `<tr><td class="muted-cell small">${U.timeTag(e.at)}</td><td>${esc(e.ref)}</td><td><span class="badge badge-neutral">${esc(e.source.replace(/_/g, ' '))}</span></td><td class="num bold" style="text-align:right">+${e.amount}</td></tr>`).join('')}</tbody></table></div>
      </section>`;
    }
  };
  A.ledgerCsv = () => {
    const rows = [['id', 'timestamp', 'source', 'reference', 'xp', 'idempotency_key', 'prev_hash', 'hash'], ...AH.S.ledger.map(e => [e.id, new Date(e.at).toISOString(), e.source, e.ref, e.amount, e.idem, e.prev, e.hash])];
    U.download('xp-ledger.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
    E.track('ledger.exported');
  };

  /* ======================= STANDINGS ======================= */
  P.standTab = P.standTab || 'cohort';
  R.standings = {
    roles: ['learner', 'pm'], icon: 'ranks', keywords: 'leaderboard rank',
    render() {
      const rows = E.standings(), me = E.myPos(), priv = AH.S.prefs.lbVisibility === 'private', tab = P.standTab;
      const approved = AH.S.submissions.filter(s => s.state === 'approved').length;
      const globalBody = !AH.S.prefs.globalOptIn
        ? C.empty('globe', 'Global standings are opt-in', 'Your data stays inside your cohort unless you choose otherwise. Opting in shows your name and XP to learners in other institutions.', `<button class="btn btn-gold btn-sm" style="margin-top:16px" type="button" data-action="globalOptIn">Opt in to global standings</button>`)
        : approved < 3 ? C.empty('shield', 'Almost there', `Global standings need 3 approved submissions to keep them fair (you have ${approved}). It stops XP-farming accounts from topping the board.`) : '';
      return `${C.header({ title: AH.t('standings'), desc: AH.S.role === 'learner' ? `You're #${me.pos} of ${me.total} in ${esc(D.WORKSPACE.cohort)}.` : `${esc(D.WORKSPACE.cohort)} by XP.` })}
      <div class="tabs-line" role="tablist" aria-label="Standings scope">${[['cohort', 'My cohort'], ['global', 'Global']].map(([k, l]) => `<button role="tab" type="button" aria-selected="${tab === k}" data-action="standTab" data-tab="${k}">${l}</button>`).join('')}</div>
      ${tab === 'global' ? globalBody : `
      ${AH.S.role === 'learner' ? `<div class="callout info" style="margin-bottom:14px">${ic(priv ? 'eyeOff' : 'eye')}<div><b>${priv ? 'You appear as "Anonymous learner" to others' : 'Your name is visible to your cohort'}</b><button class="btn btn-text btn-sm" type="button" data-action="toggleVisibility" style="padding-left:0">${priv ? 'Show my name' : 'Hide my name'}</button></div></div>` : ''}
      <div class="card table-wrap"><table class="tbl"><caption class="sr-only">Cohort standings by XP</caption>
        <thead><tr><th>#</th><th>Learner</th><th>City</th><th>Rank</th><th>Streak</th><th style="text-align:right">XP</th></tr></thead>
        <tbody>${rows.map((r, i) => { const name = r.me ? (AH.S.role === 'learner' ? `${E.me().name}` : (priv ? 'Anonymous learner' : E.me().name)) : r.name; const st = r.me ? AH.S.streak : { current: r.streak, status: r.status };
          return `<tr class="${r.me && AH.S.role === 'learner' ? 'me' : ''}"><td class="num bold">${i + 1}</td><td><div class="row gap-12"><span class="avatar avatar-sm ${r.me ? 'me' : ''}" aria-hidden="true">${U.initials(name)}</span><span class="${r.me ? 'bold' : ''}">${esc(name)}${r.me && AH.S.role === 'learner' ? ` <span class="badge badge-gold" style="margin-left:6px">You${priv ? ' · hidden' : ''}</span>` : ''}</span></div></td>
          <td class="text-2">${esc(r.city)}</td><td><span class="badge badge-neutral">${D.pick(D.RANKS, r.xp).name}</span></td><td class="num">${st.status === 'recovery' ? '⏸' : st.status === 'frozen' ? '🧊' : '🔥'} ${st.current}</td><td class="num bold" style="text-align:right">${U.fmt(r.xp)}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="muted small" style="margin-top:10px">XP is written by the server only. Duplicate awards are blocked by idempotency keys.</p>`}`;
    }
  };
  A.standTab = el => { P.standTab = el.dataset.tab; SH.render(); };
  A.toggleVisibility = () => E.commit(s => { s.prefs.lbVisibility = s.prefs.lbVisibility === 'private' ? 'cohort' : 'private'; E.audit('privacy.leaderboard_visibility', s.prefs.lbVisibility); });
  A.globalOptIn = () => C.dialog({ title: 'Share your progress globally?', body: 'Learners in other institutions will see your name, city and XP. You can withdraw consent any time in Settings.', confirm: 'I consent', onConfirm: () => E.commit(s => { s.prefs.globalOptIn = true; E.audit('consent.global_leaderboard', 'granted'); }) });
})(window.AH = window.AH || {});
</script>
<script>/* js/pages/community.js */
/* AI Accelerator Hub v3 — community & support: feed, library, launch wall, AI coaches */
(function (AH) {
  'use strict';
  const { U, D, E, C, SH, t } = AH; const { esc, ic, $, $$ } = U;
  const P = (AH.P = AH.P || {}); const R = AH.ROUTES, A = AH.A;
  const ALL = ['learner', 'reviewer', 'pm'];
  const name = who => who === 'u-me' ? (AH.S.role === 'learner' ? 'You' : E.me().name) : E.whoName(who);
  const metaOf = who => { if (who === 'u-me') return `${E.me().city} · ${E.rank().name}`; const p = D.PEERS.find(x => x.id === who); return p ? `${p.city} · ${D.pick(D.RANKS, p.xp).name}` : ''; };

  /* ======================= COHORT FEED ======================= */
  const F = (P.feed = P.feed || { tab: 'posts', filter: 'all', tag: 0, limit: 6, draft: '', openReply: null });
  const tagLabel = tg => tg === 0 ? 'General' : `Level ${tg}`;
  R.feed = {
    roles: ALL, icon: 'feed', keywords: 'community posts questions',
    render() {
      const canPost = AH.S.role === 'learner';
      return `${C.header({ variant: 'cream', eyebrow: esc(D.WORKSPACE.cohort), title: 'Ask, share, unblock each other', desc: 'Questions, tips and small wins from your cohort. Only members of your institution can see this feed.' })}
      ${canPost ? `<section class="card composer" aria-labelledby="compT" style="margin-bottom:20px"><div class="composer-inner">
        <h2 class="h3" id="compT">Post to your cohort</h2>
        <div class="row gap-16" style="align-items:flex-start;margin-top:14px">
          <span class="avatar me" aria-hidden="true">${U.initials(E.me().name)}</span>
          <div style="flex:1;min-width:0"><label class="sr-only" for="postText">Your post</label>
            <textarea class="textarea" id="postText" maxlength="2000" placeholder="Stuck on something, or figured something out, ${esc(E.me().first)}?" aria-describedby="postCount">${esc(F.draft)}</textarea>
            <div class="row between xs muted" style="margin-top:6px"><span>Links are allowed. Never post passwords or API keys.</span><span id="postCount">${F.draft.length}/2000</span></div></div>
        </div>
        <div class="row gap-12" style="margin-top:12px"><span class="bold small" id="tagLbl" style="flex-shrink:0">Tag</span>
          <div class="chips" role="radiogroup" aria-labelledby="tagLbl" style="flex:1;min-width:0">${[0, ...D.LEVELS.map(l => l.idx)].map(tg => `<button class="chip ${F.tag === tg ? '' : 'chip-soft'}" type="button" role="radio" aria-checked="${F.tag === tg}" data-action="feedTag" data-t="${tg}">${tagLabel(tg)}</button>`).join('')}</div></div>
        <div class="row gap-12 wrap" style="justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
          <span class="muted xs" style="margin-right:auto">Posts that look like selling, crypto or spam are held for a moderator.</span>
          <button class="btn btn-gold" id="postBtn" type="button" data-action="feedPost" ${F.draft.trim() ? '' : 'disabled'}>${ic('send', 'ic-sm')}Post</button>
        </div></div></section>` : `<div class="callout info" style="margin-bottom:16px">${ic('eye')}<div><b>Viewing as ${esc(E.persona().title)}</b>Staff can read, reply to and moderate the cohort feed.</div></div>`}
      <div class="row gap-12" style="margin-bottom:14px"><span class="section-label" id="showLbl" style="flex-shrink:0">Show</span>
        <div class="chips" role="radiogroup" aria-labelledby="showLbl" style="flex:1;min-width:0">${[['all', 'Everything'], ['0', 'General'], ...D.LEVELS.map(l => [String(l.idx), `Level ${l.idx}`])].map(([v, l]) => `<button class="chip" type="button" role="radio" aria-checked="${F.filter === v}" data-action="feedFilter" data-f="${v}">${l}</button>`).join('')}</div></div>
      <div id="feedList" class="stack gap-16">${feedList()}</div>`;
    },
    after() {
      const ta = $('#postText'); if (!ta) return;
      ta.addEventListener('input', () => { F.draft = ta.value; $('#postBtn').disabled = !ta.value.trim(); $('#postCount').textContent = `${ta.value.length}/2000`; });
    }
  };
  const visible = () => AH.S.posts.filter(p => (p.status === 'live' || p.who === 'u-me' || AH.S.role !== 'learner') && (F.filter === 'all' || String(p.tag) === F.filter));
  function feedList() {
    const all = visible();
    if (!all.length) return C.empty('feed', F.filter === 'all' ? 'No posts yet' : `Nothing tagged ${tagLabel(+F.filter)} yet`, 'Be the first — questions are welcome.');
    return all.slice(0, F.limit).map(postCard).join('') + (all.length > F.limit ? `<div style="text-align:center"><button class="btn btn-cream" type="button" data-action="feedMore">Load more posts</button></div>` : `<p class="muted small" style="text-align:center">You're all caught up.</p>`);
  }
  const likeBtn = (it, kind) => `<button class="act-btn" type="button" data-action="like" data-kind="${kind}" data-id="${it.id}" aria-pressed="${it.liked}" aria-label="Like, ${U.plural(it.likes, 'like')}">${ic('heart', 'ic-sm')}<span aria-hidden="true">${it.likes || 'Like'}</span></button>`;
  function postCard(p) {
    const mine = p.who === 'u-me' && AH.S.role === 'learner', staff = AH.S.role !== 'learner', open = F.openReply === p.id;
    return `<article class="card post" aria-labelledby="pn-${p.id}">
      <div class="post-head"><span class="avatar ${p.who === 'u-me' ? 'me' : ''}" aria-hidden="true">${U.initials(p.who === 'u-me' ? E.me().name : E.whoName(p.who))}</span>
        <div style="flex:1;min-width:0"><div class="post-name" id="pn-${p.id}">${esc(name(p.who))}</div><div class="post-meta">${esc(metaOf(p.who))} · ${U.timeTag(p.at)}</div></div>
        <div class="row gap-8">${p.status === 'held' ? '<span class="badge badge-warn">Held for review</span>' : ''}<span class="badge ${p.tag === 0 ? 'badge-neutral' : 'badge-gold'}">${tagLabel(p.tag)}</span></div></div>
      <div class="post-body">${U.linkify(p.text)}</div>
      <div class="post-actions">${likeBtn(p, 'post')}
        <button class="act-btn" type="button" data-action="replyToggle" data-id="${p.id}" aria-expanded="${open}">${ic('reply', 'ic-sm')}Reply${p.replies.length ? ` (${p.replies.length})` : ''}</button>
        <span class="act-right">${mine ? `<button class="btn btn-text" type="button" data-action="deletePost" data-id="${p.id}">${ic('trash', 'ic-sm')}Delete</button>`
          : staff ? (p.status === 'held' ? `<button class="btn btn-text" type="button" data-action="moderate" data-id="${p.id}" data-v="live">${ic('check', 'ic-sm')}Approve</button>` : `<button class="btn btn-text" type="button" data-action="moderate" data-id="${p.id}" data-v="held">${ic('eyeOff', 'ic-sm')}Hide</button>`)
          : p.reported ? '<span class="muted small">Reported</span>' : `<button class="btn btn-text" type="button" data-action="report" data-id="${p.id}">${ic('flag', 'ic-sm')}Report</button>`}</span></div>
      ${p.replies.length ? `<div class="thread">${p.replies.map(r => `<div><div class="row gap-12" style="align-items:flex-start"><span class="avatar avatar-xs ${r.who === 'u-me' ? 'me' : ''}" aria-hidden="true">${U.initials(r.who === 'u-me' ? E.me().name : r.who.startsWith('staff:') ? r.who.slice(6) : E.whoName(r.who))}</span><div><div class="bold small">${esc(r.who.startsWith('staff:') ? r.who.slice(6) + ' · staff' : name(r.who))}</div><div class="post-meta xs">${U.timeTag(r.at)}</div></div></div><div class="reply-body">${U.linkify(r.text)}</div><div class="reply-actions">${likeBtn(r, 'reply')}</div></div>`).join('')}</div>` : ''}
      ${open ? `<form class="reply-box" data-form="reply" data-id="${p.id}"><label class="sr-only" for="rb-${p.id}">Reply</label><textarea class="textarea" id="rb-${p.id}" rows="2" maxlength="1000" placeholder="Write a reply…" style="min-height:70px"></textarea><div class="row gap-8" style="justify-content:flex-end"><button class="btn btn-text" type="button" data-action="replyToggle" data-id="${p.id}">Cancel</button><button class="btn btn-ink btn-sm" type="submit">Reply</button></div></form>` : ''}
    </article>`;
  }
  const refreshFeed = focus => { const el = $('#feedList'); if (el) el.innerHTML = feedList(); if (focus) { const f = $(focus); if (f) f.focus(); } };
  const findPost = id => AH.S.posts.find(p => p.id === id);
  const findItem = (kind, id) => kind === 'post' ? findPost(id) : AH.S.posts.flatMap(p => p.replies).find(r => r.id === id);
  A.feedTag = el => { F.tag = +el.dataset.t; $$('[data-action="feedTag"]').forEach(b => { const on = +b.dataset.t === F.tag; b.setAttribute('aria-checked', on); b.classList.toggle('chip-soft', !on); }); };
  A.feedFilter = el => { F.filter = el.dataset.f; F.limit = 6; $$('[data-action="feedFilter"]').forEach(b => b.setAttribute('aria-checked', b.dataset.f === F.filter)); refreshFeed(); };
  A.feedMore = () => { F.limit += 6; refreshFeed(); };
  A.feedPost = () => {
    const text = F.draft.trim(); if (!text) return;
    if (/sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}/.test(text)) return C.toast('That looks like an API key or token. Remove it before posting.', { tone: 'error' });
    const held = /crypto|bitcoin|forex|buy now|discount code|earn ₹?\d+|dm (me )?for price/i.test(text);
    E.commit(s => { s.posts.unshift({ id: U.uid('post'), who: 'u-me', tag: F.tag, text, at: Date.now(), likes: 0, liked: false, reported: false, status: held ? 'held' : 'live', replies: [] }); E.track('feed.posted', { held }); if (held) E.audit('moderation.auto_held', 'Post by ' + E.me().name); });
    F.draft = ''; F.filter = 'all'; SH.render(); C.blip(780);
    C.toast(held ? 'Posted. A moderator will check it before others see it.' : 'Posted to your cohort.');
  };
  A.like = el => {
    const it = findItem(el.dataset.kind, el.dataset.id); if (!it) return;
    E.commit(() => { it.liked = !it.liked; it.likes += it.liked ? 1 : -1; }, { silent: true });
    el.outerHTML = likeBtn(it, el.dataset.kind); const nb = $(`[data-action="like"][data-id="${it.id}"]`); if (nb) nb.focus(); if (it.liked) C.blip(880);
  };
  A.replyToggle = el => { F.openReply = F.openReply === el.dataset.id ? null : el.dataset.id; refreshFeed(F.openReply ? `#rb-${F.openReply}` : `[data-action="replyToggle"][data-id="${el.dataset.id}"]`); };
  A.report = el => C.dialog({ title: 'Report this post', body: `<label class="field-label" for="repR">Reason</label><select class="select" id="repR"><option>Spam or selling</option><option>Harassment or hate</option><option>Unsafe for minors</option><option>Off-topic</option><option>Something else</option></select><p class="muted xs" style="margin-top:8px">A moderator reviews every report. The author isn't told who reported it.</p>`, confirm: 'Send report',
    onConfirm: d => { const reason = U.$('#repR', d).value; E.commit(s => { findPost(el.dataset.id).reported = true; E.audit('moderation.reported', `${el.dataset.id} · ${reason}`); }, { silent: true }); refreshFeed(); C.toast('Thanks. A moderator will check it.'); } });
  A.deletePost = el => C.dialog({ title: 'Delete your post?', body: 'This removes it and its replies for everyone.', confirm: 'Delete', danger: true, onConfirm: () => { E.commit(s => { s.posts = s.posts.filter(p => p.id !== el.dataset.id); }, { silent: true }); refreshFeed(); C.toast('Post deleted.'); } });
  A.moderate = el => { E.commit(s => { findPost(el.dataset.id).status = el.dataset.v; E.audit(el.dataset.v === 'live' ? 'moderation.approved' : 'moderation.hidden', el.dataset.id); }, { silent: true }); refreshFeed(); C.toast(el.dataset.v === 'live' ? 'Post approved.' : 'Post hidden from learners.'); };
  P.forms = P.forms || {};
  P.forms.reply = f => {
    const ta = $('textarea', f), text = ta.value.trim(); if (!text) return ta.focus();
    const who = AH.S.role === 'learner' ? 'u-me' : 'staff:' + E.persona().name;
    E.commit(s => { findPost(f.dataset.id).replies.push({ id: U.uid('r'), who, text, at: Date.now(), likes: 0, liked: false }); }, { silent: true });
    F.openReply = null; refreshFeed(`[data-action="replyToggle"][data-id="${f.dataset.id}"]`);
  };

  /* ======================= LIBRARY (grows with progress) ======================= */
  P.libraryGroups = () => {
    const p = AH.S.progress, a = p.acts, g = [];
    g.push({ id: 'l1-sessions', title: 'Level 1 · Sessions', level: null, items: [
      { type: 'video', title: 'Kick-off: how the 15 levels work', meta: 'Recording · 42 min' },
      { type: 'video', title: 'Saturday workshop: classes in the wild', meta: 'Recording · 1 h 10 min · captions' },
      { type: 'page', title: 'Workshop slides: The Mould & the Cookie', meta: 'Slides · 24 pages' }] });
    if (a[1] === 'completed') g.push({ id: 'l1-a1', title: 'Mission Briefing — The Cookie Factory', level: 1, items: [{ type: 'page', title: 'Mission brief and success criteria', meta: 'Page' }] });
    if (a[2] === 'completed') g.push({ id: 'l1-a2', title: 'Learn — Classes, Objects, Attributes', level: 1, items: [
      ...D.L1.acts[2].lessons.map(l => ({ type: l.kind === 'video' ? 'video' : 'page', title: l.title, meta: l.meta })),
      { type: 'prompt', title: 'Explain classes and objects with an everyday example, then quiz me with 3 questions.', meta: 'Prompt' },
      { type: 'mine', title: `Your quiz result: ${p.quizScore}%`, meta: 'Your work' }] });
    if (a[3] === 'completed') g.push({ id: 'l1-a3', title: 'Explore GitHub — cookie-demo', level: 1, items: [
      { type: 'link', title: D.L1.acts[3].repo, meta: 'Reference repository' },
      { type: 'prompt', title: 'Walk me through this repository file by file and tell me what each attribute is for.', meta: 'Prompt' }] });

      { type: 'code', title: `cookie.py @ ${p.commit.sha}`, meta: 'Your build', code: p.code },
      { type: 'prompt', title: 'Review my Python class for PEP 8 and naming. Ask me questions instead of rewriting it.', meta: 'Prompt' }] });

    return g;
  };
  R.library = {
    roles: ['learner'], icon: 'book', keywords: 'resources prompts recordings',
    render() {
      const groups = P.libraryGroups(), open = new Set(AH.S.resOpen);
      const icon = { video: 'video', page: 'file', prompt: 'sparkle', mine: 'check', link: 'github', code: 'code' };
      return `${C.header({ variant: 'cream', title: 'Everything from your activities', desc: 'Recordings, prompts, reference repos and the things you\'ve made — filed under the activity they came from. New items appear as you progress.' })}

          <div style="flex:1;min-width:0"><div class="${it.type === 'prompt' ? '' : 'bold'}" style="font-size:14.5px;overflow-wrap:anywhere">${esc(it.title)}</div><div class="muted xs">${esc(it.meta)}</div></div>
