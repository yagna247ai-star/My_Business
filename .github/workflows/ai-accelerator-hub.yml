# AI Accelerator Hub — DevSecOps CI/CD
# Spec: ai-accelerator-hub/docs/CI_CD_DEVSECOPS_SPEC.md
#
#  every push / PR ─► secrets · dependencies · SAST · quality+build · DB tests+migration drift   (all must pass)
#  pull request    ─► Vercel preview deploy (no DB changes)
#  push to main    ─► production gate (GitHub "production" environment: your approval) ─► Vercel deploy
#                      ─► smoke test ─► automatic rollback if it fails
#
# Required repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: ai-accelerator-hub

on:
  push:
    branches: [main, enterprise-prod-readiness]
    paths: ['ai-accelerator-hub/**', '.github/workflows/ai-accelerator-hub.yml']
  pull_request:
    paths: ['ai-accelerator-hub/**', '.github/workflows/ai-accelerator-hub.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aihub-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  VERCEL_CLI: 'vercel@66.2.0'
  GITLEAKS_VERSION: '8.21.2'
  PROD_URL: https://aiachub.nachikethaenterprises.business

defaults:
  run:
    working-directory: ai-accelerator-hub

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$file" "$base/$file"
          curl -sSfL -o /tmp/sums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " $file\$" sums.txt | sha256sum -c -)
          tar -xzf "/tmp/$file" -C /tmp gitleaks
      - name: Scan the project for committed secrets
        run: /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Deployed app — high and critical block the release
        run: npm audit --omit=dev --workspace=web --audit-level=high
      - name: Whole repo (report only — apps/api is not deployed)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: semgrep/semgrep:1.97.0
    defaults:
      run:
        working-directory: ai-accelerator-hub
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (blocking on ERROR severity)
        run: >
          semgrep scan --metrics=off --error --severity ERROR
          --config p/typescript --config p/react --config p/secrets --config p/owasp-top-ten
          --exclude 'node_modules' --exclude '*.test.ts' --exclude 'e2e'
          apps/web packages/db
      - name: Semgrep full report (warnings, not blocking)
        if: always()
        continue-on-error: true
        run: >
          semgrep scan --metrics=off --sarif --output semgrep.sarif
          --config p/typescript --config p/react --config p/secrets --config p/owasp-top-ten
          --exclude 'node_modules' --exclude 'e2e' apps/web packages/db
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: semgrep-report, path: ai-accelerator-hub/semgrep.sarif, if-no-files-found: ignore }

  quality:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-build-secret-ci-build-secret-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: ai-accelerator-hub/package-lock.json
      - run: npm ci
      - name: Lint (errors block)
        run: npm run lint:ci --workspace=web
      - name: Type check
        run: npm run typecheck --workspace=web
      - name: Unit tests
        run: npm run test:pure --workspace=web
      - name: Prisma schema valid
        working-directory: ai-accelerator-hub/packages/db
        run: npx prisma validate
      - name: Production build
        run: npm run build --workspace=web

  database:
    name: Migrations · drift · integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: aihub_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aihub_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aihub_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: ai-accelerator-hub/package-lock.json
      - run: npm ci
      - name: Create shadow database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE aihub_shadow;'
      - name: Migrations apply cleanly to an empty database
        working-directory: ai-accelerator-hub/packages/db
        env: { DATABASE_URL: '${{ env.TEST_DATABASE_URL }}', DATABASE_URL_UNPOOLED: '${{ env.TEST_DATABASE_URL }}' }
        run: npx prisma migrate deploy
      - name: No schema change without a migration (drift check)
        working-directory: ai-accelerator-hub/packages/db
        env: { DATABASE_URL: '${{ env.TEST_DATABASE_URL }}', DATABASE_URL_UNPOOLED: '${{ env.TEST_DATABASE_URL }}' }
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Integration tests
        run: npm run test:db --workspace=web

  preview:
    name: Preview deploy (Vercel)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [secrets, dependencies, sast, quality, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm i -g ${{ env.VERCEL_CLI }}
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (preview builds never run migrations or seeds)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Preview: $url" | tee -a "$GITHUB_STEP_SUMMARY"

  production:
    name: Production deploy (Vercel) + smoke + auto-rollback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, dependencies, sast, quality, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://aiachub.nachikethaenterprises.business
    concurrency:
      group: aihub-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm i -g ${{ env.VERCEL_CLI }}
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (runs migrations + content seed for production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test production
        run: scripts/ci/smoke.sh "$PROD_URL"
      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          vercel rollback --yes --token=${{ secrets.VERCEL_TOKEN }}
          echo "::error::Smoke test failed — production rolled back to the previous deployment" | tee -a "$GITHUB_STEP_SUMMARY"
