  <text x="14" y="58" class="mono" font-size="9.5" fill="rgba(248,250,252,0.62)">Preact + Vite + Tailwind • SOM overlay canvas</text>
  <rect x="14" y="64" width="90" height="16" rx="8" class="pill"/><text x="59" y="75" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#C9A86A">12-col Antigravity</text>
</g>
<g transform="translate(390,48)">
  <rect width="260" height="84" rx="16" fill="#111A2E" stroke="rgba(201,168,106,0.32)" stroke-width="1.4"/>
  <text x="14" y="22" class="sans" font-size="10" letter-spacing="0.11em" font-weight="800" fill="#C9A86A">USER</text>
  <text x="14" y="42" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">Human — “Do all daily tasks”</text>
  <text x="14" y="60" class="mono" font-size="9.5" fill="rgba(248,250,252,0.60)">Prompt → /computer-use → result</text>
</g>
<g transform="translate(692,48)">
  <rect width="380" height="84" rx="16" class="card"/>
  <text x="14" y="22" class="sans" font-size="10" letter-spacing="0.11em" font-weight="800" fill="#94A3B8">EXTERNAL — META MODEL API</text>
  <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">Muse Spark + computer_use tool</text>
  <text x="14" y="60" class="mono" font-size="9.5" fill="rgba(248,250,252,0.58)">Vision SOM + function calling</text>
</g>

<!-- Arrows top -->
<path d="M 348 90 L 390 90" class="arrow"/><path d="M 650 70 L 692 70" class="arrow" opacity="0.6"/>

<!-- Middle: FastAPI -->
<g transform="translate(28,156)">
