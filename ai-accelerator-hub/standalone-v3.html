<style>/* css/core.css */
/* AI Accelerator Hub v3 — core design system (tokens, shell, components). */
/* =========================================================
   1. TOKENS  (G-01, G-06)  — semantic, theme-switchable
   ========================================================= */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --script:'Caveat','Segoe Script',cursive;
  --r-lg:20px; --r:16px; --r-sm:12px; --r-xs:10px;
  --side-w:264px; --side-rail:76px; --header-h:64px;
  --content-max:980px;

  /* Sidebar is dark in both themes (reference) */
  --side-bg:linear-gradient(180deg,#0C1F3F 0%,#081830 42%,#061229 100%);
  --side-text:#C3CCE0; --side-muted:#8E9BB8; --side-line:rgba(255,255,255,.08);
  --side-hover:rgba(255,255,255,.06);
  --side-child-active:#2C303D;
  --side-top-active:linear-gradient(135deg,#3D5AFE 0%,#4B3FD1 100%);

  /* Gold — used as a FILL with dark text, or dark-brown INK on cream. Never gold text on white. */
  --gold-fill:linear-gradient(135deg,#EDD49A 0%,#D4AC5E 55%,#B78B3F 100%);
  --gold-on:#2A1E06;
  --gold-dot:#E8B94F;
}
:root[data-theme="light"]{
  --bg:#F4F7FD; --bg-glow:radial-gradient(900px 500px at 85% -10%,rgba(232,185,79,.08),transparent 60%),radial-gradient(800px 500px at 10% 110%,rgba(61,90,254,.06),transparent 60%);
  --surface:#FFFFFF; --surface-2:#F8FAFD; --surface-3:#EEF3FA;
  --border:#E3E9F3; --border-strong:#CFD8E8;
  --text:#0F172A; --text-2:#3F4C63; --text-3:#56647C;
  --primary:#2F55E0; --primary-hover:#2446C4; --on-primary:#FFFFFF;
  --link:#2446C4;
  --ink:#0E1737; --on-ink:#FFFFFF;           /* dark buttons, user chat bubble */
  --gold-tint:#FBF4E4; --gold-ink:#6B4E16; --gold-line:#E8D3A4;
  --success:#137A5D; --success-tint:#E3F5EE; --on-success:#FFFFFF;
  --danger:#B42318; --danger-tint:#FDECEA;
  --info-tint:#EAF1FE; --info-ink:#1E3A8A;
  --hero-cream:linear-gradient(100deg,#FFFFFF 0%,#FDFBF5 55%,#F8EFD9 100%);
  --hero-navy:linear-gradient(120deg,#0E1646 0%,#122159 55%,#123C5E 100%);
  --mint:#5EE0B5;
  --bubble-ai:#EEF3FA;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.06);
  --shadow-lg:0 20px 50px rgba(15,23,42,.18);
  --focus:#2F55E0;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#080C1A; --bg-glow:radial-gradient(1000px 500px at 85% -10%,rgba(92,95,255,.12),transparent 60%),radial-gradient(800px 500px at 10% 110%,rgba(58,123,255,.08),transparent 60%);
  --surface:#12182E; --surface-2:#161D36; --surface-3:#1C2442;
  --border:#232D4D; --border-strong:#2F3B63;
  --text:#F1F4FB; --text-2:#C2CAE0; --text-3:#A1ACC9;
  --primary:#3D63F0; --primary-hover:#5476F5; --on-primary:#FFFFFF;
  --link:#9DB8FF;
  --ink:#E8EDF8; --on-ink:#0E1737;
  --gold-tint:#2A2414; --gold-ink:#F0D28A; --gold-line:#5A4A22;
  --success:#1FA37C; --success-tint:#10302A; --on-success:#04140F;
  --danger:#FF8A80; --danger-tint:#3A1716;
  --info-tint:#18244A; --info-ink:#BFD0FF;
  --hero-cream:linear-gradient(100deg,#141B33 0%,#171E36 55%,#2A2414 100%);
  --hero-navy:linear-gradient(120deg,#0B1236 0%,#101C4E 55%,#0F3352 100%);
  --mint:#5EE0B5;
  --bubble-ai:#1C2442;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  --focus:#9DB8FF;
  color-scheme:dark;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.55;color:var(--text);background:var(--bg);background-image:var(--bg-glow);background-attachment:fixed;min-height:100vh}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
img{max-width:100%;display:block}
.ic{width:18px;height:18px;flex-shrink:0}
.ic-sm{width:15px;height:15px}
.ic-lg{width:22px;height:22px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--surface);color:var(--text);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:700}
.skip:focus{top:12px}
@media (prefers-reduced-motion:no-preference){
  .anim{transition:all .2s ease}
}

/* =========================================================
   3. APP SHELL
   ========================================================= */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.app.is-rail{grid-template-columns:var(--side-rail) minmax(0,1fr)}
@media (prefers-reduced-motion:no-preference){.app{transition:grid-template-columns .25s ease}}

/* ---------- Sidebar (G-02) ---------- */
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;background:var(--side-bg);color:var(--side-text);padding:16px 14px 20px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:#22304f transparent}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);display:grid;place-items:center;flex-shrink:0}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-txt b{font-size:14px;font-weight:800;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.brand-txt small{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--side-muted)}
.rail-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--side-line);display:grid;place-items:center;color:var(--side-muted);flex-shrink:0}
.rail-btn:hover{color:#fff;background:var(--side-hover)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--side-text);font-size:14.5px;font-weight:500;white-space:nowrap}
.nav-item:hover{background:var(--side-hover);color:#fff}
.nav-item.active{color:#fff;font-weight:700}
.nav-item.top.active{background:var(--side-top-active);box-shadow:0 8px 24px rgba(61,90,254,.35)}
.nav-item.child.active{background:var(--side-child-active);box-shadow:0 10px 24px rgba(40,80,200,.25),inset 0 1px 0 rgba(255,255,255,.06)}
.nav-item .dot{position:absolute;right:12px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--gold-dot)}
.nav-item .lock{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--side-muted)}
.tier{margin:6px 0 2px}
.tier-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:#fff;font-size:12px;font-weight:800;letter-spacing:.14em;border:1px solid transparent}
.tier.has-active .tier-btn{background:#2F323C;border-color:rgba(232,185,79,.55)}
.tier-btn .medal{color:var(--gold-dot)}
.tier-btn .chev{margin-left:auto;color:var(--side-muted)}
@media (prefers-reduced-motion:no-preference){.tier-btn .chev{transition:transform .2s ease}}
.tier-btn[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.tier-panel{position:relative;margin:6px 0 0 22px;padding-left:12px;display:flex;flex-direction:column;gap:3px}
.tier-panel::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--side-line)}
.side-div{height:1px;background:var(--side-line);margin:12px 8px}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--side-line);font-size:12.5px;color:var(--side-muted)}
.side-foot b{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.side-foot .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.side-foot .bar i{display:block;height:100%;background:var(--gold-fill);border-radius:99px}

/* Rail mode */
.app.is-rail .sidebar{padding-left:10px;padding-right:10px}
.app.is-rail .brand-txt,.app.is-rail .nav-item .lbl,.app.is-rail .tier-btn .lbl,.app.is-rail .tier-btn .chev,.app.is-rail .side-foot,.app.is-rail .nav-item .lock{display:none}
.app.is-rail .brand-row{flex-direction:column;gap:10px}
.app.is-rail .nav-item,.app.is-rail .tier-btn{justify-content:center;padding:11px}
.app.is-rail .tier-panel{display:flex!important;margin-left:0;padding-left:0}
.app.is-rail .tier-panel::before{display:none}
.app.is-rail .nav-item .dot{right:6px;top:8px;margin:0}

/* ---------- Main column ---------- */
.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px}
.crumb-pre{color:var(--text-3);white-space:nowrap}
.crumb-cur{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .ic{color:var(--text-3)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap}
.pill-streak{background:var(--info-tint);color:var(--info-ink)}
.pill-streak .ic{color:#E07A2E}
.pill-rank{background:var(--gold-tint);color:var(--gold-ink);border:1px solid var(--gold-line);font-weight:800;letter-spacing:.12em;font-size:12.5px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text-2);box-shadow:var(--shadow-sm)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.icon-btn[aria-pressed="true"].sound{color:var(--primary)}
.user-wrap{position:relative}
.user-chip{display:flex;align-items:center;gap:9px;height:42px;padding:0 14px 0 4px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:14px;box-shadow:var(--shadow-sm)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:200px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:40}
.menu[hidden]{display:none}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--text-2);text-align:left}
.menu a:hover,.menu button:hover,.menu a:focus-visible,.menu button:focus-visible{background:var(--surface-3);color:var(--text)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.only-mobile{display:none}
main{flex:1;width:100%;max-width:calc(var(--content-max) + 56px);margin:0 auto;padding:28px 28px 120px}
main:focus{outline:none}

/* Mobile shell */
@media (max-width:1023px){
  .app,.app.is-rail{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:286px;z-index:60;transform:translateX(-102%);visibility:hidden;box-shadow:var(--shadow-lg)}
  .sidebar.is-open{transform:none;visibility:visible}
  @media (prefers-reduced-motion:no-preference){.sidebar{transition:transform .25s ease,visibility .25s}}
  .app.is-rail .brand-txt,.app.is-rail .nav-item .lbl,.app.is-rail .tier-btn .lbl,.app.is-rail .tier-btn .chev,.app.is-rail .side-foot{display:revert}
  .app.is-rail .nav-item,.app.is-rail .tier-btn{justify-content:flex-start;padding:10px 12px}
  .app.is-rail .brand-row{flex-direction:row}
  .rail-btn.desk{display:none}
  .only-mobile{display:grid}
  .overlay{position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:55}
  .overlay[hidden]{display:none}
  .topbar{padding:0 16px}
  main{padding:20px 16px 120px}
}
@media (max-width:720px){
  .crumb-pre,.pill-rank,.user-chip .uname,.pill-streak .days-word{display:none}
  .user-chip{padding:0 4px}
  .pill{padding:0 11px}
  .icon-btn{width:38px;height:38px}
  .top-right{gap:6px}
}

/* =========================================================
   4. COMPONENTS
   ========================================================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:24px}
@media (max-width:640px){.card-pad{padding:18px}}
.stack{display:flex;flex-direction:column}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}
.row{display:flex;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--text-3)}
.text-2{color:var(--text-2)}
.small{font-size:13px}
.xs{font-size:12px}
.bold{font-weight:700}
.h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
.section-label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.link{color:var(--link);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14.5px;white-space:nowrap;border:1px solid transparent}
.btn-sm{height:34px;padding:0 14px;font-size:13.5px}
.btn-block{width:100%}
.btn-gold{background:var(--gold-fill);color:var(--gold-on);box-shadow:0 8px 20px rgba(183,139,63,.28)}
.btn-gold:hover{filter:brightness(1.04)}
.btn-gold:disabled{filter:grayscale(.5);opacity:.55;box-shadow:none}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-ink:hover{filter:brightness(1.15)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-soft{background:var(--surface-3);color:var(--text)}
.btn-soft:hover{background:var(--border)}
.btn-outline{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-outline:hover{border-color:var(--text-3)}
.btn-cream{background:var(--gold-tint);color:var(--gold-ink);border-color:var(--gold-line)}
.btn-danger{background:var(--danger);color:#fff}
:root[data-theme="dark"] .btn-danger{color:#2A0907}
.btn-text{height:auto;padding:6px 8px;border-radius:8px;color:var(--text-3);font-weight:600;font-size:13.5px}
.btn-text:hover{color:var(--text);background:var(--surface-3)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chip{flex-shrink:0;height:36px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-weight:600;font-size:14px}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--gold-fill);color:var(--gold-on);border-color:transparent;box-shadow:0 6px 14px rgba(183,139,63,.25)}
.chip-soft{background:var(--surface-3);border-color:transparent}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge-neutral{background:var(--surface-3);color:var(--text-2)}
.badge-gold{background:var(--gold-tint);color:var(--gold-ink);border:1px solid var(--gold-line)}
.badge-success{background:var(--success-tint);color:var(--success)}
:root[data-theme="dark"] .badge-success{color:#7FE0BE}
.badge-info{background:var(--info-tint);color:var(--info-ink)}
.badge-warn{background:#FFF4E0;color:#7A4A00}
:root[data-theme="dark"] .badge-warn{background:#3A2A0E;color:#FFD38A}

/* Avatars */
.avatar{flex-shrink:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--gold-tint);color:var(--gold-ink);border:1.5px solid var(--gold-line);letter-spacing:.02em}
.avatar-sm{width:32px;height:32px;font-size:11.5px}
.avatar-xs{width:34px;height:34px;font-size:12px}
.avatar.me{background:linear-gradient(135deg,#3D5AFE,#4B3FD1);color:#fff;border-color:transparent}

/* Progress */
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--gold-fill)}
.bar.blue>i{background:linear-gradient(90deg,#3D5AFE,#6B7BFF)}

/* Page header (G-05) */
.ph{position:relative;overflow:hidden;border-radius:var(--r-lg);margin-bottom:24px}
.ph-cream{background:var(--hero-cream);border:1px solid var(--gold-line);box-shadow:var(--shadow);padding:30px 32px}
.ph-navy{background:var(--hero-navy);color:#fff;padding:36px 36px;box-shadow:var(--shadow-lg)}
.ph-plain{padding:4px 0 2px}
.ph h1{font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-.025em;max-width:22ch}
.ph-plain h1{max-width:none}
.ph-navy h1{font-size:44px;max-width:20ch}
.ph p.desc{margin-top:10px;max-width:62ch;color:var(--text-2);font-size:15.5px}
.ph-navy p.desc{color:#D5DCF2}
.ph-navy .eyebrow{color:#C9D3F2}
.ph .eyebrow{display:block;margin-bottom:10px}
.ph .hl{color:var(--mint)}
.ph .deco{position:absolute;right:0;top:0;height:100%;width:46%;pointer-events:none;opacity:.9}
.ph .note{margin-top:12px}
@media (max-width:640px){.ph-cream,.ph-navy{padding:22px 20px}.ph h1{font-size:27px}.ph-navy h1{font-size:31px}.ph .deco{width:70%;opacity:.5}}

/* Tabs / segmented */
.tabs{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.tab{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:999px;font-weight:700;color:var(--text-2)}
.tab[aria-selected="true"]{background:var(--gold-fill);color:var(--gold-on);box-shadow:0 6px 14px rgba(183,139,63,.25)}

/* Form fields */
.field-label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.input,.textarea,.select{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:15px;color:var(--text)}
.textarea{resize:vertical;min-height:96px;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus-visible,.textarea:focus-visible,.select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
[aria-invalid="true"]{border-color:var(--danger)!important}
.field-err{color:var(--danger);font-size:13px;font-weight:600;margin-top:6px}
.field-hint{color:var(--text-3);font-size:13px;margin-top:6px}

/* Empty / skeleton */
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty .ic-wrap{width:52px;height:52px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.pending-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-3);color:var(--text-2);font-size:13.5px}

/* Toasts */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{pointer-events:auto;background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);text-align:center}

/* FAB (G-04) */
.fab{position:fixed;right:24px;bottom:24px;z-index:45;display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 22px 0 18px;border-radius:999px;background:#0E1737;color:#fff;font-weight:800;font-size:15.5px;box-shadow:0 14px 34px rgba(14,23,55,.4)}
:root[data-theme="dark"] .fab{background:#E8EDF8;color:#0E1737}
.fab:hover{filter:brightness(1.12)}
.fab[hidden]{display:none}
@media (max-width:640px){.fab{right:16px;bottom:calc(16px + env(safe-area-inset-bottom));height:50px}}

/* Modal + drawer */
.backdrop{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:80;display:grid;place-items:center;padding:16px}
.dialog{width:min(100%,460px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:22px}
.dialog h2{font-size:18px;font-weight:800}
.dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.drawer-back{position:fixed;inset:0;background:rgba(5,10,25,.45);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,460px);z-index:75;background:var(--bg);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.drawer-body{flex:1;overflow:auto;padding:16px}

/* =========================================================
   5. MODULE STYLES
   ========================================================= */
/* Feed */
.composer{position:relative;border-top:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,#D4AC5E,#EDD49A 50%,transparent) border-box}
.composer-inner{background:linear-gradient(180deg,var(--gold-tint),var(--surface) 60%);border-radius:var(--r-lg);padding:24px}
:root[data-theme="dark"] .composer-inner{background:linear-gradient(180deg,#1A1C2A,var(--surface) 60%)}
.composer .ta-wrap{position:relative}
.composer .ta-wrap .textarea{padding-right:48px;min-height:110px}
.emoji-btn{position:absolute;right:10px;bottom:12px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}
.emoji-btn:hover{background:var(--surface-3);color:var(--text)}
.emoji-pop{position:absolute;right:0;bottom:50px;z-index:5;display:grid;grid-template-columns:repeat(6,36px);gap:2px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg)}
.emoji-pop button{height:36px;border-radius:8px;font-size:19px}
.emoji-pop button:hover{background:var(--surface-3)}
.post{padding:20px 22px}
.post-head{display:flex;gap:14px;align-items:flex-start}
.post-name{font-weight:700;font-size:15.5px}
.post-meta{color:var(--text-3);font-size:13.5px}
.post-body{margin:12px 0 0 58px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-size:15.5px;color:var(--text)}
.post-body a{color:var(--link);text-decoration:underline}
.post-actions{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.act-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface-3);font-weight:700;font-size:14px;color:var(--text)}
.act-btn:hover{background:var(--border)}
.act-btn[aria-pressed="true"]{color:#C2185B}
:root[data-theme="dark"] .act-btn[aria-pressed="true"]{color:#FF8FB8}
.act-btn[aria-pressed="true"] svg{fill:currentColor}
.act-right{margin-left:auto}
.thread{margin:14px 0 0 22px;padding-left:20px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:14px}
.reply-body{margin:6px 0 0 44px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply-actions{display:flex;align-items:center;gap:8px;margin:8px 0 0 44px}
.reply-box{margin:14px 0 0 22px;display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.post{padding:16px}.post-body{margin-left:0}.thread{margin-left:4px;padding-left:12px}.reply-body,.reply-actions{margin-left:0}.reply-box{margin-left:0}}

/* Resources accordion */
.acc{display:flex;flex-direction:column;gap:12px}
.acc-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:18px 22px;text-align:left}
.acc-head:hover{background:var(--surface-2)}
.acc-title{font-weight:700;font-size:15.5px;flex:1;min-width:0}
.acc-meta{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:14px;white-space:nowrap}
.acc-meta .lv{font-weight:700;color:var(--text-2);font-size:13px}
.acc-head .chev{color:var(--text-2)}
@media (prefers-reduced-motion:no-preference){.acc-head .chev{transition:transform .2s ease}}
.acc-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc-panel{border-top:1px solid var(--border);padding:8px 12px 12px}
.acc-panel[hidden]{display:none}
.res-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px}
.res-row:hover{background:var(--surface-2)}
.res-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);flex-shrink:0}
.res-ic.prompt{background:var(--gold-tint);color:var(--gold-ink)}
.res-ic.mine{background:var(--success-tint);color:var(--success)}
@media (max-width:640px){.acc-head{padding:16px}.acc-meta .lv{display:none}}

/* Showcase */
.cta-green{display:flex;align-items:center;gap:16px;padding:20px 24px;border-radius:var(--r-lg);background:linear-gradient(120deg,#137A5D,#0F6B52);color:#fff;box-shadow:0 14px 30px rgba(19,122,93,.25);margin-bottom:24px}
.cta-green .big{font-size:18px;font-weight:800}
.cta-green .sub{color:#E1F5EE;font-size:14.5px}
.cta-green .ic-lg{width:30px;height:30px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.proj{overflow:hidden;display:flex;flex-direction:column}
.proj-cover{height:150px;display:grid;place-items:center}
.proj-ring{width:76px;height:76px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:24px;font-weight:800;letter-spacing:.02em}
.proj-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.proj-author{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.proj-meta{display:flex;align-items:center;gap:14px;color:var(--text-3);font-size:14px}
.proj-meta span{display:inline-flex;align-items:center;gap:5px}
.proj-title{font-weight:700;font-size:15.5px}
.proj-desc{color:var(--text-2);font-size:14.5px}
.proj-actions{display:flex;gap:10px;margin-top:auto;padding-top:6px}
.proj-actions .btn-gold{flex:1}

/* Unstuck */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:18px;background:var(--surface-3)}
.seg-opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;text-align:left;color:var(--text)}
.seg-opt[aria-checked="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg-opt .tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--info-tint);color:var(--info-ink)}
.seg-opt .tile.gold{background:var(--gold-tint);color:var(--gold-ink)}
.seg-opt b{display:block;font-size:15.5px}
.seg-opt small{display:block;color:var(--text-3);font-size:13.5px;line-height:1.4;margin-top:2px}
.compact .seg-opt{padding:10px 12px}
.compact .seg-opt small{display:none}
.compact .seg-opt .tile{width:32px;height:32px}
.chat-intro{color:var(--text-2);margin:18px 4px 12px}
.msgs{height:min(52vh,460px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 4px 12px;scroll-behavior:smooth}
.drawer .msgs{height:auto;min-height:220px;flex:1}
.msgs.is-empty{height:auto;min-height:0;padding-bottom:16px}
.msgs.is-empty .sugg{margin-top:0}
.ph-plain{overflow:visible}
.msg{max-width:84%;padding:12px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--bubble-ai);border:1px solid var(--border);border-bottom-left-radius:6px}
.msg.ai.err{border-color:var(--danger)}
.msg img{max-height:160px;border-radius:10px;margin-bottom:8px}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.typing::after{animation:none}}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.sugg button{padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:14px;font-weight:600;color:var(--text-2);text-align:left}
.sugg button:hover{border-color:var(--border-strong);color:var(--text)}
.ctx{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:999px;background:var(--info-tint);color:var(--info-ink);font-size:13px;font-weight:700;margin:0 0 8px}
.ctx button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ctx button:hover{background:rgba(0,0,0,.08)}
.att{display:inline-flex;align-items:center;gap:8px;padding:6px;border-radius:12px;border:1px solid var(--border);background:var(--surface);margin:0 0 8px 8px}
.att img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.chat-comp{display:flex;align-items:flex-end;gap:8px;padding:10px;border-radius:18px;background:var(--surface-2);border:1px solid var(--border)}
.chat-comp .textarea{min-height:46px;max-height:156px;resize:none;border-radius:12px;padding:11px 14px}
.sq{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.sq:hover{color:var(--text);border-color:var(--border-strong)}
.sq.send{background:var(--ink);color:var(--on-ink);border-color:transparent}
.sq.send:disabled{opacity:.4}
.sq.listening{color:#fff;background:var(--danger);border-color:transparent}
.demo-note{margin:10px 4px 0;color:var(--text-3);font-size:12.5px}
.help-card{display:flex;flex-direction:column;gap:10px;padding:22px}
.help-card .top{display:flex;gap:14px}
.help-card .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--surface-3);color:var(--text-2)}
.help-card .tile.gold{background:var(--gold-tint);color:var(--gold-ink)}
.help-card .link{margin-top:auto}
.note-card{position:relative;padding:24px 26px;border-top:0;overflow:hidden}
.note-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#B78B3F,#EDD49A,#B78B3F)}
.script{font-family:var(--script);font-size:27px;line-height:1.1;color:var(--text)}
@media (max-width:640px){.seg{grid-template-columns:1fr}.msg{max-width:92%}}

/* Home / Levels */
.grid-12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-12{grid-column:1 / -1}.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-3{grid-column:span 3}
@media (max-width:960px){.span-8,.span-4,.span-6{grid-column:span 12}.span-3{grid-column:span 6}}
@media (max-width:520px){.span-3{grid-column:span 12}}
.next-card{padding:24px;display:flex;flex-direction:column;gap:16px}
.lv-num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gold-fill);color:var(--gold-on);font-weight:800;font-size:18px;flex-shrink:0}
.mini{padding:18px}
.mini .k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.mini .v{font-weight:700;margin-top:6px}
.mini .s{color:var(--text-3);font-size:13.5px;margin-top:2px}
.rail-scroll{overflow-x:auto;padding:8px 4px 4px;scrollbar-width:thin}
.jrail{position:relative;display:flex;justify-content:space-between;min-width:900px;padding:0 8px}
.jrail::before{content:"";position:absolute;left:28px;right:28px;top:20px;height:2px;background:linear-gradient(90deg,#D4AC5E 0%,#3D5AFE 12%,var(--border) 22%)}
.jnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:56px;text-align:center}
.jdot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--surface);border:1.5px solid var(--border-strong);color:var(--text-3)}
.jnode.current .jdot{background:var(--gold-fill);color:var(--gold-on);border-color:transparent;box-shadow:0 0 0 6px rgba(232,185,79,.22)}
.jnode.done .jdot{background:var(--success);color:var(--on-success);border-color:transparent}
.jnode .jl{font-size:12px;font-weight:700;line-height:1.25;color:var(--text-2)}
.jnode .jx{font-size:11.5px;color:var(--text-3)}
.stages{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lv-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:860px){.lv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.lv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lv-tile{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);text-align:left;min-height:118px}
.lv-tile .code{font-size:12px;font-weight:800;color:var(--text-3);letter-spacing:.06em}
.lv-tile .nm{font-weight:700;font-size:14.5px;line-height:1.3}
.lv-tile .st{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-3)}
.lv-tile.current{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-tint),var(--surface));box-shadow:0 8px 22px rgba(183,139,63,.15)}
.lv-tile.current .st{color:var(--gold-ink)}
.lv-tile.locked{background:var(--surface-2)}
.lv-tile.locked .nm{color:var(--text-2)}
button.lv-tile:hover{border-color:var(--border-strong)}
.tl{position:relative;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:2px;background:var(--border)}
.act{position:relative;display:flex;gap:14px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border)}
.act-n{position:relative;z-index:1;width:28px;height:28px;margin-left:-2px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;flex-shrink:0;background:var(--surface-3);color:var(--text-2);border:2px solid var(--surface)}
.act.done .act-n{background:var(--success);color:var(--on-success)}
.act.current{border-color:var(--gold-line);box-shadow:0 8px 22px rgba(183,139,63,.12)}
.act.current .act-n{background:var(--gold-fill);color:var(--gold-on)}
.act.review .act-n{background:var(--primary);color:#fff}
.act-main{flex:1;min-width:0}
.act-title{font-weight:700}
.act-xp{font-weight:800;color:var(--gold-ink);white-space:nowrap;font-size:14px}
.act-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl caption{text-align:left;padding:0 0 10px;color:var(--text-3);font-size:13.5px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:800;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--border)}
.tbl tr.me td{background:var(--gold-tint)}
.tbl tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}

/* =========================================================
   6. ANTI-GRAVITY  (ported from standalone.html hero:
   planet + orbit rings + orbiting level dots + floating glass
   cards + star field + pulse). Motion only when allowed.
   ========================================================= */
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;opacity:var(--o)}
.sidebar>*:not(.stars){position:relative;z-index:1}
.ph-navy>div:not(.stars){z-index:1}

.ag-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);overflow:hidden}
.ag-left{padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ag-space{position:relative;min-height:420px;overflow:hidden;color:#fff;
  background:radial-gradient(520px 300px at 15% -5%,rgba(92,95,255,.30),transparent 60%),radial-gradient(420px 260px at 105% 105%,rgba(58,123,255,.22),transparent 60%),radial-gradient(380px 220px at 50% 110%,rgba(124,92,255,.16),transparent 60%),linear-gradient(160deg,#0D1540 0%,#080C1A 100%)}
.ag-glow{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,rgba(92,95,255,.34) 0%,rgba(58,123,255,.16) 32%,transparent 70%);filter:blur(18px);z-index:1}
.ag-ring{position:absolute;left:50%;top:50%;border-radius:50%;z-index:1}
.ag-ring.r1{width:300px;height:300px;margin:-150px 0 0 -150px;border:1px dashed rgba(255,255,255,.14)}
.ag-ring.r2{width:220px;height:220px;margin:-110px 0 0 -110px;border:1px solid rgba(255,255,255,.08)}
.ag-orbit{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2}
.ag-orbit i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.38)}
.ag-orbit i.cur{left:-5px;top:-5px;width:10px;height:10px;background:var(--gold-dot);box-shadow:0 0 12px var(--gold-dot)}
.ag-planet-wrap{position:absolute;left:50%;top:50%;width:156px;height:156px;margin:-78px 0 0 -78px;z-index:3}
.ag-planet{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(120px 120px at 30% 30%,#2A3A7A 0%,#16204A 40%,#0E1430 70%,#080C1A 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 20px 60px rgba(0,0,0,.6),0 0 44px rgba(90,143,255,.32)}
.ag-planet::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(255,255,255,.16)}
.ag-planet::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,255,255,.06);transform:rotateX(65deg)}
.ag-planet .k{font-size:10.5px;letter-spacing:.16em;color:#AEB8D8;font-weight:700}
.ag-planet .lv{font-size:17px;font-weight:800;line-height:1.2}
.ag-planet .nm{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--gold-dot)}
.ag-planet .xp{margin-top:5px;display:inline-block;padding:2px 9px;border-radius:99px;background:var(--gold-fill);color:var(--gold-on);font-size:11px;font-weight:800}
.ag-card{position:absolute;z-index:4;width:160px;padding:12px 13px;border-radius:16px;color:#fff;
  background:rgba(18,24,46,.82);border:1px solid rgba(255,255,255,.12);

/* Week strip (weekend engine) */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{padding:12px 10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);min-height:96px;display:flex;flex-direction:column;gap:4px}
.day .dn{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.day .dd{font-size:18px;font-weight:800}
.day .de{font-size:12.5px;color:var(--text-2);line-height:1.35}
.day.today{background:var(--surface);border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.day.today .dn{color:var(--primary)}
.day.event{background:linear-gradient(180deg,var(--gold-tint),var(--surface))}
.day.done-day .dd::after{content:"✓";margin-left:6px;font-size:13px;color:var(--success)}
@media (max-width:760px){.week{grid-template-columns:repeat(7,minmax(84px,1fr));overflow-x:auto}}

/* Tables */
.table-wrap{overflow-x:auto}
.tbl .muted-cell{color:var(--text-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status.ok{color:var(--success)}
:root[data-theme="dark"] .status.ok{color:#7FE0BE}
.status.warn{color:#B54708}
:root[data-theme="dark"] .status.warn{color:#FFD38A}
.status.info{color:var(--primary)}
.status.mute{color:var(--text-3)}

/* Settings */
.settings{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.settings{grid-template-columns:minmax(0,1fr)}}
.set-nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.set-nav a{padding:9px 12px;border-radius:10px;color:var(--text-2);font-weight:600;font-size:14px}
.set-nav a:hover{background:var(--surface-3);color:var(--text)}
@media (max-width:860px){.set-nav{position:static;flex-direction:row;overflow-x:auto}}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:15px}
.set-row p{font-size:13.5px;color:var(--text-3);margin-top:2px;max-width:56ch}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--border-strong);flex-shrink:0;border:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.switch::after{transition:transform .2s ease}.switch{transition:background .2s ease}}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.seg-sm{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface-3);gap:2px}
.seg-sm button{padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--text-2)}
.seg-sm button[aria-checked="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* Celebration */
.celebrate{position:fixed;inset:0;z-index:96;display:grid;place-items:center;padding:16px;background:rgba(5,10,25,.6)}
.celebrate .dialog{text-align:center;max-width:440px;position:relative;overflow:hidden}
.celebrate .burst{width:96px;height:96px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:radial-gradient(circle at 30% 30%,#FFF0C2,#C99B4C);box-shadow:0 0 0 10px color-mix(in srgb,var(--gold-dot) 20%,transparent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:97;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;opacity:.95}
@media (prefers-reduced-motion:no-preference){
  @keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
  .confetti i{animation:fall var(--t) cubic-bezier(.2,.6,.4,1) forwards var(--dl)}
}
.reduce-motion .confetti{display:none}
.reduce-motion *{animation:none!important;transition:none!important}

/* Skeleton */
.skel{border-radius:10px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;min-height:14px}
@media (prefers-reduced-motion:no-preference){@keyframes sk{to{background-position:-200% 0}}.skel{animation:sk 1.3s linear infinite}}

/* Next-best-action & misc */
.nba{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border)}
.nba .ic-tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--gold-tint);color:var(--gold-ink)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;font-size:14px}
.callout.info{background:var(--info-tint);color:var(--info-ink)}
.callout.ok{background:var(--success-tint);color:var(--success)}
:root[data-theme="dark"] .callout.ok{color:#7FE0BE}
.callout.warn{background:#FFF4E0;color:#7A4A00}
:root[data-theme="dark"] .callout.warn{background:#3A2A0E;color:#FFD38A}
.callout b{display:block}
.forbidden{max-width:520px;margin:40px auto;text-align:center}
.quota{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-3)}
.quota .bar{width:120px;height:6px}
.coach-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px;border-radius:18px;background:var(--surface-3)}
@media (max-width:760px){.coach-pick{grid-template-columns:minmax(0,1fr)}}
.compact .coach-pick{grid-template-columns:repeat(3,minmax(0,1fr))}
.compact .coach-pick small{display:none}
.tabs-line{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs-line button{padding:10px 14px;font-weight:700;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs-line button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--primary)}
.tabs-line .cnt{margin-left:6px;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--surface-3);color:var(--text-2)}
.stage-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.stage-strip{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;padding-bottom:6px}}
.stage{padding:16px;border-radius:16px;border:1px solid var(--border);background:var(--surface)}
.stage.current{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-tint),var(--surface))}
.stage .sname{font-weight:800;font-size:16px}
.stage .gate-t{font-size:12.5px;color:var(--text-3);margin-top:6px;line-height:1.4}
.print-only{display:none}
@media print{.sidebar,.topbar,.fab,.toasts{display:none!important}.app{display:block}main{padding:0}.card{box-shadow:none}}

/* Phone top bar — must follow the base .search-btn rule */
@media (max-width:760px){
  .search-btn{flex:0 0 38px;width:38px;height:38px;padding:0;justify-content:center;margin-left:auto}
  .search-btn .lbl,.search-btn .kbd{display:none}
}

<script>/* js/core/engine.js */
/* AI Accelerator Hub v3 — domain engine (state + business rules).
   Mirrors the server contracts in the gamification model so the UI behaves
   like production: append-only XP ledger with idempotency keys and a hash
   chain, competence-gated unlocks, non-punitive streaks, declarative badges,
   rubric-based review, notifications and an audit trail.
   In production these run server-side; here they run locally on demo data. */
(function (AH) {
  'use strict';
  const { U, D } = AH;
  const E = (AH.E = {});
  const KEY = 'ah3_state_v1', VERSION = 3;
  const NOW = Date.now(), DAY = U.DAY, H = 3600000;
  const listeners = new Set();

  /* ---------------- State ---------------- */
  function fresh() {
    const S = {
      v: VERSION, role: 'learner',
      prefs: { lang: 'en', sound: false, motion: 'system', lbVisibility: 'cohort', globalOptIn: false, rail: false,
        notif: { streak: true, reviews: true, community: true, quiet: true }, aiOutage: false },
      progress: {
        levels: Object.fromEntries(D.LEVELS.map(l => [l.idx, l.idx === 1 ? 'in_progress' : 'locked'])),
        acts: { 1: 'completed', 2: 'completed', 3: 'available', 4: 'locked', 5: 'locked', 6: 'locked' },
        a1: 0, quiz: { 0: 1, 1: 1, 2: 0, 3: 1 }, quizScore: 100, a3: {},
        code: null, tests: null, repo: '', commit: null,
        boss: { attempts: 0, best: 0, runs: [], code: null },
        lastAct: 3
      },
      submissions: [],
      peerSubs: JSON.parse(JSON.stringify(D.PEER_SUBMISSIONS)),
      decided: JSON.parse(JSON.stringify(D.DECIDED)),
      ledger: [],
      streak: { current: 3, longest: 5, freezes: 1, status: 'active', lastDay: U.istDay(NOW - DAY), prev: 0, events: [] },
      badges: {},
      notifications: [],
      audit: [],
      posts: D.POSTS.map(p => ({ ...p, liked: false, reported: false, status: 'live', replies: p.replies.map(([w, t, d], i) => ({ id: `${p.id}-r${i}`, who: w, text: t, at: NOW - d * DAY, likes: 0, liked: false })) })),
      chat: { coach: 'concept-explainer', threads: { 'concept-explainer': [], 'code-mentor': [], 'career-coach': [] }, used: 0, day: U.istDay() },
      shortlist: [], celebrations: [], events: [], resOpen: [], nudged: {}
    };
    // Ledger history for A1 and A2 (already completed in the seed)
    pushLedger(S, { source: 'activity_completed', amount: 5, ref: 'L1·A1 Mission Briefing', idem: 'act:L01:A1', at: NOW - 3 * DAY });
    pushLedger(S, { source: 'activity_completed', amount: 18, ref: 'L1·A2 Learn (quiz 100%)', idem: 'act:L01:A2', at: NOW - 1 * DAY });
    S.notifications.push(
      { id: U.uid('n'), type: 'event', icon: 'calendar', tone: 'gold', title: 'Saturday workshop: classes in the wild', body: 'Live at 10:00 IST. The recording lands in your Library afterwards.', at: NOW - 2 * H, read: false, href: '#/library' },
      { id: U.uid('n'), type: 'xp', icon: 'zap', tone: 'ok', title: '+18 XP — Learn complete', body: 'Quiz passed with 100%. Explore GitHub is now open.', at: NOW - DAY, read: true, href: '#/journey/1' },
      { id: U.uid('n'), to: 'reviewer', type: 'review', icon: 'clock', tone: 'warn', title: 'Review SLA at risk', body: 'Divya Nair has waited 52 h (target 72 h).', at: NOW - 3 * H, read: false, href: '#/review/sub-k1' },
      { id: U.uid('n'), to: 'pm', type: 'info', icon: 'users', tone: 'warn', title: '4 learners need attention', body: '2 in grace, 2 in streak recovery. Nudges are one click away.', at: NOW - 4 * H, read: false, href: '#/learners' },
      { id: U.uid('n'), to: 'pm', type: 'info', icon: 'chart', tone: '', title: 'Drop-off spike at Build', body: 'Only 22 of 31 learners moved from Explore to Build in Level 1.', at: NOW - 26 * H, read: true, href: '#/analytics' }
    );
    S.audit.push(
      { id: U.uid('a'), at: NOW - 9 * DAY, actor: 'Sanjay Kapoor', role: 'Program Manager', action: 'cohort.published', target: `${D.WORKSPACE.cohort} · Level 1`, ip: '10.4.1.12' },
      { id: U.uid('a'), at: NOW - 9 * DAY, actor: 'Sanjay Kapoor', role: 'Program Manager', action: 'role.assigned', target: 'Priya Raman → Reviewer', ip: '10.4.1.12' },
      { id: U.uid('a'), at: NOW - 3 * DAY, actor: 'system', role: 'Ledger', action: 'xp.awarded', target: 'Ishaan Verma +5 (act:L01:A1)', ip: '—' },
      { id: U.uid('a'), at: NOW - 3 * DAY, actor: 'Priya Raman', role: 'Reviewer', action: 'review.needs_changes', target: 'Arjun Mehta · L1 attempt 1 (2.70)', ip: '10.4.2.33' },
      { id: U.uid('a'), at: NOW - 1 * DAY, actor: 'system', role: 'Ledger', action: 'xp.awarded', target: 'Ishaan Verma +18 (act:L01:A2)', ip: '—' }
    );
    return S;
  }

  function load() {
    const s = U.store.get(KEY, null);
    if (!s || s.v !== VERSION) return fresh();
    return s;
  }
  AH.S = load();
  const persist = U.debounce(() => { if (!U.store.set(KEY, AH.S)) console.warn('[AH] state not persisted (storage unavailable)'); }, 120);

  E.subscribe = fn => { listeners.add(fn); return () => listeners.delete(fn); };
  E.commit = (fn, opts = {}) => { if (fn) fn(AH.S); persist(); if (!opts.silent) listeners.forEach(l => l()); };
  E.reset = () => { U.store.remove(KEY); AH.S = fresh(); E.commit(); };
  // Keep tabs in sync (state written by another tab)
  window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { AH.S = JSON.parse(e.newValue); listeners.forEach(l => l()); } catch (x) {} } });

  E.persona = () => D.PERSONAS[AH.S.role];
  E.me = () => D.PERSONAS.learner;

  /* ---------------- Telemetry & audit ---------------- */
  E.track = (name, props = {}) => {
    const ev = { name, props, at: Date.now(), role: AH.S.role };
    AH.S.events.unshift(ev); AH.S.events.length = Math.min(AH.S.events.length, 200);
  };
  E.audit = (action, target) => {
    const p = E.persona();
    AH.S.audit.unshift({ id: U.uid('a'), at: Date.now(), actor: p.name, role: p.title, action, target, ip: '127.0.0.1' });
  };
  E.notify = ({ type = 'info', icon = 'bell', tone = '', title, body = '', href = '', to = 'learner' }) => {
    const pref = AH.S.prefs.notif;
    if (to === 'learner' && ((type === 'streak' && !pref.streak) || (type === 'review' && !pref.reviews) || (type === 'community' && !pref.community))) return;
    AH.S.notifications.unshift({ id: U.uid('n'), to, type, icon, tone, title, body, href, at: Date.now(), read: false });
  };
  E.myNotifications = () => AH.S.notifications.filter(n => (n.to || 'learner') === AH.S.role);

  /* ---------------- XP ledger (append-only, idempotent, hash-chained) ---------------- */
  function pushLedger(S, { source, amount, ref, idem, at = Date.now() }) {
    const prev = S.ledger.length ? S.ledger[S.ledger.length - 1].hash : 'GENESIS';
    const id = 'xp_' + (S.ledger.length + 1).toString().padStart(5, '0');
    const hash = U.hash([prev, id, amount, source, idem, at].join('|'));
    const entry = { id, at, source, amount, ref, idem, prev, hash };
    S.ledger.push(entry);
    return entry;
  }
  E.award = ({ source, amount, ref, idem }) => {
    if (AH.S.ledger.some(e => e.idem === idem)) { E.track('xp.duplicate_blocked', { idem }); return null; }  // UNIQUE(idempotency_key)
    const entry = pushLedger(AH.S, { source, amount, ref, idem });
    E.audit('xp.awarded', `${E.me().name} +${amount} (${idem})`);
    E.track('xp.awarded', { amount, source });
    return entry;
  };
  E.xp = () => AH.S.ledger.reduce((s, e) => s + e.amount, 0);
  E.verifyChain = () => {
    let prev = 'GENESIS';
    for (let i = 0; i < AH.S.ledger.length; i++) {
      const e = AH.S.ledger[i];
      const expect = U.hash([prev, e.id, e.amount, e.source, e.idem, e.at].join('|'));
      if (e.prev !== prev || e.hash !== expect) return { ok: false, at: i, id: e.id, total: AH.S.ledger.length };
      prev = e.hash;
    }
    return { ok: true, total: AH.S.ledger.length, head: prev };
  };

  /* ---------------- Metrics, tiers, badges ---------------- */
  E.approvedLevels = () => Object.entries(AH.S.progress.levels).filter(([, s]) => s === 'approved').map(([k]) => +k);
  E.metrics = () => ({
    xp: E.xp(), approvedLevels: E.approvedLevels(),
    approvedCount: AH.S.submissions.filter(s => s.state === 'approved').length,
    longest: AH.S.streak.longest, weeklyTop10: false, prMerged: false, track: null
  });
  E.tier = () => D.pick(D.TIERS, E.xp());
  E.nextTier = () => D.next(D.TIERS, E.xp());
  E.rank = () => D.pick(D.RANKS, E.xp());
  E.evalBadges = () => {
    const m = E.metrics(); const earned = [];
    D.BADGES.forEach(b => {
      if (AH.S.badges[b.code] || !b.cond(m)) return;
      AH.S.badges[b.code] = Date.now();
      if (b.xp) E.award({ source: 'badge_bonus', amount: b.xp, ref: `Badge · ${b.name}`, idem: `badge:${b.code}` });
      E.notify({ type: 'xp', icon: 'award', tone: 'gold', title: `Badge earned: ${b.name}`, body: `${b.desc}. +${b.xp} XP`, href: '#/achievements' });
      earned.push(b);
    });
    return earned;
  };
  E.standings = () => {
    const me = { id: 'u-me', name: E.me().name, city: E.me().city, xp: E.xp(), me: true };
    return [...D.PEERS.map(p => ({ ...p })), me].sort((a, b) => b.xp - a.xp);
  };
  E.myPos = () => { const r = E.standings(); return { pos: r.findIndex(x => x.me) + 1, total: r.length }; };

  /* ---------------- Streak (non-punitive: freeze → grace → recovery) ---------------- */
  E.touchStreak = () => {
    const st = AH.S.streak, today = U.istDay();
    if (st.status === 'recovery' || st.lastDay === today) return false;
    st.current += 1; st.longest = Math.max(st.longest, st.current); st.lastDay = today; st.status = 'active';
    st.events.unshift({ at: Date.now(), kind: 'increment', value: st.current });
    if (st.current % 7 === 0 && st.freezes < 7) {
      st.freezes += 1;
      E.notify({ type: 'streak', icon: 'snow', tone: 'ok', title: `${st.current}-day streak — freeze earned`, body: 'A freeze token protects your streak on a day you can\'t make it.' });
    }
    return true;
  };
  E.simulateMissedDay = () => {
    const st = AH.S.streak;
    st.lastDay = U.istDay(Date.now() - 2 * DAY);
    if (st.status === 'active' || st.status === 'frozen') {
      if (st.freezes > 0) {
        st.freezes -= 1; st.status = 'frozen';
        st.events.unshift({ at: Date.now(), kind: 'freeze_used', value: st.current });
        E.notify({ type: 'streak', icon: 'snow', tone: '', title: 'Streak frozen', body: `You missed a day, so a freeze token kept your ${st.current}-day streak safe.` });
      } else {
        st.status = 'grace';
        st.events.unshift({ at: Date.now(), kind: 'grace_started', value: st.current });
        E.notify({ type: 'streak', icon: 'clock', tone: 'warn', title: 'Streak at risk', body: 'Finish any activity by tomorrow midnight (IST) to keep it.' });
      }
    } else if (st.status === 'grace') {
      st.status = 'recovery'; st.prev = st.current;
      st.events.unshift({ at: Date.now(), kind: 'recoverable', value: st.current });
      E.notify({ type: 'streak', icon: 'pause', tone: '', title: `Streak paused at ${st.current}`, body: 'Recover it with a 2-minute quick win within 7 days.', href: '#/mission' });
    }
    E.audit('streak.simulated_missed_day', `${E.me().name} → ${st.status}`);
  };
  E.recoverStreak = () => {
    const st = AH.S.streak;
    if (st.status !== 'recovery') return;
    st.status = 'active'; st.current = st.prev || st.current; st.lastDay = U.istDay();
    st.events.unshift({ at: Date.now(), kind: 'recovery', value: st.current });
    E.notify({ type: 'streak', icon: 'flame', tone: 'ok', title: 'Streak recovered', body: `Back to ${st.current} days. Nice comeback.` });
  };

  /* ---------------- Learning loop (Level 1) ---------------- */
  E.actState = n => AH.S.progress.acts[n];
  const unlockNext = n => { if (n < 6 && AH.S.progress.acts[n + 1] === 'locked') AH.S.progress.acts[n + 1] = 'available'; };
  E.completeActivity = (n, ref) => {
    const p = AH.S.progress, a = D.L1.acts[n];
    if (!['available', 'completed'].includes(p.acts[n])) return { ok: false, reason: 'locked' };
    const first = p.acts[n] !== 'completed';
    p.acts[n] = 'completed';
    unlockNext(n);
    const entry = E.award({ source: 'activity_completed', amount: a.xp, ref: ref || `L1·A${n} ${D.ACTIVITY_TYPES[n - 1].name}`, idem: `act:L01:A${n}` });
    const streaked = first ? E.touchStreak() : false; // revisits are not qualifying actions
    E.evalBadges();
    if (first) { p.lastAct = Math.min(n + 1, 6); E.track('activity.completed', { level: 1, act: n }); }
    return { ok: true, entry, streaked };
  };

  /* In-browser static checks for the Build and Boss steps.
     (Production: the pushed commit runs in an isolated pytest runner.) */
  E.BUILD_TESTS = [
    { name: 'class Cookie is defined', test: c => /^class\s+Cookie\s*(\(\s*\))?\s*:/m.test(c), hint: 'Start a line with: class Cookie:' },
    { name: '__init__(self, shape) stores the shape', test: c => /def\s+__init__\s*\(\s*self\s*,\s*shape\s*\)\s*:/.test(c) && /self\.shape\s*=\s*shape/.test(c), hint: 'Inside the class: def __init__(self, shape): then self.shape = shape' },
    { name: 'oven_temp = 180 is shared (class attribute)', test: c => /^( {4}|\t)oven_temp\s*=\s*180\b/m.test(c), hint: 'Put oven_temp = 180 directly in the class body (4 spaces in), not inside __init__.' },
    { name: 'two cookies with different shapes', test: c => { const s = new Set(); const re = /^\s*\w+\s*=\s*Cookie\(\s*(["'])(.+?)\1\s*\)/gm; let m; while ((m = re.exec(c))) s.add(m[2]); return s.size >= 2; }, hint: 'At the bottom: star = Cookie("star") and heart = Cookie("heart")' }
  ];
  E.BOSS_TESTS = [
    { name: 'count starts at 0', test: c => /^( {4}|\t)count\s*=\s*0\b/m.test(c), hint: 'Add count = 0 to the class body, next to oven_temp.' },
    { name: 'count goes up by 1 per cookie', test: c => /(Cookie|cls|type\(self\))\.count\s*(\+=\s*1|=\s*(Cookie|cls|type\(self\))\.count\s*\+\s*1)/.test(c) && !/self\.count\s*\+=/.test(c), hint: 'In __init__, increase the class attribute: Cookie.count += 1 (self.count += 1 creates a personal copy instead).' },
    { name: 'total_baked() returns count', test: c => /@classmethod\s*\n\s*def\s+total_baked\s*\(\s*cls\s*\)\s*:[\s\S]*?return\s+(cls|Cookie)\.count/.test(c), hint: 'Add @classmethod on the line above def total_baked(cls): and return cls.count' }
  ];
  E.runTests = (code, suite) => suite.map(t => ({ name: t.name, pass: !!t.test(code), hint: t.hint }));
  E.STARTER = '# cookie.py — Level 1 build\n# TODO 1: create the class Cookie\n# TODO 2: give it the shared attribute oven_temp = 180\n# TODO 3: add __init__(self, shape) and store shape on self\n# TODO 4: create two cookies with different shapes\n\n';

  E.recordBuild = async (repo, code) => {
    await U.sleep(900); // simulated GitHub webhook / API latency
    const sha = U.hash(code + repo).slice(0, 7);
    AH.S.progress.commit = { sha, at: Date.now(), repo };
    AH.S.progress.repo = repo;
    E.audit('github.push_detected', `${repo} @ ${sha}`);
    return sha;
  };

  E.runBoss = code => {
    const b = AH.S.progress.boss;
    if (b.attempts >= D.L1.acts[6].attempts) return null;
    const results = E.runTests(code, E.BOSS_TESTS);
    const passed = results.filter(r => r.pass).length;
    b.attempts += 1; b.best = Math.max(b.best, passed); b.code = code;
    b.runs.unshift({ at: Date.now(), passed, total: results.length });
    E.audit('boss.attempt', `${E.me().name} · Mould Trial ${passed}/${results.length} (attempt ${b.attempts})`);
    E.track('boss.attempt', { passed });
    if (passed === results.length) E.touchStreak();
    return { results, passed };
  };

  /* AI pre-review — a suggestion only. A human reviewer always decides (REQ-EVAL-02). */
  E.aiPreReview = sub => {
    const r = sub.reflection || '', w = U.wordCount(r);
    const concept = (r.match(/\b(class|instance|object|shared|personal|attribute|classmethod)\b/gi) || []).length;
    const struggle = /struggl|stuck|confus|mistake|wrong|fix|bug|realis|learned/i.test(r);
    const tests = AH.S.progress.tests;
    const boss = sub.boss ? sub.boss.passed : 0;
    return {
      correctness: tests && tests.every(t => t.pass) ? 4 : 2,
      oop: concept >= 4 ? 4 : concept >= 2 ? 3 : 2,
      quality: sub.checklist && sub.checklist[0] ? 3 : 2,
      reflection: w >= 90 && struggle ? 4 : w >= 50 ? 3 : 1,
      boss: boss === 3 ? 4 : boss === 2 ? 3 : boss ? 2 : 1
    };
  };

  E.submitProof = ({ repo, deploy, reflection, checklist }) => {
    const p = AH.S.progress;
    if (!['available', 'completed'].includes(p.acts[5])) return { ok: false, reason: 'locked' };
    const attempt = AH.S.submissions.filter(s => s.levelIdx === 1).length + 1;
    const sub = { id: U.uid('sub'), who: 'u-me', levelIdx: 1, at: Date.now(), attempt, state: 'pending', repo, deploy, reflection, checklist,
      boss: p.boss.best ? { passed: p.boss.best, total: 3 } : null };
    sub.ai = E.aiPreReview(sub);
    AH.S.submissions.unshift(sub);
    if (p.acts[5] !== 'completed') { p.acts[5] = 'completed'; }
    E.award({ source: 'proof_submitted', amount: D.L1.acts[5].xp, ref: 'L1·A5 Submit Proof', idem: 'act:L01:A5' });
    p.acts[6] = 'in_review'; p.lastAct = 6;
    E.touchStreak();
    E.audit('submission.created', `${E.me().name} · L1 attempt ${attempt}`);
    E.notify({ type: 'review', icon: 'inbox', tone: '', title: 'Proof received', body: `Attempt ${attempt} is in the review queue. Typical turnaround: under ${D.WORKSPACE.reviewSlaHours} h. Try the Boss challenge while you wait.`, href: '#/journey/1/6' });
    E.notify({ to: 'reviewer', type: 'review', icon: 'inbox', tone: 'gold', title: `New submission: ${E.me().name}`, body: `Level 1 · attempt ${attempt}. AI pre-review suggests ${D.weighted(sub.ai).toFixed(2)}.`, href: `#/review/${sub.id}` });
    E.track('submission.created', { attempt });
    return { ok: true, sub };
  };

  E.allPending = () => [...AH.S.submissions.filter(s => s.state === 'pending'), ...AH.S.peerSubs.filter(s => s.state === 'pending')].sort((a, b) => a.at - b.at);
  E.findSub = id => AH.S.submissions.find(s => s.id === id) || AH.S.peerSubs.find(s => s.id === id);
  E.whoName = who => (who === 'u-me' ? E.me().name : (D.PEERS.find(p => p.id === who) || {}).name || 'Learner');

  E.decide = (id, scores, verdict, feedback) => {
    const sub = E.findSub(id); if (!sub || sub.state !== 'pending') return { ok: false };
    const avg = D.weighted(scores), pass = D.passes(scores);
    if (verdict === 'approved' && !pass) return { ok: false, reason: 'below_threshold' };
    const reviewer = D.PERSONAS.reviewer.name;
    sub.state = verdict; sub.review = { scores, avg, verdict, feedback, by: reviewer, at: Date.now() };
    AH.S.decided.unshift({ id: sub.id, who: sub.who, levelIdx: sub.levelIdx, at: sub.at, decidedAt: Date.now(), verdict, avg, by: reviewer });
    E.audit(`review.${verdict}`, `${E.whoName(sub.who)} · L${sub.levelIdx} attempt ${sub.attempt} (${avg.toFixed(2)})`);
    E.track('review.decided', { verdict, avg });
    if (sub.who === 'u-me') {
      const p = AH.S.progress;
      if (verdict === 'approved') {
        p.acts[6] = 'completed'; p.levels[1] = 'approved'; p.levels[2] = 'available';
        E.award({ source: 'review_approved', amount: D.L1.acts[6].baseXp, ref: `L1 review approved (${avg.toFixed(2)})`, idem: 'review:L01:approved' });
        const bossBest = p.boss.best;
        if (bossBest >= 2) E.award({ source: 'boss_bonus', amount: bossBest === 3 ? D.L1.acts[6].bossXp : 13, ref: `Boss · The Mould Trial ${bossBest}/3`, idem: 'boss:L01' });
        E.touchStreak();
        const badges = E.evalBadges();
        AH.S.celebrations.push({ kind: 'level', title: 'Level 1 complete', body: `Approved with ${avg.toFixed(2)} by ${reviewer}. Level 2 — Prompt Craft is unlocked.`, badges: badges.map(b => b.code) });
        E.notify({ type: 'review', icon: 'checkCircle', tone: 'ok', title: 'Level 1 approved', body: `${reviewer} scored your proof ${avg.toFixed(2)} / 5.${feedback ? ' “' + feedback.slice(0, 90) + (feedback.length > 90 ? '…' : '') + '”' : ''}`, href: '#/journey/1/6' });
        E.notify({ type: 'info', icon: 'unlock', tone: 'gold', title: 'Level 2 unlocked: Prompt Craft', body: 'Its activities appear as soon as your program team publishes them.', href: '#/journey' });
        E.audit('level.unlocked', `${E.me().name} · L2 (competence gate passed)`);
      } else {
        p.acts[6] = 'needs_changes'; p.acts[5] = 'available'; p.lastAct = 5;
        E.notify({ type: 'review', icon: 'refresh', tone: 'warn', title: 'Changes requested on Level 1', body: `${reviewer}: “${feedback.slice(0, 120)}${feedback.length > 120 ? '…' : ''}” Resubmit any time — you keep all XP.`, href: '#/journey/1/5' });
      }
    }
    return { ok: true, avg };
  };

  E.nudge = peerId => {
    const p = D.PEERS.find(x => x.id === peerId);
    AH.S.nudged[peerId] = Date.now();
    E.audit('mentor.nudge_sent', `${p.name} (${p.status})`);
    E.track('mentor.nudge', { status: p.status });
  };

  /* AI quota (per-learner daily) */
  E.aiUse = () => {
    const c = AH.S.chat, today = U.istDay();
    if (c.day !== today) { c.day = today; c.used = 0; }
    if (c.used >= D.AI_DAILY_QUOTA) return false;
    c.used += 1; return true;
  };

  /* DPDP-style export of everything held about the learner */
  E.exportMyData = () => JSON.stringify({
    exportedAt: new Date().toISOString(), subject: E.me(), workspace: D.WORKSPACE,
    preferences: AH.S.prefs, progress: AH.S.progress, submissions: AH.S.submissions,
    xpLedger: AH.S.ledger, streak: AH.S.streak, badges: AH.S.badges,
    posts: AH.S.posts.filter(p => p.who === 'u-me'), notifications: AH.S.notifications
  }, null, 2);
})(window.AH = window.AH || {});
</script>
