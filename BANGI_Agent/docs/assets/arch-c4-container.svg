    <rect x="12" y="64" width="120" height="18" rx="9" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.24)"/><text x="72" y="76" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#6EE7B7">primary entry</text>
