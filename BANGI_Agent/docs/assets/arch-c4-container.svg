    <text x="12" y="36" class="mono" font-size="9" fill="rgba(248,250,252,0.66)">lead • report • coach</text>
    <text x="12" y="50" class="mono" font-size="9" fill="rgba(248,250,252,0.66)">convert • campaign • market</text>
    <text x="12" y="68" class="mono" font-size="8" fill="rgba(148,163,184,0.85)">zero SOM overhead</text>
  </g>
  <g transform="translate(538,40)">
    <rect width="248" height="96" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.07)"/>
    <text x="12" y="20" class="mono" font-size="9.5" font-weight="800" fill="#C9A86A">/cua/*  (×3)</text>
    <text x="12" y="36" class="mono" font-size="9" fill="rgba(248,250,252,0.66)">capture • act • schema</text>
    <text x="12" y="50" class="mono" font-size="9" fill="rgba(248,250,252,0.66)">SOM [1][2][3] + AX tree</text>
    <text x="12" y="68" class="mono" font-size="8" fill="rgba(201,168,106,0.85)">pid-scoped • stealth</text>
  </g>
  <g transform="translate(800,40)">
    <rect width="230" height="96" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.07)"/>
    <text x="12" y="20" class="mono" font-size="9.5" font-weight="800" fill="#F8FAFC">/health • /capabilities • /docs</text>
    <text x="12" y="36" class="mono" font-size="9" fill="rgba(248,250,252,0.66)">discovery + Swagger UI</text>
    <text x="12" y="50" class="mono" font-size="9" fill="rgba(248,250,252,0.66)">+ /static/index.html (PWA)</text>
  </g>
</g>

